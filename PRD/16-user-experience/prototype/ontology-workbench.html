<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ontology Workbench</title>
<meta name="description" content="HEALIX Console — ontologist workbench: stage board, scheme tree, facets, relation board, Manchester axiom editor, competency questions, collisions and drift.">
<link rel="stylesheet" href="assets/app.css">
<style>
/* ---------------------------------------------------------------------------
   Page-local styles for the ontology workbench. Colour and type come only from
   app.css design tokens; this file adds layout for the three-pane workbench,
   facet lanes, the axiom editor and the derived-rule preview. No new colours.
   --------------------------------------------------------------------------- */
.ow-controls { display: flex; align-items: flex-end; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.ow-controls .hx-field { margin: 0; }
.ow-scheme-meta { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-caption); color: var(--fg-muted); }
.ow-scheme-meta b { color: var(--fg); font-weight: 600; }

/* stage rail extras */
.hx-stage-rail__stage.is-current { box-shadow: inset 0 -3px 0 var(--accent); }
.ow-stage-head { display: flex; align-items: center; gap: 6px; }
.ow-stage-state { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .04em; color: var(--fg-faint); }
.ow-stage-crit { margin: 0; padding: 0; list-style: none; }
.ow-stage-crit li { display: flex; align-items: flex-start; gap: 6px; padding: 3px 0; font-size: var(--fs-micro); border-top: 1px solid var(--border); }
.ow-stage-crit li:first-child { border-top: 0; }
.ow-crit-glyph { flex: none; width: 14px; text-align: center; font-weight: 700; }
.ow-crit-glyph--met { color: var(--ok-fg); }
.ow-crit-glyph--unmet { color: var(--warn-fg); }
.ow-violation { background: none; border: 0; padding: 0; color: var(--link); font: inherit; text-decoration: underline; text-align: left; cursor: pointer; }
.ow-stage-promote { margin-top: 6px; }
.ow-stage-detail > summary { cursor: pointer; font-size: var(--fs-micro); color: var(--fg-muted); list-style: none; }
.ow-stage-detail > summary::-webkit-details-marker { display: none; }
.ow-stage-detail[open] > summary { color: var(--fg); }
.ow-asof-note { display: flex; align-items: center; gap: 6px; font-size: var(--fs-caption); color: var(--time-known); margin: -8px 0 var(--sp-3); }

/* subview tabs reuse .hx-tabs */
.ow-view { min-height: 240px; }

/* three-pane workbench */
.ow-workbench { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: var(--sp-4); align-items: start; }
.ow-panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-3); }
.ow-panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.ow-panel__title { font-size: var(--fs-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); }

/* facet lane legend */
.ow-facet-legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--sp-2); }
.ow-facet-swatch { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-micro); color: var(--fg-muted); }
.ow-facet-swatch i { width: 10px; height: 10px; border-radius: 2px; background: var(--sw, var(--accent)); display: inline-block; }
.ow-facet-f0 { --sw: var(--stage-2); } .ow-facet-f1 { --sw: var(--stage-4); } .ow-facet-f2 { --sw: var(--g2); }

.ow-tree__draft { font-size: var(--fs-micro); color: var(--pending-fg); }
.ow-tree-hint { font-size: var(--fs-micro); color: var(--fg-faint); margin-top: var(--sp-2); }

/* concept card panel */
.ow-card-usage { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
.ow-stat { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 6px 8px; }
.ow-stat b { display: block; font-size: var(--fs-lead); font-variant-numeric: tabular-nums; }
.ow-stat span { font-size: var(--fs-micro); color: var(--fg-muted); }
.ow-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); margin: var(--sp-2) 0; }
.ow-kv dt { color: var(--fg-muted); } .ow-kv dd { margin: 0; }

/* relation board */
.ow-board-wrap { overflow-x: auto; }
.hx-relation-board td.is-weak { background: var(--danger-bg); }
.ow-promote-ready { margin-top: var(--sp-3); }

/* axiom editor */
.ow-axiom { display: grid; grid-template-columns: 1fr minmax(220px, 320px); gap: var(--sp-3); align-items: start; }
.ow-axiom textarea { width: 100%; min-height: 150px; font-family: var(--font-mono); font-size: var(--fs-dense); line-height: 1.5; padding: var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-sunken); color: var(--fg); resize: vertical; }
.ow-axiom textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hx-axiom-editor__elk { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); }
.ow-elk-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.ow-elk-row b { font-variant-numeric: tabular-nums; }
.ow-derived { margin-top: var(--sp-3); border: 1px dashed var(--border); border-radius: var(--r-card); padding: var(--sp-2) var(--sp-3); }
.ow-derived h4 { margin: 0 0 4px; font-size: var(--fs-caption); }
.ow-derived ul { margin: 0; padding-left: var(--sp-4); font-size: var(--fs-caption); }
.ow-autocomplete { font-size: var(--fs-micro); color: var(--fg-faint); margin-top: 4px; }

/* competency questions */
.ow-cq-controls { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.hx-cq-table code { font-size: var(--fs-micro); }

/* collisions / merge */
.ow-redirect-map { font-family: var(--font-mono); font-size: var(--fs-caption); background: var(--bg-sunken); border-radius: var(--r-ctl); padding: var(--sp-2); margin-top: var(--sp-2); }
.ow-merge-arrow { align-self: center; color: var(--fg-muted); font-size: var(--fs-h3); text-align: center; }

/* drift */
.hx-drift-inbox { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.hx-drift-inbox__item:last-child { border-bottom: 0; }
.ow-drift-meta { margin-left: auto; font-size: var(--fs-micro); color: var(--fg-muted); font-variant-numeric: tabular-nums; }

.ow-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.ow-section-head h2 { font-size: var(--fs-lead); font-weight: 600; margin: 0; }
.ow-section-head p { margin: 0; font-size: var(--fs-caption); color: var(--fg-muted); }

/* cross-scheme stage board (the /ontology entry point) */
.ow-board-intro { margin-bottom: var(--sp-3); }
.ow-board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: var(--sp-3); align-items: start; overflow-x: auto; padding-bottom: var(--sp-2); }
.ow-board__col { background: var(--bg-surface); border: 1px solid var(--border); border-top: 3px solid var(--stage-color, var(--stage-0)); border-radius: var(--r-card); padding: var(--sp-2); min-width: 190px; }
.ow-board__colhead { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.ow-board__colname { font-size: var(--fs-caption); font-weight: 600; }
.ow-board__colsub { font-size: var(--fs-micro); color: var(--fg-muted); margin-bottom: var(--sp-2); }
.ow-board__card { display: block; width: 100%; text-align: left; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 6px 8px; margin-bottom: 6px; cursor: pointer; font: inherit; color: var(--fg); }
.ow-board__card:hover { border-color: var(--accent); }
.ow-board__card:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ow-board__cardtitle { font-weight: 600; font-size: var(--fs-dense); }
.ow-board__cardmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ow-board__queue { margin-top: var(--sp-2); border-top: 1px dashed var(--border); padding-top: var(--sp-2); }
.ow-board__queuehd { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin-bottom: 4px; }
.ow-board__cr { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r-ctl); padding: 4px 6px; cursor: pointer; font: inherit; color: var(--fg); }
.ow-board__cr:hover { background: var(--bg-sunken); }
.ow-board__cr:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ow-board__cr .hx-mono { display: block; font-size: var(--fs-micro); color: var(--fg-muted); }
.ow-board__empty { font-size: var(--fs-micro); color: var(--fg-faint); padding: 2px 0; }

/* inline draft-CR review rendered in the right inspector (UX-ONT-022) */
.ow-draft-review { display: flex; flex-direction: column; gap: var(--sp-1); }
.ow-draft-review__h { margin: var(--sp-2) 0 0; font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); }
.ow-draft-review__foot { display: flex; margin-top: var(--sp-3); gap: var(--sp-2); flex-wrap: wrap; }
.ow-draft-review .hx-diff, .ow-draft-review .hx-evidence { font-size: var(--fs-micro); }
.ow-draft-derived { border: 1px dashed var(--border); border-radius: var(--r-ctl); padding: 6px 8px; font-size: var(--fs-micro); }
.ow-draft-derived ul { margin: 4px 0 0; padding-left: var(--sp-4); }

@media (max-width: 900px) {
  .ow-board { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(180px, 1fr); }
  .ow-workbench { grid-template-columns: 1fr; }
  .ow-axiom { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  .ow-controls { gap: var(--sp-2); }
}
</style>

<script src="assets/app.js"></script>
<script>
/* ===========================================================================
   ontology-workbench.html — page-local logic (ES2020, no deps).
   Builds the stage board, scheme tree browser with facet lanes, concept card,
   relation board, Manchester axiom editor with stubbed live ELK + OWL diff +
   derived-rule preview, competency-question suite, collisions/merge view and
   the drift inbox. Uses the shared HX runtime for shell, chips, diff, toasts,
   confirm sheets, as-of control and keyboard map. No edits to app.js.
   =========================================================================== */
(function () {
  "use strict";
  var el = HX.util.el, icon = HX.util.icon, clear = HX.util.clear, titleCase = HX.util.titleCase;
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var STAGE_NAMES = ["Inventory", "Controlled vocabulary", "Taxonomy", "Thesaurus", "Ontology", "Knowledge graph"];

  // ----- competency questions (CQ-01..20); no data file ships these, so the
  // page synthesises a realistic suite for the encounter-class ontology module.
  var CQ = buildCQ();

  // released OWL IRIs the axiom editor is allowed to autocomplete (brief: only
  // released IRIs). Synthesised for the clinical module.
  var RELEASED_IRIS = [
    "clinical:Encounter", "clinical:HospitalEncounter", "clinical:ObservationUnitEncounter",
    "clinical:InpatientEncounter", "clinical:EmergencyEncounter", "clinical:OutpatientEncounter",
    "clinical:VirtualVisit", "clinical:Location", "clinical:ObservationUnit", "clinical:Bed",
    "clinical:hasLocation", "clinical:hasEncounterClass", "clinical:precededBy", "clinical:terminatedBy"
  ];

  var state = {
    schemes: [],
    schemeBySlug: {},
    concepts: [],
    conceptById: {},
    crs: [],            // ontologist_approval change requests feeding the board
    board: false,       // /ontology stage-board mode (no scheme selected)
    scheme: null,       // current scheme object
    view: "tree",       // current sub-view
    selectedConcept: null,
    drafts: {}          // id -> draft CR label (in-memory only)
  };

  var draftSeq = 0;     // monotonic counter for synthesised draft-CR ids

  document.addEventListener("DOMContentLoaded", function () {
    var ctx = HX.mount({ page: "ontology-workbench.html", area: "ontology", title: "Ontology workbench" });
    Promise.all([HX.data.load("schemes"), HX.data.load("concepts"), HX.data.load("change-requests")]).then(function (res) {
      state.schemes = (res[0] && res[0].schemes) || [];
      state.concepts = (res[1] && res[1].concepts) || [];
      state.crs = (res[2] && res[2].changeRequests) || [];
      state.schemes.forEach(function (s) { state.schemeBySlug[s.slug] = s; });
      state.concepts.forEach(function (c) { state.conceptById[c.id] = c; });
      applyHash();
      render();
      ctx.main.setAttribute("aria-busy", "false");
      // replay stage rail when the as-of control moves before a release
      HX.asof.on(function () { renderStageRail(); });
    });
    window.addEventListener("hashchange", function () { if (applyHash()) render(); });
  });

  function applyHash() {
    var h = location.hash.slice(1);
    var qi = h.indexOf("?"); var route = qi < 0 ? h : h.slice(0, qi);
    var params = {}; if (qi >= 0) h.slice(qi + 1).split("&").forEach(function (p) { var kv = p.split("="); params[kv[0]] = decodeURIComponent(kv[1] || ""); });
    var changed = false;
    var m = route.match(/\/scheme\/([^\/?]+)/);
    if (m) {
      // /scheme/{slug} → the single-scheme workbench page
      var slug = m[1];
      if (!state.schemeBySlug[slug]) slug = "encounter-class";
      if (state.board || !state.scheme || state.scheme.slug !== slug) {
        state.scheme = state.schemeBySlug[slug]; state.selectedConcept = null; state.board = false; changed = true;
      }
      if (params.tab && params.tab !== state.view) { state.view = params.tab; changed = true; }
    } else {
      // /ontology (or bare) → the cross-scheme stage board
      if (!state.board) { state.board = true; changed = true; }
    }
    return changed || !state._rendered;
  }

  function setView(v) { state.view = v; writeHash(); renderView(); updateSubtabs(); }
  function setScheme(slug) { if (!state.schemeBySlug[slug]) return; state.scheme = state.schemeBySlug[slug]; state.selectedConcept = null; state.view = "tree"; state.board = false; writeHash(); render(); }
  function writeHash() {
    var base = "/scheme/" + state.scheme.slug + "?tab=" + state.view;
    var a = HX.asof.get();
    if (a.asOf) base += "&asOf=" + encodeURIComponent(a.asOf);
    if (a.asKnownAt) base += "&asKnownAt=" + encodeURIComponent(a.asKnownAt);
    try { history.replaceState(null, "", "#" + base); } catch (e) { location.hash = base; }
  }

  /* ----------------------------------------------------------------- render */
  function render() {
    var main = $("#hx-main"); state._main = main; state._rendered = true; clear(main);
    if (state.board) { renderBoard(main); return; }
    main.appendChild(buildBreadcrumb());
    main.appendChild(buildHeader());
    main.appendChild(el("div", { class: "hx-stage-rail", id: "ow-stage-rail", role: "group", "aria-label": "Ontology Pipeline stage rail" }));
    main.appendChild(el("div", { class: "ow-asof-note", id: "ow-asof-note", hidden: true }));
    main.appendChild(buildSubtabs());
    main.appendChild(el("div", { class: "ow-view", id: "ow-view", role: "region", "aria-label": "Workbench view" }));
    renderStageRail();
    renderView();
    writeHash();
  }

  /* -------------------------------------------------- cross-scheme STAGE BOARD
     UX-03 §1 / UX-00 §4: `/ontology` opens on a board with one column per stage
     (S0..S5), each holding the schemes/modules whose next unit of work sits at
     that stage, with per-column counts and the ontologist_approval CR queue
     feeding that stage. A scheme card drills into /scheme/{slug}; a CR row jumps
     to change-requests.html. */
  function renderBoard(main) {
    var bc = el("nav", { class: "hx-breadcrumb", "aria-label": "Breadcrumb" });
    bc.appendChild(HX.chip("neutral", "Ontology"));
    main.appendChild(bc);
    var head = el("header", { class: "hx-object-header" });
    head.appendChild(el("div", { class: "hx-object-header__top" }, [
      el("div", { class: "hx-object-header__titles" }, [
        el("div", { class: "hx-row" }, [HX.chip("type", "Ontology pipeline"), el("span", { class: "hx-object-header__label", text: "Stage board" })]),
        el("p", { class: "hx-caption hx-muted ow-board-intro", text: "Every concept scheme and OWL module positioned at the Ontology Pipeline stage where its next unit of work sits. Columns carry per-stage counts and the ontologist_approval review queue feeding each stage. Open a scheme to work it, or a CR to review it." })
      ])
    ]));
    main.appendChild(head);

    // bucket schemes by active stage (first stage not yet released; all released → S5)
    var bySchemeStage = [[], [], [], [], [], []];
    state.schemes.forEach(function (s) {
      bySchemeStage[activeStage(s)].push(s);
    });
    // bucket the open ontologist_approval CRs by their stage
    var openCrByStage = [[], [], [], [], [], []];
    ontologistQueue().forEach(function (cr) {
      var st = typeof cr.stage === "number" ? cr.stage : 0;
      if (st < 0) st = 0; if (st > 5) st = 5;
      openCrByStage[st].push(cr);
    });

    var board = el("div", { class: "ow-board", role: "list", "aria-label": "Ontology Pipeline stage board" });
    for (var i = 0; i < 6; i++) {
      board.appendChild(boardColumn(i, bySchemeStage[i], openCrByStage[i]));
    }
    main.appendChild(board);
    var a = HX.asof.get();
    var bh = "/ontology" + (a.asOf ? "?asOf=" + encodeURIComponent(a.asOf) : "");
    try { history.replaceState(null, "", "#" + bh); } catch (e) {}
  }

  // a scheme's "next work" stage: lowest stage whose state is not released; all
  // released means the scheme sits, complete, at Knowledge graph (S5).
  function activeStage(s) {
    var rail = s.stageRail || [];
    var cand = rail.filter(function (st) { return st.state === "candidate"; })[0];
    if (cand) return cand.stage;
    var draft = rail.filter(function (st) { return st.state !== "released"; }).sort(function (a, b) { return a.stage - b.stage; })[0];
    if (draft) return draft.stage;
    return 5;
  }
  function allReleased(s) { return (s.stageRail || []).every(function (st) { return st.state === "released"; }); }

  // open ontologist_approval CRs (the gate feeds the ontologist): not yet
  // decided (exclude applied/approved/rejected/rolled_back/vetoed).
  function ontologistQueue() {
    var closed = { applied: 1, approved: 1, rejected: 1, rolled_back: 1, vetoed: 1 };
    return (state.crs || []).filter(function (cr) {
      return (cr.gatesRequired || []).indexOf("ontologist_approval") >= 0 && !closed[cr.state];
    });
  }

  function boardColumn(stageIdx, schemes, crs) {
    var col = el("div", { class: "ow-board__col", role: "listitem" });
    col.style.setProperty("--stage-color", "var(--stage-" + stageIdx + ")");
    var hd = el("div", { class: "ow-board__colhead" });
    hd.appendChild(el("span", { class: "hx-stage-rail__num", text: stageIdx }));
    hd.appendChild(el("span", { class: "ow-board__colname", text: "S" + stageIdx + " · " + STAGE_NAMES[stageIdx] }));
    col.appendChild(hd);
    col.appendChild(el("div", { class: "ow-board__colsub", text: schemes.length + (schemes.length === 1 ? " scheme" : " schemes") + (crs.length ? " · " + crs.length + " CR" + (crs.length === 1 ? "" : "s") : "") }));
    if (!schemes.length) col.appendChild(el("div", { class: "ow-board__empty", text: "No scheme has its next work here." }));
    schemes.forEach(function (s) {
      var done = allReleased(s);
      var card = el("button", { class: "ow-board__card", "aria-label": "Open scheme " + s.label });
      card.appendChild(el("div", { class: "ow-board__cardtitle", text: s.label }));
      var meta = el("div", { class: "ow-board__cardmeta" });
      meta.appendChild(HX.groupChip(s.group));
      meta.appendChild(HX.chip(done ? "ok" : "pending", done ? "released" : "in progress"));
      meta.appendChild(HX.chip("neutral", (s.counts || {}).concepts + " concepts"));
      meta.appendChild(HX.chip("neutral", s.steward.replace(/^role\./, "")));
      card.appendChild(meta);
      card.addEventListener("click", function () { setScheme(s.slug); });
      col.appendChild(card);
    });
    var q = el("div", { class: "ow-board__queue" });
    q.appendChild(el("div", { class: "ow-board__queuehd", text: "ontologist_approval queue" }));
    if (!crs.length) q.appendChild(el("div", { class: "ow-board__empty", text: "No CRs awaiting the ontologist here." }));
    crs.forEach(function (cr) {
      var row = el("button", { class: "ow-board__cr", "aria-label": "Review " + cr.id + " in the Review area" });
      row.appendChild(el("span", { class: "hx-row", style: "gap:4px;flex-wrap:wrap" }, [
        HX.chip(cr.subtype && /OWL|SHACL|KG/.test(cr.subtype) ? "info" : "neutral", cr.subtype || "CR"),
        HX.chip(cr.riskClass === "high" ? "fail" : cr.riskClass === "medium" ? "warn" : "neutral", cr.riskClass || "risk")
      ]));
      row.appendChild(el("span", { text: cr.title }));
      row.appendChild(el("span", { class: "hx-mono", text: cr.id }));
      row.addEventListener("click", function () { HX.nav("/cr/" + cr.id); });
      q.appendChild(row);
    });
    col.appendChild(q);
    return col;
  }

  function buildBreadcrumb() {
    var s = state.scheme;
    var bc = el("nav", { class: "hx-breadcrumb", "aria-label": "Breadcrumb" });
    bc.appendChild(linkChip("Ontology", function () { HX.nav("/ontology"); }));
    bc.appendChild(el("span", { class: "hx-breadcrumb__sep", "aria-hidden": "true", text: "›" }));
    bc.appendChild(HX.groupChip(s.group));
    bc.appendChild(el("span", { class: "hx-breadcrumb__sep", "aria-hidden": "true", text: "›" }));
    bc.appendChild(HX.chip("neutral", "Scheme " + s.label));
    return bc;
  }
  function linkChip(label, onclick) { var b = el("button", { class: "hx-chip hx-chip--type", onclick: onclick }); b.appendChild(el("span", { class: "hx-chip__text", text: label })); return b; }

  function buildHeader() {
    var s = state.scheme;
    var head = el("header", { class: "hx-object-header" });
    var top = el("div", { class: "hx-object-header__top" });
    var titles = el("div", { class: "hx-object-header__titles" });
    titles.appendChild(el("div", { class: "hx-row" }, [
      HX.chip("type", "Concept scheme"),
      el("span", { class: "hx-object-header__label", text: s.label })
    ]));
    titles.appendChild(el("div", { class: "hx-object-header__id" }, [s.iri.replace(/^https?:\/\/ontology\.healix\.example\.org\//, "healix:")]));
    var chips = el("div", { class: "hx-object-header__chips" });
    chips.appendChild(HX.stepper(schemeStageState(s), { label: "pipeline", onStage: function (i) { focusStage(i); } }));
    chips.appendChild(HX.chip(worstStageState(s) === "released" ? "ok" : "pending", "release " + (s.release || "unreleased")));
    chips.appendChild(HX.groupChip(s.group));
    chips.appendChild(HX.phiChip(s.phiClass));
    chips.appendChild(HX.chip("neutral", "steward " + s.steward));
    chips.appendChild(HX.chip("neutral", "owner " + s.ownerAgent));
    if ((s.licensedSystems || []).length) chips.appendChild(el("span", { class: "hx-chip hx-chip--licensed-hidden", text: "licensed display hidden" }));
    titles.appendChild(chips);
    top.appendChild(titles);
    var actions = el("div", { class: "hx-object-header__actions" });
    var schemeSel = el("select", { "aria-label": "Switch concept scheme" }, state.schemes.map(function (x) { return el("option", { value: x.slug, text: x.label + " · " + x.group }); }));

      item.appendChild(statusGlyphText(c.state === "open" ? "warn" : c.state === "resolved" ? "ok" : "neutral", c.id));
      item.appendChild(el("span", {}, [el("b", { text: c.kind }), " · ", shortName(c.a), " ↔ ", shortName(c.b), " · similarity ", el("b", { text: c.similarity })]));
      if (c.state === "resolved") item.appendChild(el("span", { class: "ow-drift-meta", text: c.resolution }));
      else if (c.state === "open") {
        var mv = el("button", { class: "hx-btn hx-btn--sm hx-btn--primary", style: "margin-left:auto" }, ["Open merge view"]);
        mv.addEventListener("click", function () { openMergeView(c); });
        item.appendChild(mv);
        var dis = el("button", { class: "hx-btn hx-btn--sm" }, ["Dismiss"]);
        dis.addEventListener("click", function () { c.state = "dismissed"; renderView(); HX.toast(c.id + " dismissed — not a duplicate", { kind: "neutral", timeout: 3000 }); });
        item.appendChild(dis);
      } else item.appendChild(el("span", { class: "ow-drift-meta", text: c.state }));
      host.appendChild(item);
    });
    host.appendChild(el("div", { id: "ow-merge-host", style: "margin-top:16px" }));
  }
  function openMergeView(c) {
    var host = $("#ow-merge-host"); clear(host);
    var survivor = { ref: { v: c.a } };
    function draw() {
      clear(host);
      host.appendChild(el("h3", { style: "font-size:var(--fs-lead);margin:0 0 8px", text: "Merge " + c.id }));
      var mv = el("div", { class: "hx-merge-view" });
      mv.appendChild(mergeCard(c.a, survivor.ref.v === c.a));
      var arrow = el("div", { class: "ow-merge-arrow" }, ["⤵"]);
      mv.appendChild(arrow);
      mv.appendChild(mergeCard(c.b, survivor.ref.v === c.b));
      host.appendChild(mv);
      var swap = el("button", { class: "hx-btn hx-btn--sm", style: "margin-top:12px" }, [icon("undo"), "Swap survivor"]);
      swap.addEventListener("click", function () { survivor.ref.v = survivor.ref.v === c.a ? c.b : c.a; draw(); });
      host.appendChild(swap);
      var surv = survivor.ref.v, dep = surv === c.a ? c.b : c.a;
      var map = el("div", { class: "ow-redirect-map" });
      map.appendChild(el("div", { text: "Redirect map (IRIs stay resolvable):" }));
      map.appendChild(el("div", { text: shortName(dep) + "  →  " + shortName(surv) + "   [302, replacedBy banner]" }));
      host.appendChild(map);
      var imp = el("div", { class: "hx-row", style: "margin-top:8px" }, [HX.chip("info", "downstream impact"), HX.chip("neutral", "2 EDW columns"), HX.chip("neutral", "1 ConceptMap"), HX.chip("warn", "DQR-VALIDITY-ENCOUNTER-004 re-eval")]);
      host.appendChild(imp);
      var mergeBtn = el("button", { class: "hx-btn hx-btn--sm hx-btn--primary", style: "margin-top:12px" }, ["Create merge CR (survivor " + shortName(surv) + ")"]);
      mergeBtn.addEventListener("click", function () { proposeMerge(c, surv, dep); });
      host.appendChild(mergeBtn);
    }
    draw();
    host.scrollIntoView({ block: "nearest" });
  }
  // UX-ONT-020 / ONT-KG-012: confirming the merge drafts a CR-CV-MERGE; the
  // merged IRI is retained with healix:mergedInto and stays resolvable.
  function proposeMerge(c, surv, dep) {
    var draft = {
      id: makeDraftId(), subtype: "CR-CV-MERGE", risk: "high", group: state.scheme.group,
      title: "Merge " + shortName(dep) + " into " + shortName(surv),
      summary: "Survivor " + shortName(surv) + " retains the IRI; " + shortName(dep) + " keeps healix:mergedInto and stays resolvable with a replacedBy banner (ONT-KG-012). No historical assertion is deleted or rewritten.",
      diff: {
        format: "skos", a: "current", b: "draft",
        before: { survivor: surv, merged: dep, mergedInto: null, resolvable: [surv, dep] },
        after: { survivor: surv, merged: dep, mergedInto: surv, redirect: shortName(dep) + " → " + shortName(surv) + " (302 + replacedBy)", resolvable: [surv, dep] }
      },
      evidence: {
        local: [{ collision: c.id, kind: c.kind, similarity: c.similarity }],
        statistical: [{ downstream: "2 EDW columns" }, { downstream: "1 ConceptMap" }, { rule: "DQR-VALIDITY-ENCOUNTER-004 re-eval" }],
        reasoning: [{ note: "Redirect map moves every notation, mapping and relation of " + shortName(dep) + " to " + shortName(surv) + "." }]
      },
      gatesRequired: ["evaluation", "privacy_review", "steward_approval", "ontologist_approval"]
    };
    openDraftReview(draft);
    HX.toast("Draft CR-CV-MERGE: merge " + shortName(dep) + " into " + shortName(surv) + " — review in inspector", { kind: "ok", timeout: 6000 });
  }
  function mergeCard(id, isSurvivor) {
    var c = state.conceptById[id] || { id: id, labels: [] };
    var card = el("div", { class: "hx-merge-view__card" + (isSurvivor ? " hx-merge-view__card--survivor" : "") });
    card.appendChild(el("div", { class: "hx-row" }, [HX.chip(isSurvivor ? "ok" : "neutral", isSurvivor ? "survivor" : "merged away"), el("b", { text: pref(c) })]));
    card.appendChild(el("div", { class: "hx-mono hx-caption", text: shortName(id) }));
    if (c.definition && c.definition.text) card.appendChild(el("p", { class: "hx-caption hx-muted", text: c.definition.text }));
    if ((c.notations || []).length) { var nr = el("div", { class: "hx-row", style: "margin-top:4px" }); c.notations.forEach(function (n) { nr.appendChild(HX.codeChip(n.system, n.code, null)); }); card.appendChild(nr); }
    return card;
  }

  /* ----------------------------------------------------------- DRIFT */
  function renderDriftView(host) {
    var s = state.scheme;
    host.appendChild(sectionHead("Drift inbox", "New source CODE_VALUEs and lookups with no covering concept. agent.inventory raises these; each links to the CR type that resolves it."));
    var drift = s.drift || [];
    if (!drift.length) { host.appendChild(emptyState("No drift in the last 7 days", "agent.inventory watches every source code set for values outside the current vocabulary.", "Nothing to propose")); return; }
    var box = el("div", { class: "hx-drift-inbox", role: "list", "aria-label": "Drift inbox" });
    drift.forEach(function (d) {
      var item = el("div", { class: "hx-drift-inbox__item", role: "listitem" });
      item.appendChild(d.coveringConcept ? HX.chip("pending", "bind") : HX.chip("warn", "new"));
      item.appendChild(HX.codeChip("cs" + d.codeSet, String(d.codeValue), d.display, { untrusted: true }));
      if (d.coveringConcept) item.appendChild(el("span", { class: "hx-caption" }, ["covered by ", linkConcept(d.coveringConcept)]));
      else item.appendChild(el("span", { class: "hx-caption hx-muted", text: "no covering concept" }));
      item.appendChild(el("span", { class: "ow-drift-meta", text: d.frequency7d.toLocaleString() + "/7d · " + d.facilities + " fac · first " + d.firstSeen.slice(0, 10) }));
      var cr = el("button", { class: "hx-btn hx-btn--sm hx-btn--primary" }, ["Propose " + d.suggestedCr]);
      cr.addEventListener("click", function () { proposeFromDrift(d); });
      item.appendChild(cr);
      box.appendChild(item);
    });
    host.appendChild(box);
  }
  function linkConcept(id) { var b = el("button", { class: "ow-violation" }, [conceptLabel(id)]); b.addEventListener("click", function () { setView("tree"); selectConcept(id); }); return b; }
  // UX-ONT-021: the drift "propose" drafts a typed CR (CR-CV-ADD / CR-CV-BIND)
  // reviewable inline; frequency stays masked/aggregate, nothing patient-level.
  function proposeFromDrift(d) {
    var subtype = d.suggestedCr || "CR-CV-ADD";
    var isBind = /BIND/.test(subtype);
    var newId = state.scheme.slug + "/" + slugify(d.display);
    var draft = {
      id: makeDraftId(), subtype: subtype, risk: "low", group: state.scheme.group,
      title: (isBind ? "Bind " : "Propose concept for ") + d.display,
      summary: "From the drift inbox: " + d.display + " (cs" + d.codeSet + " " + d.codeValue + ") observed by agent.inventory with no covering concept. Agent-drafted content is badged and never auto-approved (ONT-CV-010).",
      diff: {
        format: "skos", a: "current", b: "draft",
        before: isBind ? { concept: d.coveringConcept || null, binding: "unbound", notation: "cs" + d.codeSet + "^" + d.codeValue } : { concept: null, notation: "cs" + d.codeSet + "^" + d.codeValue },
        after: isBind
          ? { concept: d.coveringConcept || newId, binding: "bound", notation: "cs" + d.codeSet + "^" + d.codeValue }
          : { concept: newId, prefLabel: d.display, notation: "cs" + d.codeSet + "^" + d.codeValue, binding: "local-only", stage: 1 }
      },
      evidence: {
        sourceElements: [{ element: "cs" + d.codeSet + ".CODE_VALUE." + d.codeValue, frequency7d: d.frequency7d, facilities: d.facilities, firstSeen: d.firstSeen, masked: true, note: "aggregate only; nothing patient-level" }],
        agentRationale: { text: "agent.inventory: '" + d.display + "' appeared " + d.frequency7d + " times in 7 days across " + d.facilities + " facilities with no covering concept." }
      },
      gatesRequired: ["evaluation", "privacy_review", "steward_approval"]
    };
    openDraftReview(draft);
    HX.toast("Draft " + subtype + " for " + d.display + " — review in inspector", { kind: "ok", timeout: 6000 });
  }

  /* ----------------------------------------------------------- helpers */
  function sectionHead(title, sub) { return el("div", { class: "ow-section-head" }, [el("div", {}, [el("h2", { text: title }), el("p", { text: sub })])]); }
  function emptyState(title, body, ctaLabel, noCr) {
    var e = el("div", { class: "hx-empty" }, [el("div", { text: title }), el("div", { class: "hx-caption", style: "margin-top:4px", text: body })]);
    if (ctaLabel) e.appendChild(el("div", { class: "hx-empty__cta" }, [cta(ctaLabel, function () { HX.toast(noCr ? ctaLabel : "Draft created: " + ctaLabel, { kind: noCr ? "info" : "ok", timeout: 3000 }); })]));
    return e;
  }
  function cta(label, onclick) { var b = el("button", { class: "hx-btn hx-btn--sm hx-btn--primary" }, [label]); b.addEventListener("click", onclick); return b; }
  function statusGlyphText(kind, text) { var map = { ok: "✓", pass: "✓", warn: "△", fail: "⬣", neutral: "–", pending: "◴", info: "ⓘ" }; return el("span", { class: "hx-chip hx-chip--" + kind }, [el("span", { class: "hx-chip__glyph", "aria-hidden": "true", text: map[kind] || "" }), el("span", { class: "hx-chip__text", text: text })]); }
  function pref(c) { var l = (c.labels || []).filter(function (x) { return x.role === "pref" && x.lang === "en"; })[0] || (c.labels || [])[0]; return l ? l.value : shortName(c.id); }
  function conceptLabel(id) { var c = state.conceptById[id]; return c ? pref(c) : titleCase(shortName(id)); }
  function shortName(id) { return String(id).split("/").pop(); }
  function cssId(id) { return String(id).replace(/[^A-Za-z0-9_-]/g, "_"); }

  /* ------------------------------------------------- inline draft-CR review
     UX-ONT-022: every authoring gesture drafts a typed CR and MUST be
     reviewable inline in the inspector with its diff, evidence and gates; the
     full review is one click away in change-requests.html (UX-CR-001). This is
     the shared surface every gesture (set-broader, move, relation promote,
     merge, drift propose, axiom) routes through. */
  function makeDraftId() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var stamp = "" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate());
    draftSeq += 1;
    return "CR-" + stamp + "-DRAFT" + pad(draftSeq);
  }
  function riskKind(risk) { return risk === "high" ? "fail" : risk === "medium" ? "warn" : "neutral"; }
  function camel(s) { return String(s || "related").replace(/[^A-Za-z0-9]+(.)?/g, function (_, c) { return c ? c.toUpperCase() : ""; }).replace(/^./, function (c) { return c.toLowerCase(); }); }
  function slugify(s) { return String(s || "concept").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  // live PH-2 (facet discipline) / PH-5 (redundant parent) checks for a reparent
  function runPolyChecks(childId, parentId) {
    var child = state.conceptById[childId] || {};
    var ancestors = broaderClosure(parentId);
    var ph5 = ancestors.indexOf(childId) >= 0 || (child.broader || []).indexOf(parentId) >= 0 ? "fail" : "pass"; // cycle / already-a-parent
    var parent = state.conceptById[parentId] || {};
    var cf = Object.keys(child.facets || {}), pf = Object.keys(parent.facets || {});
    var shared = cf.filter(function (k) { return pf.indexOf(k) >= 0; });
    var ph2 = !cf.length || !pf.length || shared.length ? "pass" : "warn"; // orthogonal facet discipline
    return { ph2: ph2, ph5: ph5, pass: ph2 === "pass" && ph5 === "pass" };
  }
  function broaderClosure(id) {
    var out = [], seen = {}, stack = [id];
    while (stack.length) {
      var cur = stack.pop(); var c = state.conceptById[cur];
      (c && c.broader || []).forEach(function (b) { if (!seen[b]) { seen[b] = true; out.push(b); stack.push(b); } });
    }
    return out;
  }

  function openDraftReview(draft) {
    var wrap = el("div", { class: "ow-draft-review" });
    var head = el("div", {});
    head.appendChild(el("div", { class: "hx-row", style: "gap:4px;flex-wrap:wrap" }, [
      HX.chip("type", draft.subtype),
      HX.chip("pending", "draft"),
      draft.risk ? HX.chip(riskKind(draft.risk), draft.risk + " risk") : null,
      draft.group ? HX.groupChip(draft.group) : null
    ].filter(Boolean)));
    head.appendChild(el("div", { class: "hx-mono hx-caption", text: draft.id }));
    head.appendChild(el("div", { class: "hx-lead", style: "font-size:var(--fs-dense);font-weight:600", text: draft.title }));
    if (draft.summary) head.appendChild(el("p", { class: "hx-caption hx-muted", text: draft.summary }));
    wrap.appendChild(head);

    wrap.appendChild(el("div", { class: "ow-draft-review__h", text: "Diff" }));
    var diffHost = el("div", {}); wrap.appendChild(diffHost); HX.diff(diffHost, draft.diff);

    if (draft.derived && draft.derived.length) {
      wrap.appendChild(el("div", { class: "ow-draft-review__h", text: "Derived SHACL / DQ rules regenerated" }));
      var dv = el("div", { class: "ow-draft-derived" });
      var dul = el("ul", {}); draft.derived.forEach(function (d) { dul.appendChild(el("li", {}, [d])); }); dv.appendChild(dul);
      wrap.appendChild(dv);
    }

    wrap.appendChild(el("div", { class: "ow-draft-review__h", text: "Evidence" }));
    var evHost = el("div", {}); wrap.appendChild(evHost); HX.evidence(evHost, draft.evidence);

    wrap.appendChild(el("div", { class: "ow-draft-review__h", text: "Gates" }));
    var gHost = el("div", {}); wrap.appendChild(gHost); HX.gates(gHost, draft.gatesRequired, []);
    wrap.appendChild(el("p", { class: "hx-caption hx-muted", text: "Draft — no gate decided yet. Agent-drafted content is badged and never auto-approved (ONT-CV-010)." }));

    var foot = el("div", { class: "ow-draft-review__foot" });
    var jump = el("button", { class: "hx-btn hx-btn--sm hx-btn--primary" }, [icon("review"), "Open full review"]);
    jump.addEventListener("click", function () { HX.nav("/cr/" + draft.id); });
    foot.appendChild(jump);
    var discard = el("button", { class: "hx-btn hx-btn--sm" }, ["Discard draft"]);
    discard.addEventListener("click", function () { if (typeof draft.onDiscard === "function") draft.onDiscard(); HX.inspector.close(); HX.toast("Draft discarded", { kind: "neutral", timeout: 2000 }); });
    foot.appendChild(discard);
    wrap.appendChild(foot);

    HX.inspector.open(wrap, draft.subtype + " · draft");
    HX.live(draft.subtype + " draft opened in the inspector with its diff, evidence and gates.", "polite");
    return draft;
  }
  function conceptSourceEvidence(id) {
    var c = state.conceptById[id] || {};
    return (c.notations || []).map(function (n) { return { element: n.system + "." + n.code, display: n.display, masked: true, note: "aggregate only; nothing patient-level" }; });
  }

  function buildCQ() {
    var P = "PREFIX c: <https://ontology.healix.example.org/clinical/>\n";
    var mk = function (n, text, status, rows, sparql, explain) { return { id: "CQ-" + String(n).padStart(2, "0"), text: text, status: status, rows: rows, lastRun: n % 3 === 0 ? "2 h ago" : "today", sparql: P + sparql, explain: explain }; };
    return [
      mk(1, "Which encounter classes are hospital-based?", "pass", 7, "SELECT ?e WHERE { ?e rdfs:subClassOf* c:HospitalEncounter }", "transitive subClassOf closure"),
      mk(2, "What is the parent of Observation unit encounter?", "changed", 1, "SELECT ?p WHERE { c:ObservationUnitEncounter rdfs:subClassOf ?p }", "direct superclass after CR-20261017-01J9ZK"),
      mk(3, "Which classes are disjoint with Virtual visit?", "pass", 4, "SELECT ?e WHERE { ?e owl:disjointWith c:VirtualVisit }", "disjointness axioms"),
      mk(4, "Which encounter classes have a bed-type location?", "pass", 3, "SELECT ?e WHERE { ?e c:hasLocation ?l . ?l a c:Bed }", "existential hasLocation"),
      mk(5, "Which concepts are bound to an EDW column?", "pass", 44, "SELECT ?c WHERE { ?c healix:boundTo ?col }", "binding predicate coverage"),
      mk(6, "Which concepts lack a SNOMED mapping?", "fail", 3, "SELECT ?c WHERE { FILTER NOT EXISTS { ?c skos:exactMatch ?s } }", "unmapped concepts remain"),
      mk(7, "Which encounter classes precede inpatient?", "pass", 2, "SELECT ?e WHERE { ?e c:precededBy c:InpatientEncounter }", "associative precedes"),
      mk(8, "Which observation concepts are shorter than 48h?", "pass", 1, "SELECT ?e WHERE { ?e c:maxDurationHours ?h FILTER(?h < 48) }", "datatype restriction"),
      mk(9, "Which concepts are local-only (no external code)?", "changed", 3, "SELECT ?c WHERE { ?c healix:binding 'local-only' }", "local-only vocabulary"),
      mk(10, "Which classes are leaves in the hierarchy?", "pass", 11, "SELECT ?c WHERE { FILTER NOT EXISTS { ?x rdfs:subClassOf ?c } }", "leaf nodes"),
      mk(11, "Which encounter classes map to FHIR Encounter.class?", "pass", 9, "SELECT ?c WHERE { ?c healix:fhirPath 'Encounter.class' }", "FHIR binding"),
      mk(12, "Which concepts changed label in the last 30 days?", "pass", 1, "SELECT ?c WHERE { ?c dcterms:modified ?d FILTER(?d > '2026-09-17') }", "recent corrections"),
      mk(13, "Which relations are ≥ 30 days in review?", "pass", 1, "SELECT ?r WHERE { ?r healix:daysInReview ?d FILTER(?d >= 30) }", "promotion-ready relations"),
      mk(14, "Which concepts are flagged in a collision?", "pass", 2, "SELECT ?c WHERE { ?col healix:collides ?c }", "open collisions"),
      mk(15, "Which concepts carry a scope note?", "pass", 2, "SELECT ?c WHERE { ?c skos:scopeNote ?n }", "scope notes present"),
      mk(16, "Which classes are outside OWL 2 EL?", "pass", 0, "SELECT ?c WHERE { ?c healix:profile 'DL' }", "profile check"),
      mk(17, "Which concepts have a Spanish prefLabel?", "pass", 1, "SELECT ?c WHERE { ?c skos:prefLabel ?l FILTER(lang(?l)='es') }", "multilingual labels"),
      mk(18, "Which concepts are deprecated or merged?", "pass", 1, "SELECT ?c WHERE { ?c owl:deprecated true }", "lifecycle"),
      mk(19, "Which EDW columns need a range change after release?", "changed", 2, "SELECT ?col WHERE { ?col healix:rangeChanged true }", "CQ-19 range drift"),
      mk(20, "Which concepts have no DQ rule targeting them?", "fail", 5, "SELECT ?c WHERE { FILTER NOT EXISTS { ?r healix:targets ?c } }", "DQ coverage gaps")
    ];
  }
})();
</script>
