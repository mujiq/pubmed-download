<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HEALIX Governance</title>
  <meta name="description" content="Governance and preferences for the HEALIX knowledge platform: PHI classification, access matrix, audit explorer, break-glass reviews, consent, lineage coverage, stewardship directory, data contracts and per-viewer preferences. Synthetic data only; the only PHI surface is the audited remediation workspace, not this console.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only. All colour comes from app.css tokens (§5.1).
       Governance surfaces: PHI classification · Access matrix · Audit explorer ·
       Break-glass reviews · Consent · Lineage coverage · Stewardship directory ·
       Data contracts · Preferences. No PHI is shown here — tokens and hashes only.
       Reflows to one column at phone width; wide tables scroll inside their own
       container so the page itself never scrolls horizontally at 390px. */
    .sr-skip { position: absolute; left: -999px; top: 0; }
    .sr-skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 6px 10px; border-radius: var(--r-ctl); }

    .gov__intro { display: flex; align-items: baseline; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .gov__intro h1 { font-size: var(--fs-h2); line-height: var(--lh-h2); }
    .gov__intro p { color: var(--fg-muted); font-size: var(--fs-dense); margin: 0; max-width: 68ch; }
    .gov__intro-meta { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }

    .gov-panel { animation: gov-fade var(--dur-panel) var(--ease); }
    @keyframes gov-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .gov-panel { animation: none; } }

    .gov-section { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-raised); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); min-width: 0; }
    .gov-section > h2 { font-size: var(--fs-lead); font-weight: 600; display: flex; align-items: center; gap: var(--sp-2); margin-bottom: 2px; }
    .gov-section__sub { font-size: var(--fs-caption); color: var(--fg-muted); margin-bottom: var(--sp-3); max-width: 68ch; }
    .gov-section__head { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .gov-section__head h2 { margin: 0; }
    .gov-section__head .gov-section__sub { margin: 0; flex-basis: 100%; }

    .gov-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 calc(-1 * var(--sp-2)); padding: 0 var(--sp-2); }

    .gov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .gov-stat { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2) var(--sp-3); }
    .gov-stat__k { font-size: var(--fs-micro); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 4px; }
    .gov-stat__v { font-size: var(--fs-h3); line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .gov-stat__v small { font-size: var(--fs-caption); font-weight: 400; color: var(--fg-muted); }
    .gov-stat__note { font-size: var(--fs-micro); color: var(--fg-muted); margin-top: 2px; }

    .gov-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-3); }
    .gov-countchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border: 1px solid var(--border); border-radius: var(--r-pill); font-size: var(--fs-caption); background: var(--bg-surface); cursor: pointer; }
    .gov-countchip b { font-variant-numeric: tabular-nums; }
    .gov-countchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .gov-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid var(--border-strong); }

    /* PHI classification table */
    .hx-phi-tree th { text-align: left; padding: 6px 8px; font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; border-bottom: 1px solid var(--border); background: var(--bg-surface); position: sticky; top: 0; white-space: nowrap; }
    .hx-phi-tree td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .hx-phi-tree tbody tr { cursor: pointer; }
    .hx-phi-tree tbody tr:hover { background: var(--bg-sunken); }
    .hx-phi-tree tbody tr[aria-selected="true"] { background: var(--info-bg); }
    .hx-phi-tree tbody tr.is-dim { opacity: .5; }
    .gov-num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--font-mono); font-size: var(--fs-caption); }
    .gov-paths { display: flex; flex-wrap: wrap; gap: 4px; }

    /* simulate access */
    .gov-simulate { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-2); align-items: end; }
    .gov-verdict { margin-top: var(--sp-3); padding: var(--sp-3); border-radius: var(--r-ctl); border: 1px solid var(--border); background: var(--bg-sunken); display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
    .gov-verdict__decision { font-size: var(--fs-lead); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .gov-verdict__decision.is-allow { color: var(--ok-fg); }
    .gov-verdict__decision.is-deny { color: var(--danger-fg); }
    .gov-verdict__rule { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--fg-muted); }

    .hx-access-matrix th { background: var(--bg-sunken); color: var(--fg-muted); font-weight: 600; font-size: var(--fs-caption); white-space: nowrap; position: sticky; top: 0; }
    .hx-access-matrix th[scope="row"] { text-align: left; font-family: var(--font-mono); font-size: var(--fs-micro); white-space: nowrap; background: var(--bg-surface); position: sticky; left: 0; }
    .hx-access-matrix td { text-align: center; cursor: pointer; font-size: 0; min-width: 34px; }
    .hx-access-matrix td .gov-cellglyph { font-size: var(--fs-caption); font-family: var(--font-ui); }
    .hx-access-matrix td.is-sel { outline: 2px solid var(--focus); outline-offset: -2px; }
    .hx-access-matrix td.is-allow { color: var(--ok-fg); }
    .hx-access-matrix td.is-deny { color: var(--danger-fg); }

    /* audit */
    .gov-agg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3); align-items: start; margin-bottom: var(--sp-3); }
    .hx-audit-table th { background: var(--bg-sunken); color: var(--fg-muted); font-weight: 600; font-size: var(--fs-caption); white-space: nowrap; position: sticky; top: 0; font-family: var(--font-ui); }
    .hx-audit-table tbody tr:hover { background: var(--bg-sunken); }
    .gov-hashchain { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-caption); }
    .gov-barrow { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2); align-items: center; font-size: var(--fs-caption); padding: 3px 0; }
    .gov-barrow__track { height: 10px; border-radius: var(--r-pill); background: var(--border); overflow: hidden; }
    .gov-barrow__fill { height: 100%; background: var(--accent); border-radius: var(--r-pill); }
    .gov-barrow__n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* break-glass reviews */
    .gov-bg { border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-3); margin-bottom: var(--sp-3); background: var(--bg-surface); }
    .gov-bg.is-pending { border-left: 3px solid var(--warn-fg); }
    .gov-bg.is-reviewed { border-left: 3px solid var(--ok-fg); }
    .gov-bg__head { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-2); }
    .gov-bg__title { font-family: var(--font-mono); font-weight: 600; }
    .gov-bg__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2) var(--sp-3); margin: var(--sp-2) 0; }
    .gov-bg__kv .k { font-size: var(--fs-micro); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .03em; }
    .gov-bg__kv .v { font-size: var(--fs-dense); font-family: var(--font-mono); }
    .gov-bg__entities { display: flex; flex-wrap: wrap; gap: 6px; }
    .gov-bg__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }

    /* lineage coverage */
    .gov-lin { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-3); align-items: start; }
    .gov-callout { border-left: 3px solid var(--ok-border); background: var(--ok-bg); color: var(--ok-fg); padding: var(--sp-2) var(--sp-3); border-radius: 0 var(--r-ctl) var(--r-ctl) 0; font-size: var(--fs-dense); display: flex; gap: 8px; align-items: flex-start; }

    /* stewardship */
    .gov-stw-table { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .gov-stw-table th { text-align: left; padding: 6px 8px; font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .gov-stw-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .gov-stw-table tr.is-atrisk td { background: var(--warn-bg); }

    /* preferences */
    .gov-pref { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--sp-3); align-items: start; }
    .gov-pref fieldset { border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-3); margin: 0; }
    .gov-pref legend { font-size: var(--fs-caption); font-weight: 600; padding: 0 6px; }
    .gov-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); overflow: hidden; }
    .gov-seg button { min-height: 30px; padding: 0 12px; border: 0; background: var(--bg-surface); color: var(--fg-muted); font-size: var(--fs-dense); cursor: pointer; }
    .gov-seg button + button { border-left: 1px solid var(--border); }
    .gov-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .gov-switch { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: 6px 0; font-size: var(--fs-dense); }
    .gov-range { width: 100%; }
    .gov-range__val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .gov-help { font-size: var(--fs-micro); color: var(--fg-muted); margin-top: 4px; }

    .gov-rowwrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .gov-note { font-size: var(--fs-caption); color: var(--fg-muted); display: flex; gap: 6px; align-items: flex-start; }
    .gov-note .hx-icon { flex: none; margin-top: 1px; }

    @media (max-width: 640px) {
      .gov__intro-meta { margin-left: 0; flex-basis: 100%; }
    }
  </style>
</head>

  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, titleCase = HX.util.titleCase;
    var TODAY = Date.now();

    HX.mount({ page: "settings-governance", title: "HEALIX Governance", area: "gov" });

    var root = document.getElementById("gov-root");
    var INC = {};      // incidents.json governance subset
    var KPI = {};      // kpis.json (lineage-coverage)
    // mutable in-memory copies so decisions/proposals persist across tab switches this session
    var BG = [];       // break-glass sessions
    var SESSION_AUDIT = []; // governance actions taken in this page (merged with HX.audit.list())
    var prefs = { blindReview: 0 };

    /* ---------------- tab model (brief §4.11, order fixed) ---------------- */
    var TABS = [
      { id: "phi", label: "PHI classification" },
      { id: "access", label: "Access matrix" },
      { id: "audit", label: "Audit explorer" },
      { id: "breakglass", label: "Break-glass reviews" },
      { id: "consent", label: "Consent" },
      { id: "lineage", label: "Lineage coverage" },
      { id: "stewardship", label: "Stewardship directory" },
      { id: "contracts", label: "Data contracts" },
      { id: "prefs", label: "Preferences" }
    ];
    var current = "phi";

    /* ---------------- small helpers ---------------- */
    function hashParams() {
      var h = location.hash.slice(1), qi = h.indexOf("?"), out = { route: qi < 0 ? h : h.slice(0, qi), params: {} };
      if (qi >= 0) h.slice(qi + 1).split("&").forEach(function (p) { var kv = p.split("="); if (kv[0]) out.params[kv[0]] = decodeURIComponent(kv[1] || ""); });
      return out;
    }
    function tabFromHash() {
      var hp = hashParams();

        tr.appendChild(E("td", {}, [d.version]));

        tr.appendChild(E("td", {}, [E("span", { class: "hx-chip hx-chip--" + (breached ? "fail" : "pass") }, [E("span", { class: "hx-chip__glyph", "aria-hidden": "true" }, [breached ? "✕" : "✓"]), E("span", { class: "hx-chip__text" }, [d.state])])]));
        tb.appendChild(tr);
      });
      table.appendChild(tb); scroll.appendChild(table); sec.appendChild(scroll);
      sec.appendChild(E("p", { class: "gov-note", style: "margin-top:var(--sp-2)" }, [I("warn"), "DC-002 (hc.kg.assertion.v1 → kg-sink) is breached: schema v5 added a non-defaulted field and was rolled back (INC-01JA0S9). The replay to backfill prov_activity_iri awaits approval."]));
      panel.appendChild(sec);
    }

    /* ======================================================= 9 · Preferences */
    function renderPrefs(panel) {
      var wrap = E("div", { class: "gov-pref" });
      // appearance
      var fs1 = E("fieldset", {}, [E("legend", {}, ["Appearance"])]);
      fs1.appendChild(prefRow("Theme", seg(["system", "light", "dark"], HX.theme.get(), function (v) { HX.theme.set(v); HX.toast("Theme: " + v, { kind: "neutral", timeout: 2000 }); }), "Follows the OS by default; your choice is remembered on this device."));
      fs1.appendChild(prefRow("Density", seg(["comfortable", "compact"], HX.density.get(), function (v) { HX.density.set(v); HX.toast("Density: " + v, { kind: "neutral", timeout: 2000 }); }), "Compact uses 12/16 type and 28px rows."));
      var resetBtn = E("button", { class: "hx-btn hx-btn--sm" }, ["Reset inspector width"]);
      resetBtn.addEventListener("click", function () { HX.util.store.del("inspectorWidth"); document.documentElement.style.setProperty("--inspector-w", "400px"); HX.toast("Inspector width reset to 400px", { kind: "ok", timeout: 2500 }); });
      fs1.appendChild(E("div", { class: "gov-switch" }, [E("span", {}, ["Inspector width"]), resetBtn]));
      wrap.appendChild(fs1);

      // keyboard
      var fs2 = E("fieldset", {}, [E("legend", {}, ["Keyboard"])]);
      var kbSwitch = E("div", { class: "gov-switch" });
      kbSwitch.appendChild(E("label", { for: "gov-keys" }, ["Single-key shortcuts"]));
      var kb = E("input", { type: "checkbox", id: "gov-keys" }); kb.checked = HX.keys.enabled();
      kb.addEventListener("change", function () { HX.keys.enabled(kb.checked); HX.toast("Shortcuts " + (kb.checked ? "enabled" : "disabled"), { kind: "neutral", timeout: 2000 }); });
      kbSwitch.appendChild(kb);
      fs2.appendChild(kbSwitch);
      fs2.appendChild(E("p", { class: "gov-help" }, ["Shortcuts are always suspended while a text field is focused. Open the full map with ? or the help button."]));
      var showMap = E("button", { class: "hx-btn hx-btn--sm", style: "margin-top:6px" }, [I("help"), "Open keyboard map"]);
      showMap.addEventListener("click", function () { HX.keys.open(); });
      fs2.appendChild(showMap);
      wrap.appendChild(fs2);

      // review
      var fs3 = E("fieldset", {}, [E("legend", {}, ["Review"])]);
      var rangeWrap = E("div", {});
      rangeWrap.appendChild(E("label", { for: "gov-blind" }, ["Blind-review share"]));
      var range = E("input", { type: "range", min: "0", max: "50", step: "5", value: String(prefs.blindReview), id: "gov-blind", class: "gov-range", "aria-describedby": "gov-blind-val" });
      var rv = E("div", { class: "gov-help" }, [E("span", { id: "gov-blind-val", class: "gov-range__val" }, [prefs.blindReview + "%"]), " of CR reviews hide the evaluator score until you decide (reduces anchoring)."]);
      range.addEventListener("input", function () { prefs.blindReview = +range.value; HX.util.store.set("blindReview", prefs.blindReview); document.getElementById("gov-blind-val").textContent = prefs.blindReview + "%"; });
      rangeWrap.appendChild(range); rangeWrap.appendChild(rv);
      fs3.appendChild(rangeWrap);
      wrap.appendChild(fs3);

      // notifications
      var fs4 = E("fieldset", {}, [E("legend", {}, ["Notification rules"])]);
      fs4.appendChild(E("p", { class: "gov-help", style: "margin-bottom:8px" }, ["Each rule routes a saved view + inbox lane to a channel."]));
      var rules = [
        { view: "Needs you · phi_affecting", lane: "Needs you", channel: "email + push" },
        { view: "At risk · G2 band drop", lane: "At risk", channel: "push" },
        { view: "FYI · watched objects", lane: "FYI", channel: "digest" }
      ];
      rules.forEach(function (r) {
        var row = E("div", { class: "hx-notification-rule" }, [
          HX.chip("info", r.lane), E("span", { class: "hx-mono hx-caption" }, [r.view]),
          E("span", { style: "margin-left:auto" }, [r.channel])
        ]);
        fs4.appendChild(row);
      });
      var addRule = E("button", { class: "hx-btn hx-btn--sm", style: "margin-top:6px" }, [I("inbox"), "Add rule"]);
      addRule.addEventListener("click", function () { HX.toast("Notification-rule editor (stub)", { kind: "neutral", timeout: 2500 }); });
      fs4.appendChild(addRule);
      wrap.appendChild(fs4);

      var sec = E("div", { class: "gov-section" });
      sec.appendChild(E("div", { class: "gov-section__head" }, [E("h2", {}, [I("user"), "Preferences"]),
        E("p", { class: "gov-section__sub" }, ["Per-viewer settings only. Nothing but role, theme, density, inspector width, saved views and recent ids is stored on this device; no result payloads are persisted."])]));
      sec.appendChild(wrap);
      panel.appendChild(sec);
    }
    function prefRow(label, control, help) {
      var box = E("div", { style: "margin-bottom:var(--sp-3)" });
      box.appendChild(E("div", { class: "gov-switch" }, [E("span", {}, [label]), control]));
      if (help) box.appendChild(E("div", { class: "gov-help" }, [help]));
      return box;
    }
    function seg(opts, val, cb) {
      var g = E("div", { class: "gov-seg", role: "group" });
      opts.forEach(function (o) {
        var b = E("button", { "aria-pressed": o === val ? "true" : "false", type: "button" }, [titleCase(o)]);
        b.addEventListener("click", function () { HX._.$$("button", g).forEach(function (x) { x.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); cb(o); });
        g.appendChild(b);
      });
      return g;
    }

    /* ---------------- palette provider (Act verbs scoped to this page) ---------------- */
    HX.palette.register(function (q) {
      var verbs = [
        { label: "Go to Audit explorer", action: function () { setTab("audit"); } },
        { label: "Go to Break-glass reviews", action: function () { setTab("breakglass"); } },
        { label: "Go to Access matrix", action: function () { setTab("access"); } },
        { label: "Go to Preferences", action: function () { setTab("prefs"); } }
      ].filter(function (v) { return !q || v.label.toLowerCase().indexOf(q.toLowerCase()) >= 0; });
      if (!verbs.length) return null;
      return { group: "Governance", items: verbs };
    });

    /* ---------------- boot ---------------- */
    Promise.all([HX.data.load("incidents"), HX.data.load("kpis")]).then(function (res) {
      INC = res[0] || {}; KPI = res[1] || {};
      prefs.blindReview = +HX.util.store.get("blindReview", 0) || 0;
      BG = (INC.breakGlassSessions || []).map(function (b) { return Object.assign({}, b); });
      current = tabFromHash();
      renderShell();
      renderPanel();
      // re-render when View-as changes (refreshes intro label + audit session rows)
      HX.role.on(function () {
        var intro = HX._.$(".gov__intro-meta .hx-chip--neutral", root);
        if (intro) { HX._.clear(intro); intro.appendChild(E("span", { class: "hx-chip__text" }, ["Viewing role: " + roleLabel(HX.role.get())])); }
        if (current === "audit") renderPanel();
      });
      // respond to drill-in hash changes (e.g. /gov?tab=lineage, /steward/…)
      window.addEventListener("hashchange", function () { var t = tabFromHash(); if (t !== current) setTab(t, false); });
    });
  })();
  </script>
</body>
</html>
