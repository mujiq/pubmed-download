<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HEALIX Console — Agents &amp; Operations</title>
  <meta name="description" content="Keep autonomy honest: the fleet board of 20 agents, agent pages (manifest, ladder, thresholds, runs, evaluations, memory, tools), runs, evaluations, calibration, canaries, rollbacks and the kill switch. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only — every colour comes from app.css tokens (§5.1).
       Agents & Operations surface (§4.9): six tabs (Fleet · Runs · Evaluations ·
       Calibration · Canaries · Kill switch) over the shared HX shell, plus object
       pages for agent / run / evaluation / canary. Hexagon fleet cards, ladder
       gauges, threshold editor-as-CR, tool-call waterfalls, κ charts (inline SVG
       via HX.chart, each with a data table), canary rails and the kill-switch
       panel. Reflows to one column at 375px with a 16px gutter, no horizontal
       page scroll. */
    .ao-tabs { position: sticky; top: var(--topbar-h); z-index: 15; background: var(--bg-canvas); padding-top: var(--sp-1); }
    #ao-root { outline: none; }
    #ao-root .hx-object-header { top: calc(var(--topbar-h) + 42px); z-index: 14; }
    @media (max-width: 768px) { #ao-root .hx-object-header { top: auto; } }

    .ao-toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .ao-toolbar__spacer { flex: 1 1 auto; }
    .ao-filter { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-canvas); font-family: var(--font-mono); font-size: var(--fs-caption); min-width: 180px; flex: 1 1 200px; }
    .ao-filter input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; color: inherit; }
    .ao-chipbar { display: flex; gap: 4px; flex-wrap: wrap; }
    .ao-chiptoggle { cursor: pointer; }
    .ao-chiptoggle[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }

    /* operator attention strip */
    .ao-attn { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-4); }
    .ao-attn .hx-card { display: flex; flex-direction: column; gap: var(--sp-2); }
    .ao-attn__row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-caption); }
    .ao-attn__row + .ao-attn__row { border-top: 1px solid var(--border); padding-top: var(--sp-2); }
    .ao-attn__id { font-family: var(--font-mono); font-size: var(--fs-caption); }
    .ao-attn__spacer { flex: 1 1 auto; }

    /* fleet board */
    .ao-fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: var(--sp-3); align-items: stretch; }
    .ao-fleet .hx-agent-card { cursor: pointer; }
    .ao-fleet .hx-agent-card:hover { border-color: var(--border-strong); }
    .ao-fleet .hx-agent-card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .hx-agent-card__role { font-size: var(--fs-micro); color: var(--fg-muted); line-height: 1.3; }
    .hx-agent-card__badges { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .ao-cardfoot { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; font-size: var(--fs-micro); color: var(--fg-muted); font-family: var(--font-mono); border-top: 1px solid var(--border); padding-top: var(--sp-2); }
    .ao-budget { flex: 1 1 100%; }
    .ao-budget__bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 3px; }
    .ao-budget__bar i { display: block; height: 100%; background: var(--accent); }
    .ao-arm { display: inline-flex; align-items: center; gap: 3px; }

    /* generic */
    .ao-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); margin: 0; }
    .ao-kv dt { color: var(--fg-muted); white-space: nowrap; }
    .ao-kv dd { margin: 0; font-family: var(--font-mono); font-size: var(--fs-caption); }
    .ao-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); align-items: start; }
    .ao-section { margin-bottom: var(--sp-5, 24px); }
    .ao-section > h3 { font-size: var(--fs-lead); margin-bottom: var(--sp-2); }
    .ao-subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-3); overflow-x: auto; }
    .ao-subtab { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 var(--sp-3); border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--fg-muted); font-size: var(--fs-dense); font-weight: 500; white-space: nowrap; cursor: pointer; }
    .ao-subtab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

    /* tables */
    .ao-table { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .ao-table th, .ao-table td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .ao-table th { font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; position: sticky; top: 0; background: var(--bg-surface); }
    .ao-table td.num, .ao-table th.num { text-align: right; font-family: var(--font-mono); }
    .ao-table tbody tr { cursor: pointer; }
    .ao-table tbody tr:hover { background: var(--bg-sunken); }
    .ao-table tbody tr[aria-selected="true"] { background: var(--info-bg); }
    .ao-table-wrap { border: 1px solid var(--border); border-radius: var(--r-card); overflow: auto; background: var(--bg-surface); max-height: 70vh; }

    /* run waterfall */
    .ao-wf { display: grid; grid-template-columns: 1fr; gap: 2px; }
    .ao-wf__row { display: grid; grid-template-columns: 148px 1fr 70px; gap: var(--sp-2); align-items: center; font-size: var(--fs-caption); padding: 3px 0; border-bottom: 1px solid var(--border); }
    .ao-wf__tool { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ao-wf__bar { height: 14px; background: var(--bg-sunken); border-radius: 3px; position: relative; overflow: hidden; }
    .ao-wf__bar i { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; }
    .ao-wf__bar.is-untrusted i { background: var(--warn-fg); }
    .ao-wf__dur { font-family: var(--font-mono); text-align: right; color: var(--fg-muted); }
    @media (max-width: 560px) { .ao-wf__row { grid-template-columns: 1fr; } .ao-wf__dur { text-align: left; } }

    /* tools matrix */
    .ao-tools { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--sp-3); font-size: var(--fs-dense); align-items: center; }
    .ao-tools__tool { font-family: var(--font-mono); font-size: var(--fs-caption); padding: 4px 0; border-bottom: 1px solid var(--border); }
    .ao-tools__val { padding: 4px 0; border-bottom: 1px solid var(--border); text-align: right; }

    /* calibration grid */
    .ao-calib { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--sp-3); }
    .ao-calib__cell { border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-2) var(--sp-3); }
    .ao-calib__cell.is-reverted { border-color: var(--warn-border); background: var(--warn-bg); }
    .ao-calib__top { display: flex; align-items: baseline; gap: var(--sp-2); justify-content: space-between; }
    .ao-calib__k { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 600; line-height: 1; }
    .ao-calib__spark { height: 24px; margin-top: 4px; }
    .ao-chartcard { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); padding: var(--sp-3); }

    /* ladder */
    .ao-gauge__top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-caption); }
    .ao-gauge__val { font-family: var(--font-mono); font-weight: 600; }
    .ao-gauge__target { color: var(--fg-muted); font-family: var(--font-mono); font-size: var(--fs-micro); }

    /* threshold editor */
    .ao-thresh__row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-2) 0; }
    .ao-thresh__row input[type="range"] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
    .ao-thresh__val { font-family: var(--font-mono); font-weight: 600; min-width: 48px; text-align: right; }

    /* canary */
    .ao-canary { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
    .ao-canary__rail { overflow-x: auto; }
    .ao-metric2 { display: grid; grid-template-columns: 110px 1fr; gap: 4px var(--sp-2); align-items: center; font-size: var(--fs-caption); }
    .ao-metric2__track { height: 10px; background: var(--bg-sunken); border-radius: 5px; position: relative; }
    .ao-metric2__track i { position: absolute; top: 0; height: 100%; border-radius: 5px; }

    .ao-note { font-size: var(--fs-caption); color: var(--fg-muted); }
    .ao-verbbar { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
    .ao-pre { font-family: var(--font-mono); font-size: var(--fs-caption); background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2) var(--sp-3); overflow: auto; white-space: pre; margin: 0; }
    .ao-backlink { margin-bottom: var(--sp-2); }
  </style>
</head>

  <script>
  /* ====================================================================
     agent-ops.html — Agents & Operations page runtime (§4.9).
     Six tabs (Fleet · Runs · Evaluations · Calibration · Canaries · Kill
     switch) over the shared HX shell, with object pages for agent / run /
     evaluation / canary. All mutations (threshold raise, rollback cancel,
     canary promote/roll back, demotion acknowledge, kill switch) live in
     memory for the session only (AC-17: no payloads persisted). Charts are
     inline SVG via HX.chart (one accent + semantic bands, each ships a data
     table). Accessible per §8; reflows to one column at 375px.
     ==================================================================== */
  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, CLEAR = HX.util.clear, TC = HX.util.titleCase;

    HX.mount({ page: "agent-ops", area: "agents", title: "Agents & Operations" });

    var tabsEl = document.getElementById("ao-tabs");
    var root = document.getElementById("ao-root");

    var D = { agents: [], runs: [], evaluations: [], calibration: {}, killSwitch: {}, canaries: [], rollbacks: [] };
    var IX = { agent: {}, run: {}, eval: {}, canary: {}, runsByAgent: {}, crsByAgent: {} };
    var loaded = false;

    /* session-only in-memory overlay */
    var MEM = { cancelledRb: {}, ackDemote: {}, canaryStage: {}, agentTab: {}, thresholdDraft: {}, calibType: null, fleet: { q: "", level: null, status: null } };

    var TABS = [
      { id: "fleet", label: "Fleet", route: "/agents", key: "1" },
      { id: "runs", label: "Runs", route: "/agents/runs", key: "2" },
      { id: "evals", label: "Evaluations", route: "/agents/evaluations", key: "3" },
      { id: "calibration", label: "Calibration", route: "/agents/calibration", key: "4" },
      { id: "canaries", label: "Canaries", route: "/agents/canaries", key: "5" },
      { id: "killswitch", label: "Kill switch", route: "/agents/killswitch", key: "6" }
    ];

    /* ---------------------------------------------------------- formatting */
    function pct(frac, dp) { if (frac == null) return "—"; return (frac * 100).toFixed(dp == null ? 0 : dp) + "%"; }
    function pctN(n, dp) { if (n == null) return "—"; return (n * 100).toFixed(dp == null ? 1 : dp) + "%"; }
    function num(n) { return n == null ? "—" : Number(n).toLocaleString("en-US"); }
    function shortRole(id) { return String(id).replace(/^agent\./, ""); }
    function initials(id) {
      var s = shortRole(id).split("_");
      if (s.length > 1) return (s[0][0] + s[1][0]).toUpperCase();
      return s[0].slice(0, 2).toUpperCase();
    }
    function statusMod(a) { return a.status === "demoted" ? "fail" : a.autoApprovalSuspended ? "warn" : "pass"; }
    function statusLabel(a) { return a.status === "demoted" ? "Demoted" : a.autoApprovalSuspended ? "Auto-approve suspended" : "Active"; }

    /* level chip with ceiling ghost (§5.2) */
    function levelChip(a) {
      var c = HX.chip("level", a.level === "—" ? "n/a" : a.level, { title: "Autonomy level " + a.level + " · ceiling " + a.ceiling });
      if (a.ceiling && a.ceiling !== a.level && a.ceiling !== "—") c.appendChild(E("span", { class: "hx-chip__ceiling", text: " /" + a.ceiling }));
      return c;
    }
    function moduleChips(a) {
      return (a.modules || []).map(function (m) { return HX.chip("neutral", "M" + m, { title: "PRD module " + m }); });
    }

    /* ---------------------------------------------------------- local nav */
    function go(route) {
      var local = /^\/(agents|agent|run|evaluation|canary)(\/|$)/.test(route);
      if (local) {
        var carry = HX.asof.get(); var q = [];
        if (carry.asOf) q.push("asOf=" + encodeURIComponent(carry.asOf));
        if (carry.asKnownAt) q.push("asKnownAt=" + encodeURIComponent(carry.asKnownAt));
        if (HX.env.get() !== "prod") q.push("env=" + HX.env.get());
        location.hash = "#" + route + (q.length ? "?" + q.join("&") : "");
      } else { HX.nav(route); }
    }
    function linkBtn(label, route, cls, ic) {
      var kids = []; if (ic) kids.push(I(ic)); kids.push(label);
      var b = E("button", { class: "hx-btn hx-btn--sm" + (cls ? " " + cls : "") }, kids);
      b.addEventListener("click", function () { go(route); });
      return b;
    }
    function backLink(label, route) {
      var b = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost ao-backlink" }, [I("chevron"), label]);
      b.addEventListener("click", function () { go(route); });
      return b;
    }

    /* ---------------------------------------------------------- routing */
    function routeParts() {
      var h = location.hash.slice(1);
      var qi = h.indexOf("?"); var route = (qi < 0 ? h : h.slice(0, qi)) || "/agents";
      return route.replace(/^#/, "").split("/").filter(Boolean);
    }
    function currentTab() {
      var p = routeParts();
      if (p[0] === "agent") return "fleet";
      if (p[0] === "run") return "runs";
      if (p[0] === "evaluation") return "evals";
      if (p[0] === "canary") return "canaries";
      if (p[0] === "agents") {
        var sub = { runs: "runs", evaluations: "evals", calibration: "calibration", canaries: "canaries", killswitch: "killswitch" };
        return sub[p[1]] || "fleet";
      }
      return "fleet";
    }
    function renderTabs() {
      CLEAR(tabsEl);
      var bar = E("div", { class: "hx-tabs", role: "tablist", "aria-label": "Agents and operations views" });
      var active = currentTab();
      TABS.forEach(function (t) {
        var isSel = t.id === active;
        var tab = E("button", { class: "hx-tab", role: "tab", "aria-selected": isSel ? "true" : "false", id: "ao-tab-" + t.id, title: t.label + " (" + t.key + ")" }, [t.label]);
        tab.appendChild(E("kbd", { text: t.key }));
        tab.addEventListener("click", function () { go(t.route); });
        bar.appendChild(tab);
      });
      tabsEl.appendChild(bar);
    }

    /* ---------------------------------------------------------- boot */
    function boot() {
      HX.data.load("agents").then(function (d) {
        d = d || {};
        D.agents = d.agents || []; D.runs = d.runs || []; D.evaluations = d.evaluations || [];
        D.calibration = d.calibration || {}; D.killSwitch = d.killSwitch || {}; D.canaries = d.canaries || []; D.rollbacks = d.rollbacks || [];
        D.agents.forEach(function (a) { IX.agent[a.id] = a; });
        D.runs.forEach(function (r) { IX.run[r.id] = r; (IX.runsByAgent[r.agent] = IX.runsByAgent[r.agent] || []).push(r); (r.crsProduced || []).forEach(function (cr) { (IX.crsByAgent[r.agent] = IX.crsByAgent[r.agent] || []).push(cr); }); });
        D.evaluations.forEach(function (e) { IX.eval[e.id] = e; });
        D.canaries.forEach(function (c) { IX.canary[c.id] = c; });
        MEM.calibType = (D.calibration.kappaByType && Object.keys(D.calibration.kappaByType)[0]) || null;
        loaded = true;
        render();
      });
    }

    /* ================================================================ RENDER */
    function render() {
      renderTabs();
      if (!loaded) { CLEAR(root); root.appendChild(E("div", { class: "hx-skeleton", style: "height:240px" })); return; }
      var p = routeParts();
      CLEAR(root);
      if (p[0] === "agent") return renderAgent(p.slice(1).join("/"));
      if (p[0] === "run") return renderRun(p[1]);
      if (p[0] === "evaluation") return renderEvaluation(p[1]);
      if (p[0] === "canary") return renderCanaryDetail(p[1]);
      var tab = currentTab();
      ({ fleet: renderFleet, runs: renderRunsTab, evals: renderEvalsTab, calibration: renderCalibration, canaries: renderCanariesTab, killswitch: renderKillSwitch }[tab] || renderFleet)();
      root.focus();
    }

    function pageTitle(title, sub) {
      var h = E("div", { class: "hx-page-title" }, [E("h1", { text: title })]);
      if (sub) h.appendChild(E("span", { class: "hx-muted hx-caption", text: sub }));
      return h;
    }

    /* ============================================================ FLEET TAB */
    function renderFleet() {
      root.appendChild(pageTitle("Fleet board", "Twenty agents propose; people dispose. Level vs ceiling, acceptance, rollback, κ, open CRs, budget."));
      renderAttention();

      // toolbar: search + level + status filters
      var tb = E("div", { class: "ao-toolbar" });
      var filt = E("label", { class: "ao-filter", title: "Filter agents" }, [I("search")]);
      var input = E("input", { type: "text", "aria-label": "Filter agents by id or role", placeholder: "filter: id or role…", value: MEM.fleet.q });
      input.addEventListener("input", function () { MEM.fleet.q = input.value; drawCards(); });
      filt.appendChild(input); tb.appendChild(filt);
      tb.appendChild(E("span", { class: "ao-toolbar__spacer" }));

      var levelBar = E("div", { class: "ao-chipbar", role: "group", "aria-label": "Filter by level" });
      ["L1", "L2", "L3", "L4"].forEach(function (lv) {
        var c = HX.chip("level", lv, { button: true, class: "ao-chiptoggle" });
        c.dataset.dim = "level"; c.dataset.val = lv;
        c.setAttribute("aria-pressed", MEM.fleet.level === lv ? "true" : "false");
        c.addEventListener("click", function () { MEM.fleet.level = MEM.fleet.level === lv ? null : lv; drawCards(); syncToggles(); });
        levelBar.appendChild(c);
      });
      tb.appendChild(levelBar);
      var statusBar = E("div", { class: "ao-chipbar", role: "group", "aria-label": "Filter by status" });
      [["pass", "Active", "active"], ["warn", "Suspended", "suspended"], ["fail", "Demoted", "demoted"]].forEach(function (s) {
        var c = HX.chip(s[0], s[1], { button: true, class: "ao-chiptoggle" });
        c.dataset.dim = "status"; c.dataset.val = s[2];
        c.setAttribute("aria-pressed", MEM.fleet.status === s[2] ? "true" : "false");
        c.addEventListener("click", function () { MEM.fleet.status = MEM.fleet.status === s[2] ? null : s[2]; drawCards(); syncToggles(); });
        statusBar.appendChild(c);
      });
      tb.appendChild(statusBar);
      root.appendChild(tb);
      function syncToggles() {
        HX._.$$(".ao-chipbar .ao-chiptoggle", tb).forEach(function (c) {
          var on = (c.dataset.dim === "level" && MEM.fleet.level === c.dataset.val) || (c.dataset.dim === "status" && MEM.fleet.status === c.dataset.val);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      var board = E("div", { class: "ao-fleet", id: "ao-fleet" });
      root.appendChild(board);
      drawCards();

      function drawCards() {
        CLEAR(board);
        var q = MEM.fleet.q.trim().toLowerCase();
        var rows = D.agents.filter(function (a) {
          if (q && (a.id + " " + a.role).toLowerCase().indexOf(q) < 0) return false;
          if (MEM.fleet.level && a.level !== MEM.fleet.level) return false;
          if (MEM.fleet.status === "active" && !(a.status === "active" && !a.autoApprovalSuspended)) return false;
          if (MEM.fleet.status === "suspended" && !a.autoApprovalSuspended) return false;
          if (MEM.fleet.status === "demoted" && a.status !== "demoted") return false;
          return true;
        });
        if (!rows.length) { board.appendChild(emptyState("No agents match this filter", "Clear the filter chips to see the full roster of 20 agents.")); return; }
        rows.forEach(function (a) { board.appendChild(agentCard(a)); });
      }
    }

    function agentCard(a) {
      var card = E("article", { class: "hx-agent-card" + (a.autoApprovalSuspended ? " is-suspended" : ""), tabindex: "0", role: "button", "aria-label": "Open agent " + a.id });
      var head = E("div", { class: "hx-agent-card__head" });
      head.appendChild(E("span", { class: "hx-agent-card__avatar", "aria-hidden": "true", text: initials(a.id) }));
      var nameWrap = E("div", { style: "flex:1;min-width:0" });
      nameWrap.appendChild(E("div", { class: "hx-agent-card__name", text: TC(shortRole(a.id)) }));
      nameWrap.appendChild(E("div", { class: "hx-agent-card__id", text: a.id }));
      head.appendChild(nameWrap);
      head.appendChild(levelChip(a));
      card.appendChild(head);
      card.appendChild(E("div", { class: "hx-agent-card__role", text: a.role }));

      var badges = E("div", { class: "hx-agent-card__badges" });
      badges.appendChild(HX.chip(statusMod(a), statusLabel(a)));
      if (a.stage != null) badges.appendChild(HX.chip("neutral", "Stage " + a.stage, { title: "Pipeline stage " + a.stage }));
      (a.demotionTriggers || []).filter(function (t) { return t.armed; }).forEach(function (t) {
        badges.appendChild(HX.chip("warn", "trigger armed: " + t.metric, { title: "Demotion trigger armed: " + t.metric + (t.gt != null ? " > " + t.gt : t.lt != null ? " < " + t.lt : "") }));
      });
      card.appendChild(badges);

      var m = E("div", { class: "hx-agent-card__metrics" });
      var metric = function (k, v, title) { var row = E("div", { class: "hx-agent-card__metric", title: title || "" }); row.appendChild(E("span", { text: k })); row.appendChild(E("b", { text: v })); return row; };
      m.appendChild(metric("Acceptance", a.acceptanceRate == null ? "—" : pct(a.acceptanceRate), "Share of proposals accepted"));
      m.appendChild(metric("Rollback", a.rollbackRate == null ? "—" : pctN(a.rollbackRate), "Rollback rate (target ≤ 2%)"));
      var ks = a.kappaByType ? Object.keys(a.kappaByType) : [];
      var kmin = ks.length ? Math.min.apply(null, ks.map(function (t) { return a.kappaByType[t]; })) : null;
      m.appendChild(metric("κ (min)", kmin == null ? "—" : kmin.toFixed(2), ks.length ? ks.map(function (t) { return t + " " + a.kappaByType[t]; }).join(" · ") : "no κ for this agent"));
      m.appendChild(metric("Open CRs", a.maxOpenChangeRequests ? (a.openCrs + " / " + a.maxOpenChangeRequests) : String(a.openCrs), "Open change requests vs max_open_change_requests"));
      card.appendChild(m);

      var foot = E("div", { class: "ao-cardfoot" });
      var budget = E("div", { class: "ao-budget" });
      budget.appendChild(E("span", { text: "Budget today " + pct(a.budgets && a.budgets.usedToday) + (a.budgets && a.budgets.costTodayUsd != null ? " · $" + a.budgets.costTodayUsd.toFixed(2) : "") }));
      var bar = E("div", { class: "ao-budget__bar" }); var fill = E("i"); fill.style.width = Math.round((a.budgets && a.budgets.usedToday || 0) * 100) + "%"; bar.appendChild(fill); budget.appendChild(bar);
      foot.appendChild(budget);
      foot.appendChild(E("span", { text: "last run " + (a.lastRun || "—") }));
      foot.appendChild(E("span", { text: "manifest v" + (a.manifestVersion || "?") }));
      card.appendChild(foot);

      var open = function () { go("/agent/" + a.id); };
      card.addEventListener("click", open);
      card.addEventListener("keydown", function (e) {
        if (e.shiftKey && e.key === "Enter") { e.preventDefault(); HX.inspector.open(agentPeek(a), a.id); }
        else if (e.key === "Enter" || e.key === "o" || e.key === " ") { e.preventDefault(); open(); }
      });
      return card;
    }

    function agentPeek(a) {
      var w = E("div");
      w.appendChild(E("div", { class: "hx-row", style: "gap:8px;margin-bottom:8px" }, [E("span", { class: "hx-mono", text: a.id }), levelChip(a)]));
      w.appendChild(E("p", { class: "ao-note", text: a.role }));
      var dl = E("dl", { class: "ao-kv" });
      [["Acceptance", pct(a.acceptanceRate)], ["Rollback", pctN(a.rollbackRate)], ["Open CRs", a.openCrs + " / " + a.maxOpenChangeRequests], ["Budget", pct(a.budgets && a.budgets.usedToday)], ["Status", statusLabel(a)]].forEach(function (r) { dl.appendChild(E("dt", { text: r[0] })); dl.appendChild(E("dd", { text: r[1] })); });
      w.appendChild(dl);
      w.appendChild(linkBtn("Open agent page", "/agent/" + a.id, "hx-btn--primary"));
      return w;
    }

    /* operator attention strip (Needs me · §4.9) */
    function renderAttention() {
      var wrap = E("div", { class: "ao-attn" });

      // rollbacks in cancel window
      var rbs = D.rollbacks.filter(function (r) { return r.state === "in_cancel_window" && !MEM.cancelledRb[r.id]; });
      var rbCard = E("div", { class: "hx-card hx-card--queue" });
      rbCard.appendChild(E("div", { class: "hx-card__head" }, [E("span", { class: "hx-card__title" }, ["Rollbacks — cancel window"]), E("span", { class: "hx-card__count", text: rbs.length })]));
      var rbBody = E("div", { style: "padding:var(--sp-3)" });
      if (!rbs.length) rbBody.appendChild(E("div", { class: "ao-note", text: "No rollbacks awaiting cancellation." }));
      rbs.forEach(function (r) {
        var row = E("div", { class: "ao-attn__row" });
        var left = E("div", { style: "flex:1;min-width:0" });
        var crBtn = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost ao-attn__id" }, [r.cr]); crBtn.addEventListener("click", function () { HX.nav("/cr/" + r.cr); });
        left.appendChild(crBtn);
        left.appendChild(E("div", { class: "ao-note", text: "by " + r.requestedBy + " · 10-minute cancel window" }));
        row.appendChild(left);
        row.appendChild(countdown(r.cancelWindowEndsAt));
        var cancel = E("button", { class: "hx-btn hx-btn--sm" }, ["Cancel rollback"]);
        cancel.addEventListener("click", function () {
          HX.confirm({ title: "Cancel rollback of " + r.cr, body: "This stops the compensating rollback before it applies. It records an operator decision.", consequence: "What would have happened: " + (r.whatWillHappen || []).join("; "), confirmLabel: "Cancel rollback" }).then(function (ok) {
            if (!ok) return;
            MEM.cancelledRb[r.id] = true;
            HX.audit.write({ type: "ROLLBACK_CANCELLED", rollback: r.id, cr: r.cr });
            HX.toast("Rollback of " + r.cr + " cancelled", { kind: "ok", undo: function () { delete MEM.cancelledRb[r.id]; render(); } });
            HX.live("Rollback of " + r.cr + " cancelled", "polite");
            render();
          });
        });
        row.appendChild(cancel);
        rbBody.appendChild(row);
      });
      rbCard.appendChild(rbBody);
      wrap.appendChild(rbCard);

      // demotions to acknowledge
      var demoted = D.agents.filter(function (a) { return a.status === "demoted" && !MEM.ackDemote[a.id]; });
      var dCard = E("div", { class: "hx-card hx-card--queue" });
      dCard.appendChild(E("div", { class: "hx-card__head" }, [E("span", { class: "hx-card__title" }, ["Demotions to acknowledge"]), E("span", { class: "hx-card__count", text: demoted.length })]));
      var dBody = E("div", { style: "padding:var(--sp-3)" });
      if (!demoted.length) dBody.appendChild(E("div", { class: "ao-note", text: "No agents demoted awaiting acknowledgement." }));
      demoted.forEach(function (a) {
        var row = E("div", { class: "ao-attn__row" });
        var idBtn = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost ao-attn__id" }, [a.id]); idBtn.addEventListener("click", function () { go("/agent/" + a.id); });
        row.appendChild(idBtn);
        row.appendChild(HX.chip("fail", "Demoted " + HX.format.rel(a.demotedAt)));
        row.appendChild(E("span", { class: "ao-attn__spacer" }));
        var ack = E("button", { class: "hx-btn hx-btn--sm" }, ["Acknowledge"]);
        ack.addEventListener("click", function () { MEM.ackDemote[a.id] = true; HX.audit.write({ type: "DEMOTION_ACK", agent: a.id }); HX.toast("Acknowledged demotion of " + a.id, { kind: "ok" }); render(); });
        row.appendChild(ack);
        dBody.appendChild(row);
      });
      dCard.appendChild(dBody);
      wrap.appendChild(dCard);

      // κ < 0.90 → auto-approval suspended
      var susp = D.agents.filter(function (a) { return a.autoApprovalSuspended; });
      var kCard = E("div", { class: "hx-card hx-card--queue" });
      kCard.appendChild(E("div", { class: "hx-card__head" }, [E("span", { class: "hx-card__title" }, ["Auto-approval suspended"]), E("span", { class: "hx-card__count", text: susp.length })]));
      var kBody = E("div", { style: "padding:var(--sp-3)" });
      if (!susp.length) kBody.appendChild(E("div", { class: "ao-note", text: "All agents within calibration thresholds." }));
      susp.forEach(function (a) {
        var row = E("div", { class: "ao-attn__row" });
        var idBtn = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost ao-attn__id" }, [a.id]); idBtn.addEventListener("click", function () { go("/agent/" + a.id); });
        row.appendChild(idBtn);
        row.appendChild(E("span", { class: "ao-note", text: "κ or ladder below target — proposals routed to human review" }));
        kBody.appendChild(row);
      });
      kCard.appendChild(kBody);
      wrap.appendChild(kCard);

      // kill switch status
      var ksCard = E("div", { class: "hx-card hx-card--queue" });
      ksCard.appendChild(E("div", { class: "hx-card__head" }, [E("span", { class: "hx-card__title" }, ["Kill switch"]), E("span", { class: "hx-card__count", text: HX.killswitch.get() ? "ACTIVE" : "idle" })]));
      var ksBody = E("div", { style: "padding:var(--sp-3)" });
      var ks = HX.killswitch.get();
      if (ks) {
        var sc = typeof ks.scope === "object" ? Object.values(ks.scope).join(" / ") : ks.scope;
        ksBody.appendChild(E("div", { class: "ao-attn__row" }, [HX.chip("fail", "Active"), E("span", { class: "hx-mono", text: sc }), E("span", { class: "ao-note", text: "held by " + (ks.heldBy || "operator") })]));
      } else {

        var wrap = E("div", { class: "ao-table-wrap" });
        var t = E("table", { class: "ao-table" });
        t.appendChild(E("thead", {}, [E("tr", {}, [E("th", { text: "Scope" }), E("th", { text: "Tripped by" }), E("th", { text: "Tripped" }), E("th", { text: "Released" }), E("th", { text: "Reason" })])]));
        var tb = E("tbody");
        ks.history.forEach(function (h) {
          var sc = typeof h.scope === "object" ? Object.values(h.scope).join(" / ") : h.scope;
          var tr = E("tr");
          tr.appendChild(E("td", { class: "hx-mono", text: sc }));
          tr.appendChild(E("td", { text: h.trippedBy }));
          tr.appendChild(E("td", { text: HX.format.time(h.trippedAt, "known") }));
          tr.appendChild(E("td", { text: h.releasedAt ? HX.format.time(h.releasedAt, "known") : "—" }));
          tr.appendChild(E("td", { text: h.reason }));
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t); root.appendChild(wrap);
      }
    }

    /* ---------------------------------------------------------- lifecycle */
    window.addEventListener("hashchange", function () { if (loaded) render(); });
    HX.killswitch.on(function () { if (loaded && currentTab() === "fleet") render(); });
    boot();
  })();
  </script>
</body>
</html>
