<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HEALIX Console — Streams &amp; Operations</title>
  <meta name="description" content="SRE and integration view of the platform's promises: SLO wall S1–S22, the Kafka pipeline map with a synchronised list twin, topic / connector / incident pages, DLQ, and replay. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only — every colour comes from app.css tokens (§5.1).
       Seven-tab operations surface (SLOs · Pipeline map · Topics · Connectors ·
       DLQ · Replay · Incidents) over the shared HX shell, with object pages for
       SLO / topic / connector / processor / incident / playbook. Charts are inline
       SVG via HX.chart (one accent, semantic pass/warn/fail bands, each ships a
       data table). Reflows to one column at 375px with a 16px gutter, no
       horizontal page scroll. */
    .io-tabs { position: sticky; top: var(--topbar-h); z-index: 15; background: var(--bg-canvas); padding-top: var(--sp-1); }
    #io-root { outline: none; }
    #io-root .hx-object-header { top: calc(var(--topbar-h) + 42px); z-index: 14; }
    @media (max-width: 768px) { #io-root .hx-object-header { top: auto; } }

    .io-toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .io-toolbar__spacer { flex: 1; }
    .io-filter { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-canvas); font-family: var(--font-mono); font-size: var(--fs-caption); min-width: 180px; flex: 1 1 200px; }
    .io-filter input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; color: inherit; }
    .io-chipbar { display: flex; gap: 4px; flex-wrap: wrap; }
    .io-chiptoggle { cursor: pointer; }
    .io-chiptoggle[aria-pressed="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }

    /* SLO wall */
    .io-slo-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--sp-3); align-items: stretch; }
    .io-slo { text-align: left; width: 100%; cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--band-color, var(--ok-fg)); }
    .io-slo:hover { border-color: var(--border-strong); }
    .io-slo__top { display: flex; align-items: baseline; gap: var(--sp-2); }
    .io-slo__id { font-family: var(--font-mono); font-weight: 700; }
    .io-slo__name { font-size: var(--fs-dense); font-weight: 600; flex: 1; min-width: 0; }
    .io-slo__burn { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 600; line-height: 1; }
    .io-slo__meta { display: flex; gap: var(--sp-3); font-size: var(--fs-micro); color: var(--fg-muted); font-family: var(--font-mono); flex-wrap: wrap; }
    .io-slo__spark { height: 24px; }

    .io-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); margin: 0; }
    .io-kv dt { color: var(--fg-muted); white-space: nowrap; }
    .io-kv dd { margin: 0; font-family: var(--font-mono); font-size: var(--fs-caption); }
    .io-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); align-items: start; }
    .io-subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-3); overflow-x: auto; }

    /* pipeline map */
    .io-map-node { width: 100%; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .io-map-node[aria-selected="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }
    .io-map-node__bar { height: 4px; border-radius: 2px; background: var(--accent); }
    .io-map-node__name { font-family: var(--font-mono); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .io-map-node__meta { font-size: 9px; color: var(--fg-muted); font-family: var(--font-mono); }
    .io-map-layer__count { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); text-align: center; }
    .io-map-cluster { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); text-align: center; border: 1px dashed var(--border-strong); border-radius: var(--r-ctl); padding: 2px; }
    .io-map-wrap { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); }
    .io-map-wrap.is-split { grid-template-columns: 2fr 1fr; }
    @media (max-width: 1024px) { .io-map-wrap.is-split { grid-template-columns: 1fr; } }
    .io-twin { max-height: 420px; }

    /* tables */
    .io-table { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .io-table th, .io-table td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .io-table th { font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; position: sticky; top: 0; background: var(--bg-surface); }
    .io-table td.num, .io-table th.num { text-align: right; font-family: var(--font-mono); }
    .io-table tbody tr { cursor: pointer; }
    .io-table tbody tr:hover { background: var(--bg-sunken); }
    .io-table tbody tr[aria-selected="true"] { background: var(--info-bg); }
    .io-table-wrap { border: 1px solid var(--border); border-radius: var(--r-card); overflow: auto; background: var(--bg-surface); max-height: 70vh; }

    /* connectors / dlq cards */
    .io-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); align-items: start; }
    .io-conn { display: flex; flex-direction: column; gap: var(--sp-2); cursor: pointer; text-align: left; width: 100%; }
    .io-conn:hover { border-color: var(--border-strong); }
    .io-conn__head { display: flex; align-items: center; gap: var(--sp-2); }
    .io-conn__name { font-weight: 600; font-size: var(--fs-dense); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .io-wm { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--fg-muted); }
    .io-lagbadge { display: inline-flex; align-items: center; gap: 4px; }

    /* lag heat per partition */
    .io-heat { display: flex; gap: 2px; flex-wrap: wrap; }
    .io-heat__cell { width: 16px; height: 18px; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; color: var(--fg-inverse); }
    .io-heat__legend { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-micro); color: var(--fg-muted); margin-top: var(--sp-2); }
    .io-heat__legend span { display: inline-flex; align-items: center; gap: 4px; }
    .io-swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

    .io-incident-head { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; }
    .io-blast { display: inline-flex; gap: 2px; align-items: center; }
    .io-blast__cell { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--border-strong); }
    .io-blast__cell--used { background: var(--warn-fg); border-color: var(--warn-fg); }
    .io-await { border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); border-radius: var(--r-card); padding: var(--sp-3); margin: var(--sp-3) 0; }
    .io-await__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
    .io-timeline-kind { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .04em; color: var(--fg-faint); }

    .io-replay-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-3); align-items: end; }
    .io-legend-note { font-size: var(--fs-caption); color: var(--fg-muted); margin-top: var(--sp-2); }
    .io-empty-note { font-size: var(--fs-caption); color: var(--fg-muted); }
    .sr-skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; border-radius: var(--r-ctl); z-index: 100; }
    .sr-skip:focus { left: var(--sp-3); top: var(--sp-2); }
  </style>
</head>

  <script src="assets/app.js"></script>
  <script>
  /* ====================================================================
     interop-monitor.html — page-local controller (no app.js edits).
     Builds the Streams & Operations surface on top of the shared HX
     runtime: seven tabs, object pages, SVG charts via HX.chart, a
     synchronised pipeline-map/list twin, and incident step approvals.
     All state changes (approved steps, replays, taken-over incidents)
     live in memory for the session only (AC-17: no payloads persisted).
     ==================================================================== */
  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, SVG = HX.util.svgEl, CLEAR = HX.util.clear, TC = HX.util.titleCase;

    HX.mount({ page: "interop-monitor", area: "ops", title: "Streams & Operations" });

    var tabsEl = document.getElementById("io-tabs");
    var root = document.getElementById("io-root");

    var D = { topics: [], connectors: [], slos: [], freezeWindows: [], replays: [], layers: [], incidents: [], playbooks: [] };
    var IX = { topic: {}, conn: {}, slo: {}, inc: {}, pbk: {} };
    var loaded = false;

    /* session-only in-memory overlay */
    var MEM = { stepApproved: {}, incidentState: {}, replays: [], pausedInc: {} };

    var TABS = [
      { id: "slos", label: "SLOs", route: "/ops", key: "1" },
      { id: "map", label: "Pipeline map", route: "/ops/map", key: "2" },
      { id: "topics", label: "Topics", route: "/ops/topics", key: "3" },
      { id: "connectors", label: "Connectors", route: "/ops/connectors", key: "4" },
      { id: "dlq", label: "DLQ", route: "/ops/dlq", key: "5" },
      { id: "replay", label: "Replay", route: "/ops/replay", key: "6" },
      { id: "incidents", label: "Incidents", route: "/ops/incidents", key: "7" }
    ];

    var LAYER_LABEL = { raw: "Raw", std: "Standardised", canonical: "Canonical (FHIR)", dq: "Data quality", kg: "Knowledge graph", edw: "Warehouse", ops: "Operations" };
    var MAP_CAP = 10; // per-layer display cap before auto-clustering

    /* lag band → semantic chip modifier + glyph (icon+text+colour, never colour alone) */
    function lagMod(band) { return ({ ok: "pass", warn: "warn", critical: "fail", stalled: "fail" })[band] || "neutral"; }
    function lagGlyph(band) { return ({ ok: "check", warn: "warn", critical: "danger", stalled: "danger" })[band] || "info"; }
    function connMod(state) { return ({ running: "pass", degraded: "warn", failed: "fail", stopped: "neutral" })[state] || "neutral"; }
    function sloMod(slo) { if (slo.status === "burning" || slo.burnRate >= 2) return "fail"; if (slo.budgetRemaining < 0.5 || slo.burnRate >= 1) return "warn"; return "pass"; }
    function sloColor(mod) { return ({ pass: "var(--ok-fg)", warn: "var(--warn-fg)", fail: "var(--danger-fg)" })[mod] || "var(--neutral-fg)"; }
    function sevChip(sev) { var m = { SEV1: "fail", SEV2: "fail", SEV3: "warn", SEV4: "neutral" }; return HX.chip(m[sev] || "neutral", sev, { title: "Severity " + sev }); }

    /* human lag */
    function lagText(sec) {
      if (sec == null) return "—";
      if (sec < 60) return sec + " s";
      if (sec < 3600) return (sec / 60).toFixed(sec < 600 ? 1 : 0) + " min";
      if (sec < 86400) return (sec / 3600).toFixed(1) + " h";
      return (sec / 86400).toFixed(1) + " d";
    }
    function num(n) { return Number(n).toLocaleString("en-US"); }

    /* local navigation: routes this page owns are handled in the hash so we stay
       on interop-monitor.html; others go through HX.nav. (See API-gap note.) */
    function go(route) {
      var local = /^\/(ops|topic|incident|playbook|connector|processor)(\/|$)/.test(route);
      if (local) {
        var carry = HX.asof.get(); var q = [];
        if (carry.asOf) q.push("asOf=" + encodeURIComponent(carry.asOf));
        if (carry.asKnownAt) q.push("asKnownAt=" + encodeURIComponent(carry.asKnownAt));
        if (HX.env.get() !== "prod") q.push("env=" + HX.env.get());
        location.hash = "#" + route + (q.length ? "?" + q.join("&") : "");
      } else { HX.nav(route); }
    }
    function linkBtn(label, route, cls) {
      var b = E("button", { class: "hx-btn hx-btn--sm" + (cls ? " " + cls : "") }, [label]);
      b.addEventListener("click", function () { go(route); });
      return b;
    }

    /* ---------------------------------------------------------------- routing */
    function routeParts() {
      var h = location.hash.slice(1);
      var qi = h.indexOf("?"); var route = (qi < 0 ? h : h.slice(0, qi)) || "/ops";
      return route.replace(/^#/, "").split("/").filter(Boolean);
    }
    function currentTab() {
      var p = routeParts();
      if (!p.length || p[0] === "ops") {
        if (p[1] === "map") return "map";
        if (p[1] === "topics") return "topics";
        if (p[1] === "connectors") return "connectors";
        if (p[1] === "dlq") return "dlq";
        if (p[1] === "replay") return "replay";
        if (p[1] === "incidents") return "incidents";
        if (p[1] === "slo") return "slos";
        return "slos";
      }
      if (p[0] === "topic") return "topics";
      if (p[0] === "connector" || p[0] === "processor") return "connectors";
      if (p[0] === "incident" || p[0] === "playbook") return "incidents";
      return "slos";
    }

    function renderTabs() {
      CLEAR(tabsEl);
      var bar = E("div", { class: "hx-tabs", role: "tablist", "aria-label": "Operations views" });
      var active = currentTab();
      TABS.forEach(function (t) {
        var isSel = t.id === active;
        var tab = E("button", { class: "hx-tab" + (isSel ? "" : ""), role: "tab", "aria-selected": isSel ? "true" : "false", id: "io-tab-" + t.id, title: t.label + " (" + t.key + ")" }, [t.label]);
        tab.appendChild(E("kbd", { text: t.key }));
        tab.addEventListener("click", function () { go(t.route); });
        bar.appendChild(tab);
      });
      tabsEl.appendChild(bar);
    }

    /* ---------------------------------------------------------------- boot */
    function boot() {
      Promise.all([HX.data.load("topics"), HX.data.load("incidents")]).then(function (res) {
        var top = res[0] || {}, inc = res[1] || {};
        D.topics = top.topics || []; D.connectors = top.connectors || []; D.slos = top.slos || [];
        D.freezeWindows = top.freezeWindows || []; D.replays = top.replays || []; D.layers = top.layers || [];
        D.incidents = inc.incidents || []; D.playbooks = inc.playbooks || [];
        D.topics.forEach(function (t) { IX.topic[t.name] = t; });
        D.connectors.forEach(function (c) { IX.conn[c.name] = c; });
        D.slos.forEach(function (s) { IX.slo[s.id] = s; });
        D.incidents.forEach(function (i) { IX.inc[i.id] = i; });
        D.playbooks.forEach(function (p) { IX.pbk[p.id] = p; });
        loaded = true;
        render();
      });
    }

    /* ================================================================ RENDER */
    function render() {
      renderTabs();
      if (!loaded) { CLEAR(root); root.appendChild(E("div", { class: "hx-skeleton", style: "height:240px" })); return; }
      var p = routeParts();
      CLEAR(root);
      if (p[0] === "topic") return renderTopic(p.slice(1).join("/"));
      if (p[0] === "connector" || p[0] === "processor") return renderConnector(p[1]);
      if (p[0] === "incident") return renderIncident(p[1]);
      if (p[0] === "playbook") return renderPlaybook(p[1]);
      if (p[0] === "ops" && p[1] === "slo" && p[2]) return renderSloDetail(p[2]);
      var tab = currentTab();
      ({ slos: renderSloWall, map: renderMap, topics: renderTopicsTab, connectors: renderConnectorsTab, dlq: renderDlqTab, replay: renderReplayTab, incidents: renderIncidentsTab }[tab] || renderSloWall)();
      root.focus();
    }

    function pageTitle(title, sub) {
      var h = E("div", { class: "hx-page-title" }, [E("h1", { text: title })]);
      if (sub) h.appendChild(E("span", { class: "hx-muted hx-caption", text: sub }));
      return h;
    }

    /* ---------------------------------------------------------------- SLO wall */
    var sloFilter = { burningOnly: false, q: "" };
    function renderSloWall() {
      root.appendChild(pageTitle("SLO wall", "S1–S22 · sorted by burn rate · 30-day window"));
      var burning = D.slos.filter(function (s) { return sloMod(s) === "fail"; }).length;
      var tb = E("div", { class: "io-toolbar" });
      var f = E("label", { class: "io-filter" }, [I("search"), E("input", { type: "text", placeholder: "Filter SLOs…", value: sloFilter.q, "aria-label": "Filter SLOs by name" })]);
      f.querySelector("input").addEventListener("input", function (e) { sloFilter.q = e.target.value; paint(); });
      tb.appendChild(f);
      var only = E("button", { class: "hx-chip hx-chip--warn io-chiptoggle", "aria-pressed": sloFilter.burningOnly ? "true" : "false", type: "button" }, [burning + " burning"]);
      only.addEventListener("click", function () { sloFilter.burningOnly = !sloFilter.burningOnly; only.setAttribute("aria-pressed", sloFilter.burningOnly ? "true" : "false"); paint(); });
      tb.appendChild(only);
      tb.appendChild(E("span", { class: "io-toolbar__spacer" }));
      tb.appendChild(E("span", { class: "hx-caption hx-muted", text: D.slos.length + " SLOs" }));
      root.appendChild(tb);

      var wall = E("div", { class: "io-slo-wall", role: "list", "aria-label": "SLO wall" });
      root.appendChild(wall);
      function paint() {
        CLEAR(wall);
        var rows = D.slos.slice().sort(function (a, b) { return b.burnRate - a.burnRate; });
        var nq = sloFilter.q.toLowerCase();
        rows = rows.filter(function (s) {
          if (sloFilter.burningOnly && sloMod(s) !== "fail") return false;
          if (nq && (s.id + " " + s.name).toLowerCase().indexOf(nq) < 0) return false;
          return true;
        });
        if (!rows.length) { wall.appendChild(E("div", { class: "hx-empty", text: "No SLOs match this filter." })); return; }
        rows.forEach(function (s) {
          var mod = sloMod(s);
          var tile = E("button", { class: "hx-tile io-slo", role: "listitem", title: "Open " + s.id + " — " + s.name });
          tile.style.setProperty("--band-color", sloColor(mod));
          var top = E("div", { class: "io-slo__top" }, [
            E("span", { class: "io-slo__id", text: s.id }),
            E("span", { class: "io-slo__name", text: s.name })
          ]);
          tile.appendChild(top);
          var row = E("div", { class: "hx-row" }, [
            E("span", { class: "io-slo__burn", style: "color:" + sloColor(mod), text: (s.burnRate != null ? s.burnRate.toFixed(1) : "?") + "×" }),
            HX.chip(mod, mod === "fail" ? "Burning" : mod === "warn" ? "At risk" : "Within budget")
          ]);
          tile.appendChild(row);
          var spark = E("div", { class: "io-slo__spark" }); tile.appendChild(spark);
          HX.chart.sparkline(spark, s.burnHistory || [], { label: s.id + " burn-rate trend, latest " + (s.burnRate) + "x" });
          tile.appendChild(E("div", { class: "io-slo__meta" }, [
            E("span", { text: "target " + s.target }),
            E("span", { text: "SLI " + (s.sli != null ? (s.sli * 100).toFixed(2) + "%" : "?") }),
            E("span", { text: "budget " + Math.round((s.budgetRemaining || 0) * 100) + "%" })
          ]));
          if (s.alerts && s.alerts.length) {
            var al = E("div", { class: "hx-row", style: "gap:4px" });
            s.alerts.forEach(function (a) { al.appendChild(HX.chip("danger", a)); });
            tile.appendChild(al);
          }
          tile.addEventListener("click", function () { go("/ops/slo/" + s.id); });
          wall.appendChild(tile);
        });
      }
      paint();
    }

    function renderSloDetail(id) {
      var s = IX.slo[id];
      root.appendChild(breadcrumb([["Operations", "/ops"], ["SLO wall", "/ops"], [id, null]]));
      if (!s) { root.appendChild(empty("No such SLO", "SLO " + id + " is not in this synthetic dataset.")); return; }
      var mod = sloMod(s);
      var head = objectHeader({ type: "SLO", id: s.id, label: s.name, chips: [HX.chip(mod, mod === "fail" ? "Burning" : mod === "warn" ? "At risk" : "Within budget"), HX.chip("neutral", "window " + s.window)] });
      root.appendChild(head);

      var grid = E("div", { class: "io-grid2" });
      var left = E("div", { class: "hx-card" });
      left.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Error-budget burn" })]));
      var burnEl = E("div", {}); left.appendChild(burnEl);
      HX.chart.burn(burnEl, { remaining: s.budgetRemaining, burnRate: s.burnRate }, { label: s.id + " error budget" });
      var hist = E("div", { style: "margin-top:12px" }); left.appendChild(hist);
      HX.chart.line(hist, s.burnHistory || [], { label: s.id + " burn-rate history", threshold: 1, yLabel: "burn ×", max: Math.max(2, Math.max.apply(null, s.burnHistory || [1])) });
      left.appendChild(E("div", { class: "io-legend-note", text: "Burn rate above 1× (dashed line) consumes the 30-day error budget faster than it refills." }));
      grid.appendChild(left);

      var right = E("div", { class: "hx-card" });
      right.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Definition" })]));
      var kv = E("dl", { class: "io-kv" });
      kvRow(kv, "Target", s.target);
      kvRow(kv, "SLI (now)", (s.sli * 100).toFixed(3) + " %");
      kvRow(kv, "Burn rate", (s.burnRate != null ? s.burnRate.toFixed(1) : "?") + " ×");
      kvRow(kv, "Budget left", Math.round((s.budgetRemaining || 0) * 100) + " %");
      kvRow(kv, "Owner", s.owner || "role.platform_sre");
      right.appendChild(kv);
      if (s.alerts && s.alerts.length) { var a = E("div", { class: "hx-row", style: "margin-top:8px" }); s.alerts.forEach(function (x) { a.appendChild(HX.chip("danger", x)); }); right.appendChild(a); }
      var acts = E("div", { class: "hx-row", style: "margin-top:12px" });
      if (s.runbook) acts.appendChild(linkBtn("Open runbook " + s.runbook, "/playbook/" + s.runbook));
      // related topics / incidents by this SLO
      var relInc = D.incidents.filter(function (i) { return i.slo === s.id; });
      relInc.forEach(function (i) { acts.appendChild(linkBtn(i.id, "/incident/" + i.id)); });
      right.appendChild(acts);
      grid.appendChild(right);
      root.appendChild(grid);
      provFooter("slo_evaluation", "dq-scorecard / ops-telemetry", s.id);
    }

    /* ---------------------------------------------------------------- pipeline map */
    var mapSel = { id: null };
    var twinOpen = HX.util.store.get("ioTwin", true);
    function renderMap() {
      root.appendChild(pageTitle("Pipeline map", "Topics by layer · node width = throughput · colour = lag band · opened as the SRE pipeline map, never a Home"));
      var tb = E("div", { class: "io-toolbar" });
      var tog = E("button", { class: "hx-btn hx-btn--sm" }, [I("lineage"), twinOpen ? "Hide list twin (v)" : "Show list twin (v)"]);
      tog.addEventListener("click", function () { twinOpen = !twinOpen; HX.util.store.set("ioTwin", twinOpen); renderMap(); });
      tb.appendChild(tog);
      tb.appendChild(E("span", { class: "io-toolbar__spacer" }));
      tb.appendChild(lagLegend());
      root.appendChild(tb);

      var wrap = E("div", { class: "io-map-wrap" + (twinOpen ? " is-split" : "") });
      var map = E("div", { class: "hx-pipeline-map", role: "group", "aria-label": "Kafka pipeline map by layer" });
      var twin = E("div", { class: "hx-graph-list io-twin", role: "listbox", "aria-label": "Topic list twin (synchronised with the map)" });

      var maxThr = Math.max.apply(null, D.topics.map(function (t) { return t.throughputPerMin || 0; }).concat([1]));

    }
    function empty(title, body) {
      var e = E("div", { class: "hx-empty" });
      e.appendChild(E("div", {}, [I("info"), " " + title]));
      if (body) e.appendChild(E("div", { class: "hx-caption hx-muted", style: "margin-top:6px", text: body }));
      var b = E("button", { class: "hx-btn hx-btn--sm hx-empty__cta" }, ["Back to SLO wall"]); b.addEventListener("click", function () { go("/ops"); });
      e.appendChild(b);
      return e;
    }
    function provFooter(activity, used, obj) {
      root.appendChild(E("div", { class: "hx-prov-footer", text: "generated by " + activity + " · used " + used + " · object " + obj + " · synthetic telemetry" }));
    }

    /* ---------------------------------------------------------------- keys & boot */
    HX.keys.bind({
      "1": function () { go("/ops"); return true; },
      "2": function () { go("/ops/map"); return true; },
      "3": function () { go("/ops/topics"); return true; },
      "4": function () { go("/ops/connectors"); return true; },
      "5": function () { go("/ops/dlq"); return true; },
      "6": function () { go("/ops/replay"); return true; },
      "7": function () { go("/ops/incidents"); return true; }
    });
    window.addEventListener("hashchange", function () { if (loaded) render(); });
    HX.asof.on(function () { if (loaded) render(); });
    render(); // paint tab bar + skeleton immediately
    boot();
  })();
  </script>
