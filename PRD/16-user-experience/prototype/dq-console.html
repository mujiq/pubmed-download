<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HEALIX Console — Quality & Warehouse</title>
  <meta name="description" content="Data-quality console: scorecards G1–G9 (four DQ bands), rules, issues, quarantine, exceptions, and the entitled break-glass remediation workspace. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only. All colour comes from app.css tokens.
       The DQ console is a five-tab surface (Scorecards · Rules · Issues ·
       Quarantine · Exceptions) with object detail pages (scorecard / rule /
       issue / exception) and an entitled, red-framed break-glass remediation
       workspace reached only from an issue. Everything reflows to one column
       at phone width with a 16px gutter and no horizontal page scroll. */
    .dq-tabs { position: sticky; top: var(--topbar-h); z-index: 15; background: var(--bg-canvas); padding-top: var(--sp-1); }
    .dq-breadcrumb { margin-bottom: var(--sp-2); }
    /* keep the sticky object header clear of the sticky tab bar (both would otherwise pin at --topbar-h) */
    #dq-root .hx-object-header { top: calc(var(--topbar-h) + 42px); z-index: 14; }
    @media (max-width: 768px) { #dq-root .hx-object-header { top: auto; } }

    .dq-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-3); align-items: start; }
    .dq-scorecard-tile { text-align: left; width: 100%; cursor: pointer; border-left: 4px solid var(--band-color, var(--neutral-fg)); display: flex; flex-direction: column; gap: var(--sp-2); }
    .dq-scorecard-tile:hover { border-color: var(--border-strong); }
    .dq-scorecard-tile .hx-tile__band { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; }
    .dq-sc-dqi { font-size: var(--fs-h2); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dq-sc-breaches { display: flex; gap: 4px; flex-wrap: wrap; }

    .dq-detail-head { display: flex; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .dq-detail-head__band { display: flex; flex-direction: column; gap: 2px; }
    .dq-detail-head__band .dq-sc-dqi { font-size: var(--fs-h1); }
    .dq-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); align-items: start; }

    .dq-subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-3); overflow-x: auto; }

    .dq-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); }
    .dq-kv dt { color: var(--fg-muted); white-space: nowrap; }
    .dq-kv dd { margin: 0; font-family: var(--font-mono); font-size: var(--fs-caption); }

    .dq-contrib { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .dq-contrib th, .dq-contrib td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); }
    .dq-contrib td:last-child, .dq-contrib th:last-child { text-align: right; font-family: var(--font-mono); }
    .dq-delta-neg { color: var(--danger-fg); } .dq-delta-pos { color: var(--ok-fg); }

    .dq-derivation { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-caption); }
    .dq-derivation__sep { color: var(--fg-faint); }

    .dq-action-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-2); }
    .dq-action-card { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); text-align: left; cursor: pointer; }
    .dq-action-card:hover:not([aria-disabled="true"]) { border-color: var(--accent); background: var(--bg-sunken); }
    .dq-action-card[aria-disabled="true"] { opacity: .7; cursor: not-allowed; background: var(--bg-sunken); }
    .dq-action-card__reason { font-size: var(--fs-micro); color: var(--warn-fg); font-family: var(--font-mono); }
    .dq-action-card--entitled { border-color: var(--frame-emergency); }
    .dq-action-card--entitled:hover { background: var(--danger-bg); }

    .dq-sim { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); }
    .dq-sim__out { display: flex; gap: var(--sp-6); flex-wrap: wrap; }
    .dq-sim__big { font-size: var(--fs-h2); font-weight: 600; font-variant-numeric: tabular-nums; }

    .dq-failing { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .dq-failing th, .dq-failing td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); }
    .dq-failing td.num, .dq-failing th.num { text-align: right; font-family: var(--font-mono); }

    .dq-records { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .dq-records th, .dq-records td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); }
    .dq-records td { font-family: var(--font-mono); font-size: var(--fs-caption); }

    .dq-chart-legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--fs-caption); margin-top: var(--sp-2); }
    .dq-chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dq-chart-legend i { width: 18px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
    .dq-chart-legend i.ghost { border-top-style: dashed; border-top-color: var(--fg-muted); }

    .dq-mini-list { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
    .dq-mini-row { display: flex; align-items: center; gap: var(--sp-2); justify-content: space-between; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); font-size: var(--fs-dense); }
    .dq-mini-row:last-child { border-bottom: 0; }

    .sr-skip { position: absolute; left: -999px; top: 0; }
    .sr-skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 6px 10px; border-radius: var(--r-ctl); }
    @media (max-width: 768px) { .dq-detail-head { gap: var(--sp-2); } }
  </style>
</head>

      if (!session || !session.id) return;
      var now = new Date().toISOString();
      var m = bgLoad();
      var rec = m[session.id] || bgRec(session);
      if (rec.closedAt) return; // already closed on another exit path — never double-queue
      rec.closedAt = now; rec.exitVia = via; rec.recordsViewed = session.recordsViewed || rec.recordsViewed || 0; rec.reviewQueuedAt = now;
      if (surface) { HX.audit.write({ type: "PRIVACY_REVIEW_QUEUED", session: session.id, issue: session.issue, exitVia: via, recordsViewed: rec.recordsViewed }); rec.reviewSurfaced = true; }
      m[session.id] = rec; bgSave(m);
    }
    // On load: surface any durably-queued review this fresh context has not yet
    // logged, and force-close any marker that never got ANY close (hard tab kill
    // or crash where even pagehide did not fire) into an unreconciled-exit
    // review. Fully-reconciled markers are then pruned to bound storage.
    function reconcileOpenSessions() {
      var m = bgLoad(); var changed = false;
      Object.keys(m).forEach(function (id) {
        var rec = m[id]; if (!rec) return;
        if (!rec.closedAt) { rec.closedAt = new Date().toISOString(); rec.exitVia = "unreconciled_exit"; rec.reviewQueuedAt = rec.reviewQueuedAt || rec.closedAt; changed = true; }
        if (rec.reviewQueuedAt && !rec.reviewSurfaced) {
          HX.audit.write({ type: "PRIVACY_REVIEW_QUEUED", session: rec.id, issue: rec.issue, exitVia: rec.exitVia, recordsViewed: rec.recordsViewed, reconciled: true });
          rec.reviewSurfaced = true; changed = true;
        }
      });
      var pruned = {}; Object.keys(m).forEach(function (id) { if (!m[id].closedAt || !m[id].reviewSurfaced) pruned[id] = m[id]; });
      if (changed || Object.keys(pruned).length !== Object.keys(m).length) bgSave(pruned);
    }
    // pagehide/beforeunload: the common non-button exits. Record the mandatory
    // close durably now; the next load surfaces the PRIVACY_REVIEW_QUEUED item.
    function onBreakGlassPageExit() {
      var s = HX.breakglass && HX.breakglass.active;
      if (s) closeBreakGlass(s, "pagehide", false);
    }

    /* ================================================================ QUARANTINE */
    function viewQuarantine() {
      renderTabs("quarantine"); CLEAR(root);
      root.appendChild(E("div", { class: "hx-page-title" }, [E("h1", { text: "Quarantine" }), E("span", { class: "hx-muted hx-dense", text: "Records held out of the warehouse pending remediation, by topic" })]));
      if (!D.quarantine.length) { root.appendChild(emptyState("Nothing quarantined", "No records are held out right now.")); return; }
      var grid = E("div", { class: "dq-cards" });
      D.quarantine.forEach(function (q) {
        var card = E("div", { class: "hx-card" });
        card.appendChild(E("div", { class: "hx-row", style: "justify-content:space-between" }, [HX.groupChip(q.group), HX.chip(q.count > 1000 ? "warn" : "neutral", HX.format.num(q.count, 0) + " held")]));
        card.appendChild(E("div", { class: "hx-mono hx-caption", style: "margin:6px 0", text: q.topic }));
        card.appendChild(E("div", { class: "hx-caption hx-muted", text: "oldest " + HX.format.time(q.oldest, "event") }));
        var row = E("div", { class: "hx-row", style: "margin-top:var(--sp-2)" });
        var t = peekChip("Open topic", "info", "/topic/" + q.topic); row.appendChild(t);
        var rel = E("a", { href: "#", class: "home-link" }, ["Related issues"]);
        rel.addEventListener("click", function (e) { e.preventDefault(); go("/dq/issues"); });
        row.appendChild(rel);
        card.appendChild(row);
        grid.appendChild(card);
      });
      root.appendChild(grid);
      focusRoot();
    }

    /* ================================================================ EXCEPTIONS */
    function allExceptions() {
      var list = D.exceptions.slice();
      Object.keys(MEM.exceptions).forEach(function (id) { var m = MEM.exceptions[id]; list.unshift({ id: id, issue: m.issue, rule: m.rule, group: m.group, requestedBy: HX.role.principal(), approvedBy: [], secondApproverRequired: m.state === "awaiting_second_approver", reason: "Session draft exception.", expiresAt: new Date(Date.now() + 30 * 86400000).toISOString(), state: m.state }); });
      return list;
    }
    function viewExceptions() {
      renderTabs("exceptions"); CLEAR(root);
      root.appendChild(E("div", { class: "hx-page-title" }, [E("h1", { text: "Exceptions" }), E("span", { class: "hx-muted hx-dense", text: "Accepted DQ breaches, time-boxed, with a reason" })]));
      var list = allExceptions();
      var table = E("div", { class: "hx-datatable hx-datatable--cards" });
      var tblWrap = E("div", { class: "hx-scroll-x" }); var tbl = E("table"); tblWrap.appendChild(tbl); table.appendChild(tblWrap);
      tbl.appendChild(E("thead", {}, [E("tr", {}, ["Exception", "Rule", "Group", "State", "Approvers", "Expires", ""].map(function (h) { return E("th", { text: h }); }))]));
      var tb = E("tbody");
      list.forEach(function (exc) {
        var tr = E("tr", { tabindex: "0" });
        addCell(tr, "Exception", [E("span", { class: "hx-mono hx-caption", text: exc.id })]);
        addCell(tr, "Rule", [E("span", { class: "hx-mono hx-caption", text: exc.rule })]);
        addCell(tr, "Group", [HX.groupChip(exc.group)]);
        var stKind = exc.state === "active" ? "ok" : exc.state === "expiring_soon" ? "warn" : exc.state === "awaiting_second_approver" ? "pending" : "neutral";
        addCell(tr, "State", [HX.chip(stKind, TC(exc.state))]);
        addCell(tr, "Approvers", [E("span", { class: "hx-caption", text: (exc.approvedBy || []).length + (exc.secondApproverRequired ? " / 2" : " / 1") })]);
        addCell(tr, "Expires", [E("span", { class: "hx-time", text: HX.format.time(exc.expiresAt, "valid") })]);
        var actTd = E("td", { "data-label": "" });
        if (exc.secondApproverRequired && (exc.approvedBy || []).length < 2) {
          var ap = E("button", { class: "hx-btn hx-btn--sm" }, ["Second approve"]);
          ap.addEventListener("click", function (e) { e.stopPropagation(); secondApprove(exc); });
          actTd.appendChild(ap);
        }
        tr.appendChild(actTd);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb); table.appendChild(tblWrap); root.appendChild(table);
      focusRoot();
    }
    function secondApprove(exc) {
      HX.env.confirmWrite().then(function (ok) { if (!ok) return; HX.confirm({ title: "Second approval", body: "Co-sign exception " + exc.id + " for " + exc.rule + "?", confirmLabel: "Co-sign" }).then(function (c) { if (!c) return; if (MEM.exceptions[exc.id]) MEM.exceptions[exc.id].state = "active"; HX.audit.write({ type: "EXCEPTION_SECOND_APPROVAL", exception: exc.id, by: HX.role.principal() }); HX.toast(exc.id + " co-signed and now active.", { kind: "ok" }); viewExceptions(); }); });
    }
    function viewExceptionDetail(id) {
      renderTabs("exceptions"); CLEAR(root);
      var exc = allExceptions().filter(function (e) { return e.id === id; })[0];
      if (!exc) { root.appendChild(emptyState("No exception " + id, "Pick an exception from the Exceptions tab.")); return; }
      root.appendChild(crumb([{ label: "Exceptions", route: "/dq/exceptions" }, { label: id }]));
      var card = E("div", { class: "hx-card", style: "max-width:640px" });
      card.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: id })]));
      var kv = E("dl", { class: "dq-kv" });
      [["Rule", exc.rule], ["Group", exc.group], ["Requested by", exc.requestedBy], ["Approvers", (exc.approvedBy || []).join(", ") || "—"], ["Second approver", exc.secondApproverRequired ? "required" : "not required"], ["State", exc.state], ["Expires", HX.format.time(exc.expiresAt, "valid")]].forEach(function (p) { kv.appendChild(E("dt", { text: p[0] })); kv.appendChild(E("dd", { text: p[1] })); });
      card.appendChild(kv);
      card.appendChild(E("p", { style: "margin-top:var(--sp-3)", text: exc.reason }));
      if (exc.issue) { var ir = E("div", { class: "hx-row" }); ir.appendChild(E("span", { class: "hx-caption hx-muted", text: "From issue" })); ir.appendChild(peekChip(exc.issue, "info", "/issue/" + exc.issue)); card.appendChild(ir); }
      root.appendChild(card);
      focusRoot();
    }

    /* ---------------------------------------------------------------- utilities */
    function addCell(tr, label, nodes) { var td = E("td", { "data-label": label }); nodes.forEach(function (n) { if (n) td.appendChild(n); }); tr.appendChild(td); }
    function emptyState(title, hint) { return E("div", { class: "hx-empty" }, [E("div", { text: title }), E("div", { class: "hx-empty__cta hx-caption", text: hint })]); }
    function focusRoot() { try { root.focus({ preventScroll: true }); } catch (e) {} }

    /* ---------------------------------------------------------------- router */
    function render() {
      HX.keys.bind({ j: null, k: null, o: null }); // reset list chords between views
      var p = routeParts();
      // p like ["dq"], ["dq","rules"], ["scorecard","G2"], ["rule","DQR-..."], ["issue","ISS-..."], ["issue","ISS-...","?"], ["remediation","ISS-...","records"], ["exception","EXC-..."], ["quarantine"]...
      var a = p[0];
      if (a === "scorecard") return viewScorecardDetail(p[1]);
      if (a === "rule") return viewRuleDetail(p.slice(1).join("/"));
      if (a === "issue") return viewIssueDetail(p[1]);
      if (a === "remediation") return viewRemediation(p[1]);
      if (a === "exception") return viewExceptionDetail(p[1]);
      // /dq and /dq/<tab>
      var tab = p[1] || "scorecards";
      if (a === "quarantine") tab = "quarantine";
      if (a === "exceptions") tab = "exceptions";
      if (a === "rules") tab = "rules";
      if (a === "issues") tab = "issues";
      switch (tab) {
        case "rules": return viewRules();
        case "issues": return viewIssues();
        case "quarantine": return viewQuarantine();
        case "exceptions": return viewExceptions();
        default: return viewScorecards();
      }
    }

    function buildIndexes() {
      D.rules.forEach(function (r) { IX.rule[r.id] = r; });
      D.issues.forEach(function (i) { IX.issue[i.id] = i; });
      D.scorecards.forEach(function (s) { IX.sc[s.group] = s; });
      D.exceptions.forEach(function (e) { IX.exc[e.id] = e; });
    }

    // palette provider: resolve DQ ids and labels
    HX.palette.register(function (q) {
      if (!loaded || !q) return null;
      var n = q.toLowerCase(); var items = [];
      D.rules.filter(function (r) { return (r.id + " " + r.label).toLowerCase().indexOf(n) >= 0; }).slice(0, 5).forEach(function (r) { items.push({ label: r.label, id: r.id, route: "/rule/" + r.id, chips: [r.severity, r.group] }); });
      D.issues.filter(function (i) { return i.id.toLowerCase().indexOf(n) >= 0 || i.rule.toLowerCase().indexOf(n) >= 0; }).slice(0, 5).forEach(function (i) { items.push({ label: i.id + " · " + i.rule, id: effectiveIssueState(i), route: "/issue/" + i.id, chips: [i.severity, i.group] }); });
      D.scorecards.filter(function (s) { return ("scorecard " + s.group + " " + s.label).toLowerCase().indexOf(n) >= 0; }).slice(0, 3).forEach(function (s) { items.push({ label: "Scorecard " + s.group + " · " + s.label, id: s.band, route: "/scorecard/" + s.group, chips: [s.band] }); });
      return items.length ? { group: "Quality", items: items } : null;
    });

    window.addEventListener("hashchange", render);
    // Break-glass close is mandatory on every exit, not a UI courtesy: cover the
    // non-button paths (rail/palette full load, tab close, Back) and reconcile
    // any session a prior load left open. Runs independently of DQ data loading.
    window.addEventListener("pagehide", onBreakGlassPageExit);
    window.addEventListener("beforeunload", onBreakGlassPageExit);
    reconcileOpenSessions();

    // boot
    root.appendChild(E("div", { class: "hx-stack" }, [E("div", { class: "hx-skeleton", style: "height:120px" }), E("div", { class: "hx-skeleton", style: "height:200px" })]));
    HX.data.load("dq").then(function (d) {
      D.scorecards = d.scorecards || []; D.rules = d.rules || []; D.issues = d.issues || [];
      D.exceptions = d.exceptions || []; D.quarantine = d.quarantine || []; D.bands = d.bands || BANDS;
      loaded = true; buildIndexes(); render();
    }).catch(function (e) { loaded = true; console.warn("DQ data load issue:", e); render(); });
  })();
  </script>
</body>
</html>
