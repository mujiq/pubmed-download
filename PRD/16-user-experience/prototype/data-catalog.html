<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HEALIX Console — Sources &amp; Warehouse</title>
  <meta name="description" content="Source registry with 12-step onboarding, data elements, mapping specs, value sets, and the EDW catalog (groups G1-G9 to schemas to tables to columns) with query templates. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* ------------------------------------------------------------------
       data-catalog.html — page-local layout only. Every colour comes from
       app.css tokens; this block is geometry. The surface is a five-tab
       catalog (Sources · Elements · Mapping specs · Value sets · Warehouse)
       with canonical object pages (source, element, mapspec, value set,
       concept map, profile, table, column). It reflows to one column at
       390px with a 16px gutter and no horizontal page scroll.
       ------------------------------------------------------------------ */
    .dc-tabs { position: sticky; top: var(--topbar-h); z-index: 15; background: var(--bg-canvas); display: flex; gap: 2px; padding-top: var(--sp-1); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .dc-tab { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 var(--sp-3); border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--fg-muted); font-size: var(--fs-dense); font-weight: 500; white-space: nowrap; cursor: pointer; }
    .dc-tab:hover { color: var(--fg); }
    .dc-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
    .dc-tab__count { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-faint); }

    /* agent attribution inside the mono provenance footer reads as a link to its canonical /agent/ page */
    .hx-prov-footer__agent { color: var(--accent); text-decoration: none; }
    .hx-prov-footer__agent:hover { text-decoration: underline; }
    .hx-prov-footer__agent:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    #dc-root { padding-top: var(--sp-4); }
    #dc-root .hx-object-header { top: calc(var(--topbar-h) + 48px); z-index: 14; }
    @media (max-width: 768px) { #dc-root .hx-object-header { position: static; } }

    .dc-list-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .dc-list-head h1 { font-size: var(--fs-h2); line-height: var(--lh-h2); }
    .dc-sub { color: var(--fg-muted); font-size: var(--fs-dense); max-width: 68ch; margin-bottom: var(--sp-4); }

    .dc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); align-items: start; }
    .dc-source-card { display: flex; flex-direction: column; gap: var(--sp-2); text-align: left; cursor: pointer; width: 100%; }
    .dc-source-card:hover { border-color: var(--border-strong); }
    .dc-source-card__top { display: flex; align-items: flex-start; gap: var(--sp-2); }
    .dc-source-card__title { font-weight: 600; flex: 1; min-width: 0; }
    .dc-source-card__id { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); }
    .dc-onboard-bar { height: 6px; border-radius: 3px; background: var(--bg-sunken); overflow: hidden; }
    .dc-onboard-bar i { display: block; height: 100%; background: var(--ok-fg); }
    .dc-interface-health { display: flex; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-micro); }

    .dc-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); align-items: baseline; }
    .dc-kv dt { color: var(--fg-muted); white-space: nowrap; }
    .dc-kv dd { margin: 0; }
    .dc-kv dd.mono { font-family: var(--font-mono); font-size: var(--fs-caption); word-break: break-word; }

    .dc-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); align-items: start; }
    .dc-subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: var(--sp-3); overflow-x: auto; }
    .dc-subtab { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--sp-3); border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--fg-muted); font-size: var(--fs-dense); font-weight: 500; white-space: nowrap; cursor: pointer; }
    .dc-subtab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
    .dc-subtab:hover { color: var(--fg); }

    .dc-mapspec { display: grid; grid-template-columns: 240px 1fr; gap: var(--sp-4); align-items: start; }
    @media (max-width: 1024px) { .dc-mapspec { grid-template-columns: 1fr; } }
    .dc-segtree { list-style: none; margin: 0; padding: 0; font-size: var(--fs-dense); }
    .dc-segtree__seg { font-weight: 600; padding: var(--sp-2) 0 2px; }
    .dc-segtree__fields { list-style: none; margin: 0 0 var(--sp-2); padding: 0 0 0 var(--sp-3); }
    .dc-segtree__field { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--fg-muted); padding: 2px 0; cursor: pointer; border-radius: var(--r-ctl); }
    .dc-segtree__field:hover, .dc-segtree__field.is-active { background: var(--info-bg); color: var(--info-fg); }

    .dc-maprows { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    .dc-maprows th, .dc-maprows td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); vertical-align: top; }
    .dc-maprows th { font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; }
    .dc-maprows td.mono { font-family: var(--font-mono); font-size: var(--fs-caption); }
    .dc-maprows tr.is-active { background: var(--info-bg); }

    .dc-vs-members { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
    .dc-vs-delta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    @media (max-width: 600px) { .dc-vs-delta { grid-template-columns: 1fr; } }

    .dc-group-list { display: flex; flex-direction: column; gap: var(--sp-2); }
    .dc-group { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); overflow: hidden; }
    .dc-group__head { display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: var(--sp-2) var(--sp-3); background: transparent; border: 0; cursor: pointer; text-align: left; border-left: 4px solid var(--band-color, var(--neutral-fg)); }
    .dc-group__head:hover { background: var(--bg-sunken); }
    .dc-group__name { font-weight: 600; flex: 1; min-width: 0; }
    .dc-group__tables { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    .dc-group__table { display: flex; align-items: center; gap: var(--sp-2); padding: 6px var(--sp-3) 6px var(--sp-6); border-bottom: 1px solid var(--border); font-size: var(--fs-dense); cursor: pointer; }
    .dc-group__table:last-child { border-bottom: 0; }
    .dc-group__table:hover, .dc-group__table:focus-visible { background: var(--bg-sunken); }
    .dc-group__table-name { font-family: var(--font-mono); font-size: var(--fs-caption); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .dc-depth { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; }
    .dc-depth button { border: 0; background: var(--bg-surface); color: var(--fg-muted); padding: 4px 12px; font-size: var(--fs-caption); min-height: 28px; cursor: pointer; }
    .dc-depth button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

    .dc-steward-picker { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: flex-end; }
    .dc-steward-picker .hx-field { margin: 0; min-width: 180px; }

    .dc-colgrid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-card); }
    table.dc-colgrid { width: 100%; border-collapse: collapse; font-size: var(--fs-dense); }
    table.dc-colgrid th, table.dc-colgrid td { text-align: left; padding: 6px var(--sp-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.dc-colgrid th { font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 600; position: sticky; top: 0; background: var(--bg-surface); }
    table.dc-colgrid td.mono { font-family: var(--font-mono); font-size: var(--fs-caption); }
    table.dc-colgrid tr { cursor: pointer; }
    table.dc-colgrid tbody tr:hover { background: var(--bg-sunken); }
    table.dc-colgrid tr.is-not-yet td { color: var(--fg-faint); font-style: italic; }

    .dc-query { display: flex; flex-direction: column; gap: var(--sp-3); }
    .dc-pins { display: flex; flex-wrap: wrap; gap: var(--sp-2); font-family: var(--font-mono); font-size: var(--fs-caption); }

    .sr-skip { position: absolute; left: -999px; top: 0; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; border-radius: 0 0 var(--r-ctl) 0; }
    .sr-skip:focus { left: 0; }

    @media (max-width: 768px) {
      #dc-root .hx-datatable--cards table, #dc-root .hx-datatable--cards thead, #dc-root .hx-datatable--cards tbody, #dc-root .hx-datatable--cards th, #dc-root .hx-datatable--cards td, #dc-root .hx-datatable--cards tr { display: block; }
      #dc-root .hx-datatable--cards thead { display: none; }
      #dc-root .hx-datatable--cards tr { border: 1px solid var(--border); border-radius: var(--r-ctl); margin: var(--sp-2); padding: var(--sp-2); }
      #dc-root .hx-datatable--cards td { border: 0; padding: 2px 0; display: flex; justify-content: space-between; gap: var(--sp-2); }
      #dc-root .hx-datatable--cards td::before { content: attr(data-label); color: var(--fg-muted); font-size: var(--fs-caption); }
      .dc-mapspec { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
  /* ====================================================================
     data-catalog.html — page-local controller (no app.js edits).
     Builds the Sources & Flow + Warehouse catalog on the shared HX runtime:
       - Sources tab + source page with the 12-step onboarding wizard,
         interface health, Z-segment / unmapped findings, and a role-only
         stewardship picker that rejects typed person names inline.
       - Elements tab + element page (profiling, binding, PHI, the 10-day
         unclassified clock, drift flag), masked top values.
       - Mapping specs tab + mapspec editor (segment tree · FHIRPath rows ·
         golden-test results, with version history).
       - Value sets tab (value sets · concept maps · FHIR profiles) with
         expansion and expansion-delta.
       - Warehouse tab: groups G1-G9 (band + binding coverage chart) ->
         schemas -> tables -> columns; the table page toggles analyst /
         architect depth, pins the as-of control into the Query templates,
         and the column grid offers "Bind to property" (binding CR draft).
     All state changes (created CR drafts, reassignments) live in memory for
     the session only (AC-17: no result payloads persisted client-side).
     ==================================================================== */
  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, CLEAR = HX.util.clear, TC = HX.util.titleCase, GN = HX.util.groupName;

    HX.mount({ page: "data-catalog", area: "sources", title: "Sources & Warehouse" });

    var tabsEl = document.getElementById("dc-tabs");
    var root = document.getElementById("dc-root");

    var D = null;          // catalog data
    var IX = {};           // indexes
    // session-only UI state preserved across re-renders (e.g. as-of changes)
    var ui = { tableTab: "overview", depth: "analyst", vsTab: "valuesets", sourceTab: "onboarding", mapField: null };

    var TABS = [
      { id: "sources",   label: "Sources",       route: "/sources",   roots: ["sources", "source"] },
      { id: "elements",  label: "Elements",      route: "/elements",  roots: ["elements", "element"] },
      { id: "mapspecs",  label: "Mapping specs", route: "/mapspecs",  roots: ["mapspecs", "mapspec"] },
      { id: "valuesets", label: "Value sets",    route: "/valuesets", roots: ["valuesets", "valueset", "conceptmap", "profiles", "profile"] },
      { id: "edw",       label: "Warehouse",     route: "/edw",       roots: ["edw", "table", "column", "migration"] }
    ];

    /* ---------------------------------------------------------------- helpers */
    function phiChip(cls) { return HX.phiChip(cls); }
    function bindChip(status) {
      var s = String(status || "unbound");
      var cls = "binding-" + s.replace(/[^a-z-]/g, "");
      var glyph = { bound: "check", "local-only": "warn", pending: "pending", unbound: "neutral", unbindable: "neutral" }[s] || "neutral";
      var c = HX.chip(cls, TC(s), { title: "Binding status: " + s });
      return c;
    }
    function bandChip(band) { return HX.chip("band-" + String(band || "").toLowerCase(), band); }
    function bandColor(band) { return ({ Green: "var(--ok-fg)", Amber: "var(--warn-fg)", Red: "var(--danger-fg)", Black: "var(--black-band-bg)" })[band] || "var(--neutral-fg)"; }
    function dqStatusChip(st) {
      var map = { pass: "pass", warn: "warn", fail: "fail" };
      if (!st) return HX.chip("neutral", "n/a");
      return HX.chip(map[st] || "neutral", TC(st));
    }
    function sourceOf(id) { return IX.source[id]; }
    function kv(pairs) {
      var dl = E("dl", { class: "dc-kv" });
      pairs.forEach(function (p) {
        if (p == null) return;
        dl.appendChild(E("dt", { text: p[0] }));
        var dd = E("dd", { class: p[2] ? p[2] : null });
        if (typeof p[1] === "string" || typeof p[1] === "number") dd.textContent = String(p[1]);
        else if (p[1]) dd.appendChild(p[1]);
        dl.appendChild(dd);
      });
      return dl;
    }
    function section(title, bodyNodes, head2) {
      var s = E("section", { class: "hx-section" });
      var h = E("div", { class: "hx-section__head" });
      h.appendChild(E("h2", { text: title }));
      if (head2) h.appendChild(head2);
      s.appendChild(h);
      (Array.isArray(bodyNodes) ? bodyNodes : [bodyNodes]).forEach(function (n) { if (n) s.appendChild(n); });
      return s;
    }
    function crumb(items) {
      var bc = E("nav", { class: "hx-breadcrumb", "aria-label": "Breadcrumb" });
      items.forEach(function (it, i) {
        if (i) bc.appendChild(E("span", { class: "hx-breadcrumb__sep", "aria-hidden": "true", text: "›" }));
        if (it.route) {
          var a = E("a", { href: "#" + it.route, class: "hx-chip hx-chip--neutral" }, [it.label]);
          a.addEventListener("click", function (e) { e.preventDefault(); HX.nav(it.route); });
          bc.appendChild(a);
        } else bc.appendChild(E("span", { class: "hx-chip hx-chip--neutral", text: it.label }));
      });
      return bc;
    }
    function provFooter(parts) { return E("div", { class: "hx-prov-footer" }, Array.isArray(parts) ? parts : [parts]); }
    // inline link to an agent's canonical /agent/ page (provenance "trust is shown", UX-OPS-001)
    function agentLink(id) {
      var a = E("a", { href: "#/agent/" + id, class: "hx-prov-footer__agent", text: id });
      a.addEventListener("click", function (e) { e.preventDefault(); HX.nav("/agent/" + id); });
      return a;
    }
    function linkChip(label, route, kind) {
      var c = HX.chip(kind || "neutral", label, { button: true });
      c.addEventListener("click", function () { HX.nav(route); });
      return c;
    }
    // create a CR draft (session only) with an 8-second undo toast (§P6, AC-18)
    function crDraft(crType, desc) {
      HX.audit.write({ type: "CR_DRAFT_CREATED", crType: crType, desc: desc, by: HX.role.principal() });
      HX.live("Draft " + crType + " created — " + desc, "polite");
      var undone = false;
      HX.toast("Draft " + crType + " created — " + desc, {
        kind: "ok",
        undo: function () { undone = true; HX.audit.write({ type: "CR_DRAFT_DISCARDED", crType: crType }); HX.live("Draft discarded", "polite"); }
      });
    }

    /* ---------------------------------------------------------------- routing */
    function routeStr() {
      var h = location.hash.slice(1);
      var qi = h.indexOf("?");
      return ((qi < 0 ? h : h.slice(0, qi)) || "/sources").replace(/^#/, "");
    }
    function routeParts() { return routeStr().split("/").filter(Boolean); }

    function renderTabs() {
      CLEAR(tabsEl);
      var parts = routeParts();
      var root0 = parts[0] || "sources";
      TABS.forEach(function (t) {
        var active = t.roots.indexOf(root0) >= 0;
        var count = { sources: D.sources.length, elements: D.elements.length, mapspecs: D.mapspecs.length, valuesets: D.valueSets.length, edw: D.tables.length }[t.id];
        var b = E("button", { class: "dc-tab", role: "tab", "aria-selected": active ? "true" : "false", id: "dc-tab-" + t.id },
          [E("span", { text: t.label }), E("span", { class: "dc-tab__count", text: count })]);
        b.addEventListener("click", function () { HX.nav(t.route); });
        tabsEl.appendChild(b);
      });
    }

    function render() {
      if (!D) return;
      renderTabs();
      CLEAR(root);
      HX.keys.bind({ j: null, k: null, o: null, n: null }); // reset list chords between views
      var parts = routeParts();
      var r0 = parts[0] || "sources";
      try {
        switch (r0) {
          case "sources": viewSourcesList(); break;
          case "source": viewSource(parts[1]); break;
          case "elements": viewElementsList(); break;
          case "element": viewElement(parts.slice(1).join("/")); break;
          case "mapspecs": viewMapspecList(); break;
          case "mapspec": viewMapspec((parts[1] || "").split("@")[0]); break;
          case "valuesets": ui.vsTab = "valuesets"; viewValueSetsList(); break;
          case "valueset": viewValueSet(parts[1]); break;
          case "conceptmap": viewConceptMap(parts[1]); break;
          case "profiles": ui.vsTab = "profiles"; viewValueSetsList(); break;
          case "profile": viewProfile(parts[1]); break;
          case "edw": viewWarehouse(); break;
          case "table": viewTable(parts[1], parts[2]); break;
          case "column": viewColumn(parts[1], parts[2], parts.slice(3).join(".")); break;
          case "migration": viewMigration(parts[1]); break;
          case "connector": case "processor": viewInteropRedirect(r0, parts[1]); break;
          default: viewSourcesList();
        }
      } catch (err) {
        root.appendChild(E("div", { class: "hx-error" }, [E("div", {}, ["Could not render this view."]), E("div", { class: "hx-error__corr", text: "ref " + (err && err.message || "unknown") })]));
        console.error(err);
      }
      root.focus();
    }

    /* keyboard list navigation shared by list views */
    function wireList(rows, onOpen) {
      var i = -1;
      function focusRow(n) {
        if (!rows.length) return;
        i = Math.max(0, Math.min(rows.length - 1, n));
        rows.forEach(function (r, k) { r.setAttribute("aria-selected", k === i ? "true" : "false"); });
        rows[i].scrollIntoView({ block: "nearest" });
        rows[i].focus();
      }
      HX.keys.bind({
        j: function () { focusRow(i + 1); },
        k: function () { focusRow(i - 1); },
        o: function () { if (i >= 0 && onOpen) onOpen(rows[i]); }
      });
    }

    /* ================================================================ SOURCES */
    function viewSourcesList() {
      root.appendChild(E("div", { class: "dc-list-head" }, [
        E("h1", { text: "Source registry" }),
        E("span", { class: "hx-caption hx-muted", text: D.sources.length + " systems · Cerner Millennium, Oracle Fusion, peripheral feeds" })
      ]));
      root.appendChild(E("p", { class: "dc-sub", text: "Every source is onboarded through the 12-step wizard (SRC-00 §4.6); each step is a change request owned by a named agent or role. PHI posture is shown on every card; patient-level values are never shown here." }));

      var grid = E("div", { class: "dc-cards" });
      var rows = [];
      D.sources.forEach(function (s) {
        var done = s.onboarding.filter(function (st) { return st.state === "done"; }).length;
        var inProg = s.onboarding.filter(function (st) { return st.state === "in_progress"; }).length;
        var card = E("button", { class: "hx-card dc-source-card", role: "link", tabindex: "0", "aria-label": s.label + ", onboarding " + done + " of 12 steps complete" });
        var top = E("div", { class: "dc-source-card__top" }, [
          E("div", { class: "dc-source-card__title" }, [E("div", { text: s.label }), E("div", { class: "dc-source-card__id", text: s.id })]),
          phiChip(s.phiPosture)
        ]);
        card.appendChild(top);
        card.appendChild(E("div", { class: "hx-row" }, [
          HX.chip("type", s.class), HX.chip(s.lifecycle === "active" ? "ok" : "pending", TC(s.lifecycle)),
          E("span", { class: "hx-caption hx-muted", text: s.elements + " elements" })
        ]));
        var ih = E("div", { class: "dc-interface-health" });
        s.interfaces.forEach(function (ifc) {
          var st = ifc.health.state;
          var kind = st === "running" ? "pass" : st === "failed" ? "fail" : st === "not_started" ? "neutral" : "warn";
          ih.appendChild(HX.chip(kind, ifc.type + (ifc.health.dlq ? " · DLQ " + ifc.health.dlq : ""), { title: ifc.id + " · " + st }));
        });
        card.appendChild(ih);
        card.appendChild(E("div", {}, [
          E("div", { class: "hx-row", style: "justify-content:space-between" }, [
            E("span", { class: "hx-caption hx-muted", text: "Onboarding " + done + "/12" + (inProg ? " · " + inProg + " active" : "") }),
            done === 12 ? HX.chip("ok", "Promoted") : HX.chip("pending", "In progress")
          ]),
          (function () { var bar = E("div", { class: "dc-onboard-bar" }); bar.appendChild(E("i", { style: "width:" + Math.round(done / 12 * 100) + "%" })); return bar; })()
        ]));
        if (s.elementsUnclassified) card.appendChild(E("div", { class: "hx-row" }, [HX.chip("warn", s.elementsUnclassified + " PHI-unknown · 10-day clock")]));
        card.addEventListener("click", function () { HX.nav("/source/" + s.id); });
        card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); HX.nav("/source/" + s.id); } });
        grid.appendChild(card); rows.push(card);
      });
      root.appendChild(grid);
      wireList(rows, function (r) { r.click(); });
    }

    function viewSource(id) {
      var s = sourceOf(id);
      if (!s) return notFound("source", id);
      root.appendChild(crumb([{ label: "Sources", route: "/sources" }, { label: s.label }]));
      // object header
      var header = E("header", { class: "hx-object-header" });
      var top = E("div", { class: "hx-object-header__top" }, [
        E("div", { class: "hx-object-header__titles" }, [
          E("div", { class: "hx-object-header__label", text: s.label }),
          E("div", { class: "hx-object-header__id", text: s.id })
        ]),
        E("div", { class: "hx-object-header__actions" }, [
          (function () { var w = E("button", { class: "hx-btn hx-btn--sm" }, [I("watch"), "Watch"]); w.addEventListener("click", function () { HX.toast("Watching " + s.id, { kind: "ok" }); }); return w; })()
        ])
      ]);
      header.appendChild(top);
      header.appendChild(E("div", { class: "hx-object-header__chips" }, [
        HX.chip("type", "Source"), HX.chip("type", s.class), phiChip(s.phiPosture),
        HX.chip(s.lifecycle === "active" ? "ok" : "pending", TC(s.lifecycle)),
        E("span", { class: "hx-caption hx-muted", text: "vendor " + s.vendor })
      ]));
      root.appendChild(header);

      var subtabs = ["onboarding", "interfaces", "elements", "profiling", "stewardship"];
      var labels = { onboarding: "Onboarding (12)", interfaces: "Interfaces", elements: "Elements", profiling: "Findings", stewardship: "Stewardship" };

      });

        binding: t.coverage >= 95 ? "bound" : "pending", release: t.migrations && t.migrations.length ? "migration " + t.migrations.slice(-1)[0] : null, steward: t.steward
      }));

      // depth toggle
      var depthWrap = E("div", { class: "hx-row", style: "justify-content:flex-end;margin-bottom:8px" }, [
        E("span", { class: "hx-caption hx-muted", text: "Detail depth" }),
        (function () {
          var d = E("div", { class: "dc-depth", role: "group", "aria-label": "Detail depth" });
          [["analyst", "Analyst"], ["architect", "Architect (show more)"]].forEach(function (p) {
            var b = E("button", { "aria-pressed": ui.depth === p[0] ? "true" : "false", text: p[1] });
            b.addEventListener("click", function () { ui.depth = p[0]; render(); });
            d.appendChild(b);
          });
          return d;
        })()
      ]);
      root.appendChild(depthWrap);

      // sub-tabs
      var subtabs = ui.depth === "architect"
        ? ["overview", "columns", "query", "ddl", "migrations"]
        : ["overview", "columns", "query"];
      if (subtabs.indexOf(ui.tableTab) < 0) ui.tableTab = "overview";
      var labels = { overview: "Overview", columns: "Columns", query: "Query templates", ddl: "DDL", migrations: "Migrations" };
      var nav = E("div", { class: "dc-subtabs", role: "tablist", "aria-label": "Table views" });
      subtabs.forEach(function (st) {
        var b = E("button", { class: "dc-subtab", role: "tab", "aria-selected": ui.tableTab === st ? "true" : "false" }, [labels[st]]);
        b.addEventListener("click", function () { ui.tableTab = st; drawSub(); nav.querySelectorAll(".dc-subtab").forEach(function (x) { x.setAttribute("aria-selected", "false"); }); b.setAttribute("aria-selected", "true"); });
        nav.appendChild(b);
      });
      root.appendChild(nav);
      var host = E("div"); root.appendChild(host);
      function drawSub() {
        CLEAR(host);
        if (ui.tableTab === "overview") host.appendChild(tableOverview(t));
        else if (ui.tableTab === "columns") host.appendChild(tableColumns(t));
        else if (ui.tableTab === "query") host.appendChild(tableQuery(t));
        else if (ui.tableTab === "ddl") host.appendChild(tableDDL(t));
        else host.appendChild(tableMigrations(t));
      }
      drawSub();
      root.appendChild(provFooter(["generated by prov:EDWBuild · ", agentLink("agent.schema_architect"), " · " + (t.migrations && t.migrations.slice(-1)[0] || "—") + " · Explain this"]));
    }

    function tableOverview(t) {
      var grid = E("div", { class: "dc-detail-grid" });
      var def = E("div", { class: "hx-card" });
      def.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Business definition" })]));
      def.appendChild(E("p", { text: t.businessDefinition || "No business definition recorded." }));
      def.appendChild(kv([
        ["Grain", t.grain],
        ["Rows", E("span", { class: "hx-mono", text: HX.format.num(t.rowCount || 0, 0) })],
        ["Ontology class", HX.iriChip(t.ontologyClassIri)]
      ]));
      grid.appendChild(def);
      var keys = E("div", { class: "hx-card" });
      keys.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Keys & joins" })]));
      keys.appendChild(kv([
        ["Surrogate key", E("span", { class: "hx-mono", text: t.keys.sk })],
        ["Business key", E("span", { class: "hx-mono", text: t.keys.bk })],
        ["Freshness", E("span", { class: "hx-mono", text: "p95 " + t.freshnessP95Min + " min" })]
      ]));
      keys.appendChild(E("div", { class: "hx-caption hx-muted", style: "margin-top:8px", text: "Typical joins" }));
      var jl = E("ul", { style: "margin:4px 0 0;padding-left:18px;font-family:var(--font-mono);font-size:var(--fs-caption)" });
      (t.typicalJoins || []).forEach(function (j) { jl.appendChild(E("li", { text: j })); });
      keys.appendChild(jl);
      grid.appendChild(keys);
      return grid;
    }

    function tableColumns(t) {
      var cols = D.columns.filter(function (c) { return c.table === t.fqn; });
      var asof = HX.asof.get();
      var asOfMs = asof.asOf ? Date.parse(asof.asOf) : null;
      var wrap = E("div");
      if (asof.mode !== "Current") wrap.appendChild(E("p", { class: "hx-caption hx-muted", text: "Viewing columns as they existed at " + HX.format.time(asof.asOf || asof.asKnownAt, "valid") + ". Columns created later show as not-yet-existed." }));
      var scroll = E("div", { class: "dc-colgrid-wrap" });
      var table = E("table", { class: "dc-colgrid", "aria-label": "Columns of " + t.fqn });
      table.appendChild(E("thead", {}, [E("tr", {}, [
        E("th", { text: "Column" }), E("th", { text: "Type" }), E("th", { text: "Ontology property" }), E("th", { text: "PHI" }), E("th", { text: "Source FHIR path" }), E("th", { text: "DQ" })
      ])]));
      var tb = E("tbody"); var rows = [];
      cols.forEach(function (c) {
        var notYet = asOfMs != null && c.existsSince && Date.parse(c.existsSince) > asOfMs;
        var tr = E("tr", { tabindex: "0", "aria-label": c.name, class: notYet ? "is-not-yet" : null });
        tr.appendChild(E("td", { class: "mono" }, [c.name]));
        tr.appendChild(E("td", { class: "mono" }, [c.type]));
        var op = E("td", {});
        if (notYet) op.appendChild(E("span", { class: "hx-placeholder--not-asserted", text: "not yet existed" }));
        else if (c.ontologyPropertyIri) op.appendChild(HX.iriChip(c.ontologyPropertyIri));
        else {
          op.appendChild(HX.chip("gap", "Unbound"));
          var bind = E("button", { class: "hx-btn hx-btn--sm", style: "margin-left:6px" }, ["Bind to property"]);
          bind.addEventListener("click", function (ev) { ev.stopPropagation(); crDraft("CR-CV-BIND", "bind column " + c.name + " to an ontology property (DDL/binding CR)"); });
          op.appendChild(bind);
        }
        tr.appendChild(op);
        tr.appendChild(E("td", {}, [notYet ? E("span", { class: "hx-caption hx-faint", text: "—" }) : phiChip(c.phiClass)]));
        tr.appendChild(E("td", { class: "mono" }, [c.sourceFhirPath ? c.sourceFhirPath : E("span", { class: "hx-chip hx-chip--gap", text: "none" })]));
        var dq = E("td", {});
        if (notYet) dq.appendChild(E("span", { class: "hx-caption hx-faint", text: "—" }));
        else if (c.dqRules && c.dqRules.length) dq.appendChild(linkChip(c.dqStatus || "pass", "/rule/" + c.dqRules[0], c.dqStatus === "fail" ? "fail" : c.dqStatus === "warn" ? "warn" : "pass"));
        else dq.appendChild(HX.chip("gap", "No DQ rules"));
        tr.appendChild(dq);
        tr.addEventListener("click", function () { if (!notYet) HX.nav("/column/" + c.schema + "/" + t.name + "/" + c.name); });
        tr.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && !notYet) HX.nav("/column/" + c.schema + "/" + t.name + "/" + c.name); });
        tb.appendChild(tr); if (!notYet) rows.push(tr);
      });
      table.appendChild(tb); scroll.appendChild(table); wrap.appendChild(scroll);
      wireList(rows, function (r) { r.click(); });
      return wrap;
    }

    function tableQuery(t) {
      var asof = HX.asof.get();
      var asOfVal = asof.asOf || "CURRENT_TIMESTAMP";
      var asKnownVal = asof.asKnownAt || asof.asOf || "CURRENT_TIMESTAMP";
      function subst(s) {
        return String(s || "").replace(/:asKnownAt/g, "'" + asKnownVal + "'").replace(/:asOf/g, "'" + asOfVal + "'").replace(/:ontologyVersion/g, ONT_VERSION);
      }
      var wrap = E("div", { class: "dc-query" });
      wrap.appendChild(E("div", { class: "dc-pins" }, [
        HX.chip("info", "asOf = " + asOfVal), HX.chip("info", "asKnownAt = " + asKnownVal), HX.chip("neutral", "ontology " + ONT_VERSION),
        (function () { var b = E("button", { class: "hx-btn hx-btn--sm" }, [I("clock"), "Change as-of"]); b.addEventListener("click", function () { HX.asof.open(); }); return b; })()
      ]));
      wrap.appendChild(E("p", { class: "hx-caption hx-muted", text: "Templates pin the as-of control's valid time, known time and ontology version. No notebooks, no NL→SQL (brief §0) — copy a template and run it in your own tool." }));
      [["SQL", "sql"], ["SPARQL", "sparql"]].forEach(function (p) {
        var qt = E("div", { class: "hx-query-template" });
        var head = E("div", { class: "hx-query-template__head" }, [
          HX.chip("type", p[0]), E("span", { class: "hx-query-template__pin", style: "flex:1", text: "valid/known time + ontology version pinned" }),
          (function () { var b = E("button", { class: "hx-btn hx-btn--sm" }, [I("copy"), "Copy"]); b.addEventListener("click", function () { try { navigator.clipboard.writeText(subst((t.queryTemplates || {})[p[1]])); HX.toast("Copied " + p[0] + " template", { kind: "ok", timeout: 2000 }); } catch (e) { HX.toast("Copy unavailable", { kind: "warn", timeout: 2000 }); } }); return b; })()
        ]);
        qt.appendChild(head);
        qt.appendChild(E("pre", { class: "hx-mono", text: subst((t.queryTemplates || {})[p[1]] || "-- no template") }));
        wrap.appendChild(qt);
      });
      return wrap;
    }

    function tableDDL(t) {
      var wrap = E("div");
      // bitemporal contract
      wrap.appendChild(section("Bitemporal columns (TKG-01 §9 contract)", (function () {
        var w = E("div", { class: "hx-row" });
        ["valid_from", "valid_to", "recorded_at", "superseded_at", "prov_activity_iri"].forEach(function (c) { w.appendChild(HX.chip(t.bitemporal ? "ok" : "neutral", c)); });
        if (!t.bitemporal) w.appendChild(HX.chip("gap", "table is not bitemporal"));
        return w;
      })()));
      // DDL dialect toggle
      var dd = (t.ddl || {});
      var state = { dialect: "portable" };
      var head = E("div", { class: "hx-diff__header" }, [HX.chip("type", "DDL")]);
      var sw = E("div", { class: "hx-diff__switch", role: "group", "aria-label": "SQL dialect" });
      [["portable", "Portable"], ["teradata", "Teradata"]].forEach(function (p) {
        var b = E("button", { "aria-pressed": state.dialect === p[0] ? "true" : "false", text: p[1] });
        b.addEventListener("click", function () { state.dialect = p[0]; pre.textContent = dd[state.dialect] || "-- no DDL"; sw.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); });
        sw.appendChild(b);
      });
      head.appendChild(sw);
      var box = E("div", { class: "hx-diff" });
      box.appendChild(head);
      var pre = E("pre", { class: "hx-mono", style: "padding:12px;font-size:var(--fs-caption)", text: dd.portable || "-- no DDL" });
      box.appendChild(pre);
      wrap.appendChild(section("DDL", box));
      // secure views
      wrap.appendChild(section("Secure (de-identified) views", (t.secureViews && t.secureViews.length) ? E("div", { class: "hx-row" }, t.secureViews.map(function (v) { return E("span", { class: "hx-code-chip" }, [E("span", { text: v })]); })) : E("div", { class: "hx-empty", style: "text-align:left" }, ["No secure view defined — PHI columns are not analyst-readable without one."])));
      return wrap;
    }

    function tableMigrations(t) {
      if (!t.migrations || !t.migrations.length) return E("div", { class: "hx-empty" }, ["No migrations recorded for this table."]);
      var ul = E("ul", { class: "hx-prov-list" });
      t.migrations.forEach(function (mid) {
        ul.appendChild(E("li", {}, [E("span", { class: "hx-prov-list__dot" }), E("div", {}, [linkChip(mid, "/migration/" + mid, "neutral"), E("span", { class: "hx-caption hx-muted", text: " applied migration" })])]));
      });
      return ul;
    }

    function viewColumn(schema, table, col) {
      var fqn = schema + "." + table + "." + col;
      var c = IX.column[fqn];
      if (!c) return notFound("column", fqn);
      var t = tableByFqn(schema, table);
      root.appendChild(crumb([{ label: "Warehouse", route: "/edw" }, { label: schema }, { label: table, route: "/table/" + schema + "/" + table }, { label: col }]));
      var asof = HX.asof.get();
      var notYet = asof.asOf && c.existsSince && Date.parse(c.existsSince) > Date.parse(asof.asOf);

      var header = E("header", { class: "hx-object-header" });
      header.appendChild(E("div", { class: "hx-object-header__top" }, [E("div", { class: "hx-object-header__titles" }, [
        E("div", { class: "hx-object-header__label", text: c.name }), E("div", { class: "hx-object-header__id", text: c.fqn })
      ])]));
      header.appendChild(E("div", { class: "hx-object-header__chips" }, [
        HX.chip("type", "Column"), E("span", { class: "hx-code-chip" }, [E("span", { text: c.type })]),
        phiChip(c.phiClass), c.ontologyPropertyIri ? HX.chip("binding-bound", "bound") : HX.chip("gap", "Unbound"),
        (c.dqRules && c.dqRules.length) ? dqStatusChip(c.dqStatus) : HX.chip("gap", "No DQ rules")
      ]));
      root.appendChild(header);

      if (notYet) {
        root.appendChild(E("div", { class: "hx-banner hx-banner--time", role: "status", style: "border-radius:var(--r-card);margin-bottom:12px" }, [I("clock"), E("span", { text: "This column did not yet exist at " + HX.format.time(asof.asOf, "valid") + " — it was added " + HX.format.time(c.existsSince, "valid") + "." })]));
      }

      var grid = E("div", { class: "dc-detail-grid" });
      var dc = E("div", { class: "hx-card" });
      dc.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Column" })]));
      dc.appendChild(kv([
        c.description ? ["Description", c.description] : null,
        ["Type", E("span", { class: "hx-mono", text: c.type })],
        ["Exists since", E("span", { class: "hx-mono", text: HX.format.time(c.existsSince, "valid") })],
        ["Source FHIR path", c.sourceFhirPath ? E("span", { class: "hx-mono", text: c.sourceFhirPath }) : HX.chip("gap", "none")],
        ["PHI class", phiChip(c.phiClass)]
      ].filter(Boolean)));
      grid.appendChild(dc);

      // binding
      var bc = E("div", { class: "hx-card" });
      bc.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Ontology binding" })]));
      if (c.ontologyPropertyIri) {
        bc.appendChild(kv([["Property", HX.iriChip(c.ontologyPropertyIri)], ["Status", HX.chip("binding-bound", "bound")]]));
      } else {
        bc.appendChild(E("div", { class: "hx-tab--empty", style: "padding:0;margin-bottom:10px" }, [E("span", { class: "hx-chip hx-chip--gap", text: "Unbound" }), " This column is not bound to an ontology property."]));
        var bind = E("button", { class: "hx-btn hx-btn--primary hx-btn--sm" }, ["Bind to property (CR-CV-BIND)"]);
        bind.addEventListener("click", function () { crDraft("CR-CV-BIND", "bind " + c.fqn + " to an ontology property"); });
        bc.appendChild(bind);
      }
      grid.appendChild(bc);

      // DQ
      var qc = E("div", { class: "hx-card" });
      qc.appendChild(E("div", { class: "hx-card__head" }, [E("h3", { text: "Data quality" })]));
      if (c.dqRules && c.dqRules.length) {
        qc.appendChild(E("div", { class: "hx-row", style: "margin-bottom:8px" }, [E("span", { class: "hx-caption hx-muted", text: "Status" }), dqStatusChip(c.dqStatus)]));
        qc.appendChild(E("div", { class: "hx-row" }, c.dqRules.map(function (r) { return linkChip(r, "/rule/" + r, "info"); })));
      } else {
        qc.appendChild(E("div", { class: "hx-tab--empty", style: "padding:0" }, [E("span", { class: "hx-chip hx-chip--gap", text: "No DQ rules" }), " No rule targets this column — "]));
        var prop = E("button", { class: "hx-btn hx-btn--sm" }, ["Propose a DQ rule (dq_rule CR)"]);
        prop.addEventListener("click", function () { crDraft("CR-DQ-RULE", "add a DQ rule targeting " + c.fqn); });
        qc.appendChild(prop);
      }
      grid.appendChild(qc);
      root.appendChild(grid);
      root.appendChild(provFooter(["generated by prov:EDWBuild · ", agentLink("agent.schema_architect"), " · column in " + (t ? t.fqn : "") + " · Explain this"]));
    }

    function viewMigration(id) {
      root.appendChild(crumb([{ label: "Warehouse", route: "/edw" }, { label: "Migration " + id }]));
      var header = E("header", { class: "hx-object-header" });
      header.appendChild(E("div", { class: "hx-object-header__top" }, [E("div", { class: "hx-object-header__titles" }, [
        E("div", { class: "hx-object-header__label", text: "Migration " + id }), E("div", { class: "hx-object-header__id", text: id })
      ])]));
      header.appendChild(E("div", { class: "hx-object-header__chips" }, [HX.chip("type", "Migration"), HX.chip("ok", "applied")]));
      root.appendChild(header);
      var tables = D.tables.filter(function (t) { return (t.migrations || []).indexOf(id) >= 0; });
      root.appendChild(section("Tables affected", tables.length ? E("div", { class: "hx-row" }, tables.map(function (t) { return linkChip(t.fqn, "/table/" + t.schema + "/" + t.name, "neutral"); })) : E("div", { class: "hx-empty", style: "text-align:left" }, ["No tables reference this migration id."])));
      root.appendChild(E("p", { class: "hx-caption hx-muted", text: "Every forward migration carries a compensating migration (EDW-HIST contract). Schema changes are applied in a release window after a passing dry-run." }));
    }

    function viewInteropRedirect(kind, name) {
      root.appendChild(crumb([{ label: "Sources", route: "/sources" }, { label: TC(kind) + " " + (name || "") }]));
      root.appendChild(E("div", { class: "hx-empty" }, [
        I("info"), " " + TC(kind) + "s live in the interop monitor. ",
        linkChip("Open in Interop monitor", "/topics", "info")
      ]));
    }

    function notFound(kind, id) {
      root.appendChild(E("div", { class: "hx-empty" }, [
        I("warn"),
        E("div", { style: "margin-top:8px" }, [TC(kind) + " not found: ", E("span", { class: "hx-mono", text: id })]),
        E("div", { class: "hx-empty__cta" }, [linkChip("Back to " + kind + " list", "/" + (kind === "table" || kind === "column" ? "edw" : kind === "element" ? "elements" : kind === "valueset" || kind === "conceptmap" || kind === "profile" ? "valuesets" : kind === "mapspec" ? "mapspecs" : "sources"), "neutral")])
      ]));
    }

    /* ---------------------------------------------------------------- boot */
    function buildIndexes() {
      IX = { source: {}, element: {}, mapspec: {}, valueSet: {}, conceptMap: {}, profile: {}, group: {}, table: {}, column: {} };
      (D.sources || []).forEach(function (s) { IX.source[s.id] = s; });
      (D.elements || []).forEach(function (e) { IX.element[e.id] = e; });
      (D.mapspecs || []).forEach(function (m) { IX.mapspec[m.id] = m; });
      (D.valueSets || []).forEach(function (v) { IX.valueSet[v.slug] = v; });
      (D.conceptMaps || []).forEach(function (c) { IX.conceptMap[c.slug] = c; });
      (D.profiles || []).forEach(function (p) { IX.profile[p.slug] = p; });
      (D.groups || []).forEach(function (g) { IX.group[g.code] = g; });
      (D.tables || []).forEach(function (t) { IX.table[t.fqn] = t; });
      (D.columns || []).forEach(function (c) { IX.column[c.fqn] = c; });
    }

    // palette provider: elements, tables, columns, value sets, sources
    HX.palette.register(function (q) {
      if (!D || !q) return null;
      var needle = q.toLowerCase();
      var m = function (s) { return String(s || "").toLowerCase().indexOf(needle) >= 0; };
      var groups = [];
      var srcs = D.sources.filter(function (s) { return m(s.id) || m(s.label); }).slice(0, 4).map(function (s) { return { label: s.label, id: s.id, route: "/source/" + s.id, chips: [s.class] }; });
      if (srcs.length) groups.push({ group: "Sources", items: srcs });
      var cols = D.columns.filter(function (c) { return m(c.fqn); }).slice(0, 5).map(function (c) { return { label: c.name, id: c.fqn, route: "/column/" + c.schema + "/" + c.table.split(".")[1] + "/" + c.name, chips: [c.phiClass] }; });
      if (cols.length) groups.push({ group: "EDW columns", items: cols });
      var vs = D.valueSets.filter(function (v) { return m(v.slug) || m(v.label); }).slice(0, 4).map(function (v) { return { label: v.label, id: v.slug, route: "/valueset/" + v.slug, chips: [v.band] }; });
      if (vs.length) groups.push({ group: "Value sets", items: vs });
      return groups;
    });

    // re-render on as-of change (query templates + not-yet-existed placeholders)
    HX.asof.on(function () { var r0 = routeParts()[0]; if (r0 === "table" || r0 === "column") render(); });
    window.addEventListener("hashchange", render);

    HX.data.load("catalog").then(function (data) {
      D = data || {};
      D.sources = D.sources || []; D.elements = D.elements || []; D.mapspecs = D.mapspecs || [];
      D.valueSets = D.valueSets || []; D.conceptMaps = D.conceptMaps || []; D.profiles = D.profiles || [];
      D.groups = D.groups || []; D.tables = D.tables || []; D.columns = D.columns || [];
      buildIndexes();
      render();
    }).catch(function (err) {
      root.appendChild(E("div", { class: "hx-error" }, ["Could not load the catalog data. ", E("span", { class: "hx-error__corr", text: String(err && err.message) })]));
    });
  })();
  </script>
</body>
</html>
