<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HEALIX Console</title>
  <meta name="description" content="Role-aware home for the HEALIX knowledge-platform console: nine human roles, decision-first bands, synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only. All colour comes from app.css tokens.
       Home concept: a role-switcher strip, then three decision bands
       (Needs me · At risk · What changed) that reflow from multi-column
       to one column at phone width. Executive renders a one-screen grid. */
    .home-switch { display: flex; flex-direction: column; gap: var(--sp-1); flex: 1; min-width: 0; }
    .home-switch__perms { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-micro); color: var(--fg-muted); }
    .home-switch__perms .hx-chip { min-height: 18px; }

    .home-demos { margin: 0 0 var(--sp-4); border: 1px dashed var(--border-strong); border-radius: var(--r-ctl); background: var(--bg-sunken); }
    .home-demos > summary { cursor: pointer; padding: var(--sp-2) var(--sp-3); font-size: var(--fs-caption); color: var(--fg-muted); font-weight: 500; }
    .home-demos__row { display: flex; gap: var(--sp-2); flex-wrap: wrap; padding: 0 var(--sp-3) var(--sp-3); }

    .home-greet { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .home-greet h1 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: 600; text-wrap: balance; }
    .home-greet p { color: var(--fg-muted); font-size: var(--fs-dense); max-width: 68ch; }

    /* reflowing tile / queue / card grids (app.css .hx-grid is a fixed 12-col and does not stack) */
    .home-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--sp-3); }
    .home-queues { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-3); align-items: start; }
    .home-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-3); align-items: start; }
    .home-fleet { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--sp-2); }

    .home-hero { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-4); margin-bottom: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-card); background: var(--bg-surface); box-shadow: var(--shadow-raised); cursor: text; text-align: left; color: var(--fg-muted); font-size: var(--fs-lead); }
    .home-hero:hover { border-color: var(--border-strong); }
    .home-hero .hx-icon { width: 22px; height: 22px; color: var(--accent); }
    .home-hero kbd { margin-left: auto; }

    .home-mini { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); font-size: var(--fs-dense); }
    .home-mini:last-child { border-bottom: 0; }
    .home-mini__k { color: var(--fg-muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .home-mini__v { font-family: var(--font-mono); font-size: var(--fs-caption); white-space: nowrap; }
    .home-stage-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); }
    .home-stage-row:last-child { border-bottom: 0; }

    .home-slo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2); }

    .home-link { color: var(--link); text-decoration: none; font-size: var(--fs-caption); }
    .home-link:hover { text-decoration: underline; }

    /* executive one-screen */
    body[data-home="role.executive"] .hx-main { padding-bottom: var(--sp-6); }
    .exec { display: grid; gap: var(--sp-3); }
    .exec__goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: var(--sp-2); }
    .exec__mid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-3); align-items: start; }
    .exec .hx-tile--stat .hx-tile__value { font-size: var(--fs-h3); line-height: var(--lh-h3); }
    .exec__goal-spark { margin-top: 2px; }

    .sr-skip { position: absolute; left: -999px; top: 0; }
    .sr-skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 6px 10px; border-radius: var(--r-ctl); }
  </style>
</head>

    frag.appendChild(band("changed", "What changed", changed));
    return frag;
  };

  // 8 — Agent Operator
  HOMES["role.agent_operator"] = function () {
    var frag = document.createDocumentFragment();
    var ag = agents();
    var suspended = ag.filter(function (a) { var ks = Object.keys(a.kappaByType || {}); return ks.some(function (k) { return a.kappaByType[k] < 0.90; }); });
    var canaries = arr((D.ag || {}).canaries);
    var rollbacks = arr((D.ag || {}).rollbacks);
    var needs = E("div", { class: "home-queues" });
    needs.appendChild(listCard("Needs me", "agents", [
      mini("Rollbacks in 10-minute cancel window", HX.chip("pending", rollbacks.length + ""), "/agents?tab=rollbacks", "undo"),
      mini("Demotions to acknowledge", HX.chip("warn", "1"), "/agents", "warn"),
      mini("Calibration κ < 0.90 (auto-approval suspended)", HX.chip("fail", suspended.length + " agents"), "/agents?tab=calibration", "danger"),
      mini("Canary promotions", HX.chip("info", canaries.filter(function (c) { return /canary/.test(c.stage); }).length + ""), "/agents?tab=canaries", "info")
    ]));
    var ks = (D.ag || {}).killSwitch || {};
    needs.appendChild(listCard("Kill switch", "danger", [
      mini("Status", ks.active ? HX.chip("fail", "active · " + (ks.heldBy || "")) : HX.chip("ok", "idle (all scopes)"), "/agents?tab=killswitch", ks.active ? "danger" : "check")
    ]));
    frag.appendChild(band("needs", "Needs me", needs, String(suspended.length + rollbacks.length)));

    var fleet = E("div", { class: "home-fleet" });
    ag.forEach(function (a) {
      var ks2 = Object.keys(a.kappaByType || {});
      var minK = ks2.length ? Math.min.apply(null, ks2.map(function (k) { return a.kappaByType[k]; })) : null;
      var susp = minK != null && minK < 0.90;
      var card = E("div", { class: "hx-agent-card" + (susp ? " is-suspended" : ""), role: "link", tabindex: "0", "aria-label": a.id + " level " + a.level });
      var initials = a.id.replace("agent.", "").split("_").map(function (s) { return s[0]; }).join("").slice(0, 2).toUpperCase();
      var head = E("div", { class: "hx-agent-card__head" }, [E("span", { class: "hx-agent-card__avatar", text: initials }), E("div", { class: "hx-stack", style: "gap:0" }, [E("span", { class: "hx-agent-card__name", text: a.id.replace("agent.", "") }), E("span", { class: "hx-agent-card__id", text: a.id })])]);
      head.appendChild(E("span", { class: "hx-chip hx-chip--level hx-chip--neutral", title: "level " + a.level + " of ceiling " + a.ceiling }, [a.level, E("span", { class: "hx-chip__ceiling", text: "/" + a.ceiling })]));
      card.appendChild(head);
      var metrics = E("div", { class: "hx-agent-card__metrics" });
      var m = function (k, v) { return E("div", { class: "hx-agent-card__metric" }, [E("span", { class: "hx-muted", text: k }), E("b", { text: v })]); };
      metrics.appendChild(m("accept", a.acceptanceRate == null ? "—" : Math.round(a.acceptanceRate * 100) + "%"));
      metrics.appendChild(m("rollback", a.rollbackRate == null ? "—" : (a.rollbackRate * 100).toFixed(1) + "%"));
      metrics.appendChild(m("open CR", a.openCrs + "/" + a.maxOpenChangeRequests));
      metrics.appendChild(m("κ min", minK == null ? "—" : minK.toFixed(2)));
      card.appendChild(metrics);
      if (susp) card.appendChild(E("div", { class: "hx-row" }, [HX.chip("fail", "auto-approval suspended")]));
      card.addEventListener("click", nav("/agent/" + a.id)); card.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); HX.nav("/agent/" + a.id); } });
      fleet.appendChild(card);
    });
    var risk = E("div", {}); risk.appendChild(E("div", { class: "hx-card hx-card--queue" }, [E("div", { class: "hx-card__head" }, [I("agents"), E("h3", { text: "Fleet board · 20 agents" })])]));
    risk.firstChild.appendChild((function () { var w = E("div", { style: "padding:var(--sp-3)" }); w.appendChild(fleet); return w; })());
    frag.appendChild(band("risk", "At risk", risk, String(ag.length)));

    var changed = E("div", { class: "home-cols" });
    changed.appendChild(listCard("Fleet changes", "check", [
      mini("Manifest CR proposed", HX.chip("info", "agent.taxonomist 0.95→0.96"), "/cr/CR-20261017-01J9AA", "info"),
      mini("Prompt / policy versions", HX.chip("ok", "3 promoted"), "/agents", "check"),
      mini("Canary promoted", HX.chip("ok", "agent.taxonomist → 25 %"), "/agents?tab=canaries", "check")
    ]));
    frag.appendChild(band("changed", "What changed", changed));
    return frag;
  };

  // 9 — Executive sponsor (one-screen scorecard)
  HOMES["role.executive"] = function () {
    var frag = document.createDocumentFragment();
    var k = D.kp || {};
    var exec = E("div", { class: "exec" });

    var goals = E("div", { class: "exec__goals" });
    arr(k.goals).forEach(function (g) {
      var foot = [];
      if (g.companion) {
        var comp = g.companion;
        var ok = comp.mustBeZero ? comp.value === 0 : (comp.mustBe ? comp.value === comp.mustBe : true);
        foot.push(HX.chip(ok ? "ok" : "fail", comp.label + ": " + comp.value));
      }
      goals.appendChild(statTile({ label: g.id + " · " + g.short, value: g.value, unit: g.unit && g.unit.indexOf("%") === 0 ? "%" : "", target: g.target, spark: g.trend90d, foot: foot, route: g.kpi ? "/kpi/" + g.kpi : null }));
    });
    exec.appendChild(goals);

    var mid = E("div", { class: "exec__mid" });

    // group band map
    var bmCard = E("div", { class: "hx-card" });
    bmCard.appendChild(E("div", { class: "hx-card__head" }, [I("quality"), E("h3", { text: "Group band map · G1–G9" })]));
    var bm = E("div", { class: "hx-band-map" });
    scorecards().forEach(function (s) {
      var cell = E("button", { class: "hx-band-map__cell hx-band-map__cell--" + s.band.toLowerCase(), "aria-label": GROUP(s.group) + " " + s.band + " " + s.dqi + (s.certified ? ", certified" : "") });
      cell.appendChild(E("span", { class: "hx-band-map__g", text: s.group + " " + s.band }));
      cell.appendChild(E("span", { class: "hx-band-map__val", text: s.dqi }));
      cell.appendChild(E("span", { class: "hx-band-map__cert", title: s.certified ? "certified" : "not certified", text: s.certified ? "✓" : "–" }));
      cell.addEventListener("click", nav("/scorecard/" + s.group));
      bm.appendChild(cell);
    });
    bmCard.appendChild(bm);
    mid.appendChild(bmCard);

    // phase gates
    var phCard = E("div", { class: "hx-card" });
    phCard.appendChild(E("div", { class: "hx-card__head" }, [I("governance"), E("h3", { text: "Phase gate progress" })]));
    var pg = E("div", { class: "hx-phase-gates" });
    arr(k.phases).forEach(function (p) {
      var mod = p.state === "done" ? "--done" : p.state === "in_progress" ? "--active" : "";
      pg.appendChild(E("span", { class: "hx-phase-gates__gate hx-phase-gates__gate" + mod, title: (p.blocking || []).join("; ") }, [p.label.split(" · ")[0] + " · " + p.gates.met + "/" + p.gates.total]));
    });
    phCard.appendChild(pg);
    mid.appendChild(phCard);

    // decisions waiting
    var dw = k.decisionsWaiting || {};
    var dwCard = listCard("Decisions waiting on humans", "clock", [
      mini("Gates open > 7 days", HX.chip("warn", (dw.gatesOver7Days || 0) + ""), "/cr?view=high-risk-open", "warn"),
      mini("Steward queue age (p50)", HX.chip("neutral", (dw.queueAgeP50Days || 0) + " days"), "/cr", "clock"),
      mini("Oldest · " + (dw.oldest ? dw.oldest.role.replace("role.", "") : ""), dw.oldest ? HX.chip("fail", dw.oldest.ageDays + " days") : HX.chip("ok", "—"), dw.oldest ? "/cr/" + dw.oldest.cr : "/cr", "warn")
    ]);
    dwCard.appendChild(E("p", { class: "hx-caption hx-muted", style: "padding:0 var(--sp-3) var(--sp-3)", text: "Capacity is the fix, not UI: the G5 steward queue has one approver." }));
    mid.appendChild(dwCard);

    // risk register ≥ 15
    var rk = arr(k.risks);
    var rkCard = listCard("Risk register (score ≥ 15)", "warn", rk.filter(function (r) { return r.score >= 15; }).map(function (r) {
      return mini(r.label, E("span", { class: "hx-row" }, [HX.chip(r.score >= 20 ? "fail" : "warn", "score " + r.score), HX.chip("neutral", r.trend)]), "/gov", "warn");
    }), "/gov", "Full risk register");
    mid.appendChild(rkCard);

    exec.appendChild(mid);

    // DQI attribution + narrative
    var narr = E("div", { class: "hx-card" });
    narr.appendChild(E("div", { class: "hx-card__head" }, [I("info"), E("h3", { text: "What changed this week" }), HX.chip("agent-text", "agent-written", { class: "hx-chip--agent-text" })]));
    narr.appendChild(E("p", { class: "hx-dense", style: "max-width:68ch", text: k.narrative || "" }));
    var attr = E("div", { class: "hx-row", style: "margin-top:var(--sp-2)" });
    arr(k.attribution).forEach(function (a) { attr.appendChild(HX.chip(a.deltaPp <= -3 ? "fail" : "warn", GROUP(a.group) + " " + a.deltaPp + " pp · " + a.driver)); });
    narr.appendChild(attr);
    var nudge = E("div", { class: "hx-row hx-nudge", style: "margin-top:var(--sp-3)" });
    var nb = E("button", { class: "hx-btn hx-btn--sm" }, [I("bell"), "Nudge G5 steward gate"]);
    var nudgedAt = null;
    nb.addEventListener("click", function () {
      if (nudgedAt && Date.now() - nudgedAt < 7 * 86400000) { HX.toast("Nudged recently — next allowed in 4 days (rate-limited, audited).", { kind: "warn" }); return; }
      HX.confirm({ title: "Send nudge", body: "This sends a rate-limited (1 / gate / 7 days), audited nudge to the G5 steward gate owner.", confirmLabel: "Send nudge" }).then(function (ok) {
        if (!ok) return;
        nudgedAt = Date.now();
        HX.audit.write({ type: "EXEC_NUDGE", gate: "steward_approval", group: "G5", by: HX.role.principal() });
        HX.toast("Nudge sent and recorded in the audit log.", { kind: "ok" });
      });
    });
    nudge.appendChild(nb);
    nudge.appendChild(E("span", { class: "hx-caption hx-muted", text: "rate-limited · audited" }));
    narr.appendChild(nudge);
    exec.appendChild(narr);

    frag.appendChild(exec);
    return frag;
  };

  // ---- role-switcher strip ----------------------------------------------
  function buildSwitcher() {
    CLEAR(switchEl);
    var wrap = E("div", { class: "home-switch" });
    var strip = E("div", { class: "hx-row", role: "group", "aria-label": "View home as role" });
    strip.appendChild(E("span", { class: "hx-role-switcher__label", text: "Home for role" }));
    var current = HX.role.get();
    HX.role.list().forEach(function (r) {
      var chip = E("button", { class: "hx-role-chip", type: "button", "aria-pressed": r.id === current ? "true" : "false", tabindex: r.id === current ? "0" : "-1", "data-role": r.id }, [r.label]);
      chip.addEventListener("click", function () { switchRole(r.id); });
      strip.appendChild(chip);
    });
    // roving focus with arrow keys
    strip.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      var chips = Array.prototype.slice.call(strip.querySelectorAll(".hx-role-chip"));
      var idx = chips.indexOf(document.activeElement); if (idx < 0) return;
      e.preventDefault();
      var next = e.key === "ArrowRight" ? (idx + 1) % chips.length : (idx - 1 + chips.length) % chips.length;
      chips[next].focus();
    });
    wrap.appendChild(strip);

    // view-as note + verb-set invariance (AC-03)
    var note = E("div", { class: "home-switch__perms" });
    var role = HX.role.find(current);
    var principal = HX.role.find(HX.role.principal());
    if (current !== HX.role.principal()) note.appendChild(E("span", { text: "Viewing as " + (role ? role.label : current) + " — your permissions are unchanged. " }));
    note.appendChild(E("span", { text: "Your actions on a change request (from your real role, " + (principal ? principal.label : "") + "):" }));
    HX.role.verbs("cr", null).forEach(function (v) { note.appendChild(HX.chip("neutral", v.replace(/_/g, " "))); });
    wrap.appendChild(note);
    switchEl.appendChild(wrap);
  }

  function switchRole(roleId) {
    var prev = HX.role.get();
    if (roleId === prev) return;
    internalSwitch = true;
    HX.role.set(roleId); // app.js audits the View-as switch + re-renders rail + topbar note
    internalSwitch = false;
    // keep the top-bar View-as <select> in sync
    var sel = document.querySelector(".hx-viewas select"); if (sel) sel.value = roleId;
    // Executive is served by the purpose-built one-screen page, not an index home.
    if (roleId === "role.executive") { gotoExec(); return; }
    var role = HX.role.find(roleId);
    HX.toast("Home now showing: " + (role ? role.label : roleId), {
      kind: "ok",
      undo: function () { switchRole(prev); }
    });
    render(roleId, { skeleton: true });
  }

  // ---- render ------------------------------------------------------------
  function skeletonBand() {
    var s = E("div", { class: "hx-band" });
    s.appendChild(E("div", { class: "hx-band__head" }, [E("div", { class: "hx-skeleton", style: "width:160px;height:20px" })]));
    var g = E("div", { class: "home-tiles" });
    for (var i = 0; i < 3; i++) g.appendChild(E("div", { class: "hx-skeleton", style: "height:110px;border-radius:var(--r-card)" }));
    s.appendChild(g);
    return s;
  }
  function showSkeletons() { CLEAR(rootEl); for (var i = 0; i < 3; i++) rootEl.appendChild(skeletonBand()); }

  function build(roleId) {
    // The Executive home is served only by executive.html (see top of file).
    // This guard is the backstop: no path may render the inline exec home, which
    // carries home chrome and would overflow the one-screen contract.
    if (roleId === "role.executive") { gotoExec(); return; }
    CLEAR(rootEl);
    document.body.dataset.home = roleId;
    var role = HX.role.find(roleId) || { label: roleId };
    var greet = E("div", { class: "home-greet" });
    greet.appendChild(E("h1", { text: role.label }));
    greet.appendChild(E("p", { text: roleId === "role.executive" ? "Programme health in under a minute. Every tile drills into the operational page as of the report month." : "Twenty agents propose; you dispose. Needs me · At risk · What changed — grounded in synthetic data." }));
    rootEl.appendChild(greet);

    // prototype demo controls (kill switch, prod first-write)
    rootEl.appendChild(demoControls());

    var home = HOMES[roleId] || HOMES["role.ontologist"];
    rootEl.appendChild(home());
    buildSwitcher();
    HX.live("Home updated for " + role.label, "polite");
  }

  function render(roleId, opts) {
    if (!loaded) { showSkeletons(); return; }
    if (opts && opts.skeleton) { showSkeletons(); setTimeout(function () { build(roleId); }, 180); }
    else build(roleId);
  }

  function demoControls() {
    var d = E("details", { class: "home-demos" });
    d.appendChild(E("summary", { text: "Prototype demo controls" }));
    var row = E("div", { class: "home-demos__row" });
    var k = HX.killswitch.get();
    var killBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I(k && k.active ? "undo" : "danger"), k && k.active ? "Release demo kill switch" : "Trip demo kill switch"]);
    killBtn.addEventListener("click", function () {
      var cur = HX.killswitch.get();
      if (cur && cur.active) HX.killswitch.release();
      else HX.killswitch.trip({ crType: "ontology", env: "prod" }, "demo from Home");
      var nk = HX.killswitch.get();
      CLEAR(killBtn); killBtn.appendChild(I(nk && nk.active ? "undo" : "danger")); killBtn.appendChild(document.createTextNode(nk && nk.active ? "Release demo kill switch" : "Trip demo kill switch"));
    });
    row.appendChild(killBtn);

    var prodBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I("danger"), "Switch to PROD"]);
    prodBtn.addEventListener("click", function () { HX.env.set("prod"); HX.toast("Environment set to PROD. The first write action this session will ask you to confirm.", { kind: "warn" }); });
    row.appendChild(prodBtn);

    var writeBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I("review"), "Simulate first PROD write"]);
    writeBtn.addEventListener("click", function () { HX.env.confirmWrite().then(function (ok) { HX.toast(ok ? "Write confirmed." : "Write cancelled.", { kind: ok ? "ok" : "warn" }); }); });
    row.appendChild(writeBtn);

    var uatBtn = E("button", { class: "hx-btn hx-btn--sm" }, ["Back to UAT"]);
    uatBtn.addEventListener("click", function () { HX.env.set("uat"); HX.toast("Environment set to UAT.", { kind: "ok" }); });
    row.appendChild(uatBtn);
    d.appendChild(row);
    return d;
  }

  // ---- boot --------------------------------------------------------------
  showSkeletons();
  buildSwitcher();
  Promise.all(["change-requests", "agents", "dq", "kpis", "topics", "catalog", "schemes", "incidents", "concepts"].map(function (n) { return HX.data.load(n); }))
    .then(function (res) {
      D.cr = res[0]; D.ag = res[1]; D.dq = res[2]; D.kp = res[3]; D.tp = res[4]; D.cat = res[5]; D.sch = res[6]; D.inc = res[7]; D.con = res[8];
      loaded = true;
      build(HX.role.get());
    })
    .catch(function (e) { loaded = true; console.warn("Home data load issue:", e); build(HX.role.get()); });

  // re-render when the top-bar View-as <select> changes the role
  HX.role.on(function (roleId) {
    // keep chip pressed-state in sync without a full skeleton flash if triggered externally
    var chips = switchEl.querySelectorAll(".hx-role-chip");
    var synced = false;
    Array.prototype.forEach.call(chips, function (c) { var on = c.getAttribute("data-role") === roleId; c.setAttribute("aria-pressed", on ? "true" : "false"); c.setAttribute("tabindex", on ? "0" : "-1"); if (on) synced = true; });
    // External switch (top-bar View-as) to Executive → the one-screen page.
    if (!internalSwitch && roleId === "role.executive") { gotoExec(); return; }
    if (!internalSwitch && synced && document.body.dataset.home !== roleId && loaded) render(roleId, { skeleton: true });
  });
})();
  </script>
</body>
</html>
