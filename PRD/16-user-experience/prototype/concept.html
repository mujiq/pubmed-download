/* ---------------------------------------------------------------------------
   Page-local layout for the canonical concept page. All colour and type come
   from app.css design tokens — no new colours. This file only arranges the
   canonical regions (§2.4) and the per-tab panels.
   --------------------------------------------------------------------------- */
.cp-switch { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); font-size: var(--fs-caption); color: var(--fg-muted); }
.cp-switch .hx-btn { font-family: var(--font-mono); }

/* object header internals already styled by app.css; a few extras */
.cp-id-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-top: 2px; }
.cp-correction { color: var(--time-known); font-weight: 700; }
.cp-meta { display: flex; gap: var(--sp-3) var(--sp-4); flex-wrap: wrap; margin-top: var(--sp-2); font-size: var(--fs-caption); color: var(--fg-muted); }
.cp-meta b { color: var(--fg); font-weight: 600; }

/* decision / action bar inline under header */
.cp-actionbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-2) var(--sp-3); background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--sp-3); }
.cp-actionbar__note { font-size: var(--fs-micro); color: var(--fg-muted); margin-left: auto; max-width: 42ch; text-align: right; }

/* history strip (compact) */
.cp-history-strip { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3); }
.cp-history-strip__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: 4px; }
.cp-history-strip__head h2 { font-size: var(--fs-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin: 0; }

/* tab panels */
.cp-panel { min-width: 0; }
.cp-grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
@media (max-width: 900px) { .cp-grid2 { grid-template-columns: 1fr; } }

.cp-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); margin: var(--sp-2) 0; }
.cp-kv dt { color: var(--fg-muted); }
.cp-kv dd { margin: 0; min-width: 0; }

.cp-subhead { font-size: var(--fs-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); margin: var(--sp-4) 0 var(--sp-2); }
.cp-subhead:first-child { margin-top: 0; }

.cp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cp-def { font-size: var(--fs-body); line-height: var(--lh-body); max-width: 68ch; }
.cp-inherited { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-micro); color: var(--fg-muted); margin-left: 6px; }

.cp-rel { list-style: none; margin: 0; padding: 0; }
.cp-rel li { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 0; border-top: 1px solid var(--border); font-size: var(--fs-dense); flex-wrap: wrap; }
.cp-rel li:first-child { border-top: 0; }
.cp-rel__cat { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); }

.cp-mapping { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 0; border-top: 1px solid var(--border); font-size: var(--fs-dense); flex-wrap: wrap; }
.cp-mapping:first-child { border-top: 0; }

/* usage / impact stat tiles */
.cp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--sp-3); margin: var(--sp-2) 0 var(--sp-4); }
.cp-stat { border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-3); background: var(--bg-surface); }
.cp-stat b { display: block; font-size: var(--fs-h3); line-height: var(--lh-h3); font-variant-numeric: tabular-nums; }
.cp-stat span { font-size: var(--fs-micro); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .03em; }

.cp-impact-group { margin-bottom: var(--sp-4); }
.cp-impact-group h4 { font-size: var(--fs-dense); margin: 0 0 var(--sp-2); display: flex; align-items: center; gap: 6px; }
.cp-impact-group ul { list-style: none; margin: 0; padding: 0; }
.cp-impact-group li { font-family: var(--font-mono); font-size: var(--fs-caption); padding: 3px 0; border-top: 1px solid var(--border); word-break: break-all; }
.cp-impact-group li:first-child { border-top: 0; }
.cp-break-note { border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); border-radius: var(--r-ctl); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-caption); margin-top: var(--sp-2); }

/* version table (a11y alternative to timeline) */
.cp-vtable { width: 100%; border-collapse: collapse; font-size: var(--fs-caption); }
.cp-vtable th, .cp-vtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.cp-vtable th { color: var(--fg-muted); font-weight: 600; }
.cp-vtable td.cp-mono { font-family: var(--font-mono); }
.cp-vtable tr.cp-retracted td { text-decoration: line-through; color: var(--fg-faint); }

.cp-zoom { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; }
.cp-zoom button { border: 0; background: var(--bg-surface); color: var(--fg-muted); padding: 2px 10px; font-size: var(--fs-caption); min-height: 24px; }
.cp-zoom button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* changes list */
.cp-changes { list-style: none; margin: 0; padding: 0; }
.cp-changes li { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-ctl); margin-bottom: var(--sp-2); font-size: var(--fs-dense); flex-wrap: wrap; }
.cp-changes li.cp-pinned { border-left: 3px solid var(--accent); }
.cp-changes__title { flex: 1; min-width: 12ch; }
.cp-filter-note { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption); color: var(--fg-muted); margin-bottom: var(--sp-2); }

/* discussion empty handled by hx-tabpanel--empty */
.cp-compare { border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--sp-3); margin-bottom: var(--sp-4); background: var(--bg-surface); }

.cp-prov-footer a { color: var(--link); }
.cp-prov-footer .cp-mono { font-family: var(--font-mono); }

.cp-lang-chip { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--r-pill); background: var(--bg-sunken); border: 1px solid var(--border); font-size: var(--fs-micro); color: var(--fg-muted); }
</style>

<script src="assets/app.js"></script>
<script>
/* ============================================================================
   concept.html — the reference implementation of the canonical object page.
   Everything here is page-local; the shell, as-of control, palette, timeline,
   evidence, lineage, diff, trust strip, chips and keyboard map come from HX.
   ============================================================================ */
(function () {
  "use strict";
  var U = HX.util, el = U.el, icon = U.icon, clear = U.clear;
  var ctx = HX.mount({ page: "concept.html", area: "ontology", title: "Concept" });
  var MAIN = ctx.main;

  var STATE = { all: [], crs: [], traces: [], concept: null, tab: "overview", stageFilter: null, compareOpen: false, zoom: "release", previewBreaking: false };

  var CORRECTION_GLYPH = "↺";

  /* -------------------------------------------------------- data + routing */
  function routeId() {
    var h = location.hash.slice(1);
    var q = h.indexOf("?"); if (q >= 0) h = h.slice(0, q);
    var m = h.match(/^\/concept\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : "encounter-class/observation-unit";
  }
  function find(id) { for (var i = 0; i < STATE.all.length; i++) if (STATE.all[i].id === id) return STATE.all[i]; return null; }
  function prefLabel(c, lang) {
    var ls = (c.labels || []).filter(function (l) { return l.role === "pref" && (!lang || l.lang === lang); });
    if (ls.length) return ls[0].value;
    var any = (c.labels || []).filter(function (l) { return l.role === "pref"; })[0];
    return any ? any.value : c.id.split("/").pop();
  }
  function narrowerOf(id) { return STATE.all.filter(function (c) { return (c.broader || []).indexOf(id) >= 0; }); }
  function topStage(stage) { var n = 0, lab = "draft"; var names = ["Inventory", "Vocabulary", "Taxonomy", "Thesaurus", "Ontology", "Knowledge graph"]; for (var i = 0; i <= 5; i++) { var st = stage && (stage[i] || stage[String(i)]); if (st === "released") { n = i; lab = "released"; } else if (st === "review" && lab !== "review") { return { n: i, label: names[i] + " · in review" }; } } return { n: n, label: names[n] + " · released" }; }

  /* ---------------------------------------- bitemporal effective version */
  function effectiveVersion(c) {
    var s = HX.asof.get();
    var versions = c.versions || [];
    var live = versions.filter(function (v) { return v.supersededAt == null && v.validTo == null; })[0] || versions[versions.length - 1];
    if (s.mode === "Current") return { v: live, exists: true, current: true };
    var r = HX.data.asOf(versions, s.asOf, s.asKnownAt);
    if (r.current.length) {
      var v = r.current.slice().sort(function (a, b) { return Date.parse(b.recordedAt || 0) - Date.parse(a.recordedAt || 0); })[0];
      return { v: v, exists: true, current: v === live, preCorrection: v.supersededAt != null, mode: s.mode };
    }
    return { exists: false, notYet: r.notYetAsserted.length > 0, mode: s.mode };
  }

  /* chip that peeks into the inspector on Shift-click (§2.4 G) */
  function peekable(node, route, title) {
    node.addEventListener("click", function (e) { if (e.shiftKey) { e.preventDefault(); e.stopPropagation(); HX.inspector.peek(route); HX.live("Peeking " + (title || route) + " in inspector", "polite"); } });
    node.title = (node.title ? node.title + " · " : "") + "Shift-click to peek";
    return node;
  }
  function conceptLink(id, text) {
    var c = find(id);
    var label = text || (c ? prefLabel(c) : id.split("/").pop());
    var a = el("a", { href: "#/concept/" + id, class: "hx-link" }, [label]);
    a.addEventListener("click", function (e) { if (e.shiftKey) return; e.preventDefault(); HX.nav("/concept/" + id); });
    return peekable(a, "/concept/" + id, label);
  }
  function statusChip(status) {
    var map = { released: ["info", "Released"], review: ["pending", "In review"], draft: ["neutral", "Draft"], merged: ["neutral", "Merged"], deprecated: ["warn", "Deprecated"] };
    var m = map[status] || ["neutral", U.titleCase(status || "unknown")];
    return HX.chip(m[0], m[1]);
  }

  /* =============================================================== RENDER */
  function render() {
    var id = routeId();
    STATE.concept = find(id) || find("encounter-class/observation-unit");
    var c = STATE.concept;
    clear(MAIN);
    if (!c) { MAIN.appendChild(el("div", { class: "hx-empty" }, ["Concept not found. Try the command palette (Ctrl/Cmd-K)."])); return; }

    var ev = effectiveVersion(c);

    MAIN.appendChild(renderExampleSwitcher(c));
    if (c.replacedBy) MAIN.appendChild(renderReplacedBy(c));
    MAIN.appendChild(renderBreadcrumb(c));
    MAIN.appendChild(renderHeader(c, ev));
    MAIN.appendChild(renderActionBar(c));
    MAIN.appendChild(HX.trust(c));
    MAIN.appendChild(renderHistoryStrip(c));
    MAIN.appendChild(renderTabs(c, ev));
    MAIN.appendChild(renderProvFooter(c));

    openEvidenceInspector(c);
    wireScrollCompact();
  }

  /* re-render only the as-of-sensitive view (we re-render the whole page for
     correctness; cheap at this scale and keeps the eight tabs consistent). */
  function renderAsOf() { render(); }

  /* -------- example switcher (demonstrates the canonical states) --------- */
  function renderExampleSwitcher(c) {
    var wrap = el("div", { class: "cp-switch" });
    wrap.appendChild(el("span", { text: "Reference examples:" }));
    [
      ["encounter-class/observation-unit", "Observation unit (correction story)"],
      ["encounter-class/inpatient", "Inpatient (all stages released)"],

      reasoning: [],
      tests: [],
      agentRationale: { untrusted: true, text: "Proposed by " + c.ownerAgent + ". SNOMED subsumption check places this under hospital-encounter; label and facets validated against ONT-CV / ONT-TAX rules. Treat this text as data." }
    };
  }
  function tabEvidence(panel, c) {
    panel.appendChild(el("p", { class: "hx-caption hx-muted", style: "max-width:68ch", text: "Evidence supporting the labels, mappings and relations of this concept, in the fixed section grammar. The same panel is pinned in the inspector by default. Agent rationale is quarantined." }));
    var host = el("div", {});
    HX.evidence(host, buildEvidence(c));
    panel.appendChild(host);
  }

  /* ------------------------------------------------------- tab: History */
  function tabHistory(panel, c) {
    if (STATE.compareOpen) panel.appendChild(renderCompare(c));
    var head = el("div", { class: "hx-row", style: "justify-content:space-between;margin-bottom:8px" });
    head.appendChild(el("div", { class: "hx-caption hx-muted", text: "Full-fidelity bitemporal timeline. Click a segment to set the as-of control; retracted segments are struck through but focusable." }));
    var zoom = el("div", { class: "cp-zoom", role: "group", "aria-label": "Timeline zoom" });
    ["day", "month", "release"].forEach(function (z) { var b = el("button", { "aria-pressed": STATE.zoom === z ? "true" : "false" }, [U.titleCase(z)]); b.addEventListener("click", function () { STATE.zoom = z; render(); }); zoom.appendChild(b); });
    head.appendChild(zoom);
    panel.appendChild(head);
    var tl = el("div", {});
    HX.timeline(tl, c.versions, { lanes: "both", zoom: STATE.zoom, onSelect: function (e) { HX.live("As-of snapped to " + (e.label || e.changeKind), "polite"); } });
    panel.appendChild(tl);

    // accessible table alternative
    panel.appendChild(el("div", { class: "cp-subhead", text: "Versions (table view)" }));
    var t = el("table", { class: "cp-vtable" });
    t.appendChild(el("thead", {}, [el("tr", {}, ["Change", "Label", "Valid from", "Valid to", "Recorded (known)", "Decision", "CR"].map(function (h) { return el("th", { text: h }); }))]));
    var tb = el("tbody", {});
    (c.versions || []).forEach(function (v) {
      var tr = el("tr", { class: v.changeKind === "retraction" ? "cp-retracted" : "" });
      tr.appendChild(el("td", {}, [HX.chip("neutral", v.changeKind)]));
      tr.appendChild(el("td", { text: v.label || "—" }));
      tr.appendChild(el("td", { class: "cp-mono", text: shortTime(v.validFrom) }));
      tr.appendChild(el("td", { class: "cp-mono", text: v.validTo ? shortTime(v.validTo) : "—" }));
      tr.appendChild(el("td", { class: "cp-mono", text: shortTime(v.recordedAt) }));
      tr.appendChild(el("td", { class: "cp-mono", text: v.decisionTime ? shortTime(v.decisionTime) : "—" }));
      tr.appendChild(el("td", {}, [crLink(v.cr)]));
      tb.appendChild(tr);
    });
    t.appendChild(tb); panel.appendChild(t);
  }
  function renderCompare(c) {
    var box = el("div", { class: "cp-compare" });
    var vs = (c.versions || []);
    box.appendChild(el("div", { class: "hx-row", style: "justify-content:space-between" }, [el("strong", { text: "Compare versions (SKOS diff)" }), (function () { var b = el("button", { class: "hx-btn hx-btn--sm hx-btn--ghost", "aria-label": "Close compare" }, [icon("close")]); b.addEventListener("click", function () { STATE.compareOpen = false; render(); }); return b; })()]));
    if (vs.length < 2) { box.appendChild(el("p", { class: "hx-caption hx-muted", text: "Only one version — nothing to compare." })); return box; }
    var a = vs[0], b = vs[vs.length - 1];
    var host = el("div", {});
    HX.diff(host, { format: "skos", a: shortTime(a.recordedAt), b: shortTime(b.recordedAt), before: { prefLabel: a.label, broader: c.broader, changeKind: a.changeKind }, after: { prefLabel: b.label, broader: c.broader, changeKind: b.changeKind } });
    box.appendChild(host);
    return box;
  }

  /* ----------------------------------------------------- tab: Provenance */
  function tabProvenance(panel, c) {
    panel.appendChild(el("p", { class: "hx-caption hx-muted", style: "max-width:68ch", text: "PROV-O activity list: each activity used inputs (a change request) and generated this version. Newest last." }));
    var ul = el("ul", { class: "hx-prov-list" });
    (c.versions || []).forEach(function (v) {
      var li = el("li", {});
      li.appendChild(el("span", { class: "hx-prov-list__dot", "aria-hidden": "true" }));
      var body = el("div", {});
      var actLabel = ({ "new": "Created", "new-version": "New version", correction: "Corrected", retraction: "Retracted", merge: "Merged", unmerge: "Unmerged" })[v.changeKind] || U.titleCase(v.changeKind);
      body.appendChild(el("div", { class: "hx-prov-list__act" }, [actLabel + " — “" + (v.label || "") + "”"]));
      var detail = el("div", { class: "hx-caption hx-muted" });
      detail.appendChild(el("span", {}, ["prov:used "]));
      detail.appendChild(crLink(v.cr));
      detail.appendChild(el("span", {}, [" · prov:generated label · recorded " + HX.format.time(v.recordedAt, "known")]));
      if (v.decisionTime) detail.appendChild(el("span", {}, [" · decision " + HX.format.time(v.decisionTime, "known")]));
      body.appendChild(detail);
      li.appendChild(body);
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  }

  /* --------------------------------------------------------- tab: Impact */
  function tabImpact(panel, c) {
    panel.appendChild(el("p", { class: "hx-caption hx-muted", style: "max-width:68ch", text: "What depends on this concept, grouped and counted, plus the full lineage ribbon. Toggle “Preview breaking change” to see what a deprecation would break." }));
    var u = c.usage || {};
    var trace = STATE.traces.filter(function (t) { return t.concept === c.id; })[0];

    var groups = [
      ["EDW columns", "quality", u.edwColumns || []],
      ["FHIR paths", "sources", u.fhirPaths || []],
      ["DQ rules", "quality", u.dqRules || []],
      ["Topics / consumers", "sources", trace ? (trace.hops || []).filter(function (h) { return /^topic:/.test(h.object); }).map(function (h) { return h.object.replace(/^topic:/, ""); }) : []]
    ];
    var wrap = el("div", { class: "cp-grid2" });
    var left = el("div", {});
    groups.forEach(function (g) {
      var box = el("div", { class: "cp-impact-group" });
      box.appendChild(el("h4", {}, [icon(g[1]), g[0], el("span", { class: "hx-tab__badge", text: String(g[2].length) })]));
      if (g[2].length) { var ul = el("ul", {}); g[2].forEach(function (x) { ul.appendChild(el("li", { text: x })); }); box.appendChild(ul); }
      else box.appendChild(placeholderCR("No " + g[0].toLowerCase() + " target this concept", g[0] === "DQ rules" ? "dq_rule CR" : g[0] === "EDW columns" ? "binding CR" : "mapping CR", c));
      left.appendChild(box);
    });
    // SHACL shapes gap (stage 4 draft)
    var shapesBox = el("div", { class: "cp-impact-group" });
    shapesBox.appendChild(el("h4", {}, [icon("ontology"), "SHACL shapes", el("span", { class: "hx-tab__badge", text: "0" })]));
    shapesBox.appendChild(placeholderCR("No shapes bound yet — Stage 4 (Ontology) is in draft", "owl_shape CR", c));
    left.appendChild(shapesBox);

    var prev = el("label", { class: "hx-row hx-caption", style: "margin-top:4px" }, [el("input", { type: "checkbox", checked: STATE.previewBreaking }), " Preview breaking change (deprecate this concept)"]);
    prev.querySelector("input").addEventListener("change", function (e) { STATE.previewBreaking = e.target.checked; render(); });
    left.appendChild(prev);
    if (STATE.previewBreaking) {
      var n = (u.edwColumns || []).length + (u.fhirPaths || []).length + (u.dqRules || []).length;
      left.appendChild(el("div", { class: "cp-break-note" }, [icon("warn"), " Deprecating " + prefLabel(c) + " would require redirects for " + n + " dependent artefact(s) and " + HX.format.num(u.assertions || 0, 0) + " KG assertions; a replacedBy survivor and a migration CR are mandatory."]));
    }
    wrap.appendChild(left);

    // lineage ribbon
    var right = el("div", {});
    right.appendChild(el("div", { class: "cp-subhead", text: "Lineage ribbon" }));
    if (trace) {
      var host = el("div", {});
      var s = HX.asof.get();
      var usedTrace = trace;
      if (s.asOf && trace.asOfVariants) { usedTrace = applyAsOfVariant(trace, s.asOf); }
      HX.lineage(host, usedTrace, { direction: "downstream", asOf: s.asOf });
      right.appendChild(host);
    } else right.appendChild(el("div", { class: "hx-chip hx-chip--gap", text: "No lineage trace recorded" }));
    wrap.appendChild(right);
    panel.appendChild(wrap);
  }
  function applyAsOfVariant(trace, asOf) {
    var variant = (trace.asOfVariants || []).filter(function (v) { return Date.parse(asOf) < Date.parse(v.before); })[0];
    if (!variant) return trace;
    var clone = JSON.parse(JSON.stringify(trace));
    Object.keys(variant.hopOverrides || {}).forEach(function (idx) { var ov = variant.hopOverrides[idx]; if (clone.hops[idx]) Object.keys(ov).forEach(function (k) { clone.hops[idx][k] = ov[k]; }); });
    clone.label = (trace.label || trace.id) + " (as-of " + asOf + ")";
    return clone;
  }

  /* --------------------------------------------------------- tab: Changes */
  function changesFor(c) {
    var needle = c.id;
    return STATE.crs.filter(function (cr) { return JSON.stringify(cr).indexOf(needle) >= 0; });
  }
  function tabChanges(panel, c) {
    var crs = changesFor(c);
    if (STATE.stageFilter != null) {
      panel.appendChild(el("div", { class: "cp-filter-note" }, [icon("info"), "Filtered to stage " + STATE.stageFilter + " (from the stage stepper).", (function () { var b = el("button", { class: "hx-btn hx-btn--sm hx-btn--ghost" }, ["Clear"]); b.addEventListener("click", function () { STATE.stageFilter = null; render(); }); return b; })()]));
      crs = crs.filter(function (cr) { return cr.stage === STATE.stageFilter; });
    }
    if (!crs.length) { emptyPanel(panel, "No change requests at this filter.", "propose_change → vocabulary CR", c); return; }
    var open = { proposed: 1, evaluated: 1, approved: 1 };
    crs.sort(function (a, b) { return (open[b.state] ? 1 : 0) - (open[a.state] ? 1 : 0); });
    var ul = el("ul", { class: "cp-changes" });
    crs.forEach(function (cr) {
      var isOpen = !!open[cr.state];
      var li = el("li", { class: isOpen ? "cp-pinned" : "" });
      li.appendChild(HX.chip(riskKind(cr.riskClass), cr.riskClass || "—"));
      li.appendChild(HX.chip("neutral", "stage " + cr.stage));
      var a = el("a", { href: "#/cr/" + cr.id, class: "cp-changes__title hx-link" }, [cr.title]);
      a.addEventListener("click", function (e) { if (e.shiftKey) { HX.inspector.peek("/cr/" + cr.id); e.preventDefault(); return; } e.preventDefault(); HX.nav("/cr/" + cr.id); });
      li.appendChild(a);
      li.appendChild(HX.chip(stateKind(cr.state), U.titleCase(cr.state)));
      li.appendChild(el("span", { class: "hx-mono hx-caption hx-muted", text: cr.id }));
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  }
  function riskKind(r) { return r === "high" ? "warn" : r === "phi_affecting" ? "vetoed" : r === "medium" ? "info" : "neutral"; }
  function stateKind(s) { return ({ applied: "ok", approved: "info", evaluated: "pending", proposed: "pending", rejected: "danger", vetoed: "vetoed", rolled_back: "warn" })[s] || "neutral"; }

  /* ------------------------------------------------------ tab: Discussion */
  function tabDiscussion(panel, c) {
    var d = el("div", { class: "hx-tabpanel--empty" });
    d.appendChild(el("div", { class: "hx-row", style: "justify-content:center" }, [icon("info"), el("span", { text: "No discussion threads yet." })]));
    d.appendChild(el("p", { class: "hx-caption hx-muted", style: "max-width:52ch;margin:8px auto 0", text: "Comments appear here when a reviewer comments on a change request touching this concept. Raise a question by proposing a change (opens a vocabulary CR)." }));
    var b = el("button", { class: "hx-btn hx-btn--sm", style: "margin-top:10px" }, ["Propose change — vocabulary CR"]);
    b.addEventListener("click", function () { runVerb("propose_change", c); });
    d.appendChild(b);
    panel.appendChild(d);
  }

  /* --------------------------------------------------------- tab: Usage */
  function tabUsage(panel, c) {
    var u = c.usage || {};
    var stats = el("div", { class: "cp-stats" });
    stats.appendChild(statTile(HX.format.num(u.assertions || 0, 0), "KG assertions"));
    stats.appendChild(statTile(String((u.edwColumns || []).length), "EDW columns"));
    stats.appendChild(statTile(String((u.fhirPaths || []).length), "FHIR paths"));
    stats.appendChild(statTile(String((u.dqRules || []).length), "DQ rules"));
    panel.appendChild(stats);
    panel.appendChild(el("p", { class: "hx-caption hx-muted", style: "max-width:68ch", text: "Where this concept is used across the knowledge graph, the EDW and the streaming canonical model. Counts are denominators you can click through on the Impact tab." }));
    [["EDW columns", u.edwColumns], ["FHIR paths", u.fhirPaths], ["DQ rules", u.dqRules]].forEach(function (g) {
      panel.appendChild(el("div", { class: "cp-subhead", text: g[0] }));
      if ((g[1] || []).length) { var ul = el("ul", { class: "cp-rel" }); g[1].forEach(function (x) { ul.appendChild(el("li", {}, [el("span", { class: "hx-mono hx-caption", text: x })])); }); panel.appendChild(ul); }
      else panel.appendChild(el("div", { class: "hx-chip hx-chip--gap", text: "none" }));
    });
  }
  function statTile(n, label) { return el("div", { class: "cp-stat" }, [el("b", { text: n }), el("span", { text: label })]); }

  /* ----------------------------------------------------- tab: Collisions */
  function collisionsFor(c) {
    // collisions live in schemes.json; only the encounter-class ones are seeded
    // here inline for this reference page via the concept's own flagged set.
    var SEEDED = [
      { id: "COL-4", kind: "near-duplicate definition", a: "encounter-class/observation-unit", b: "encounter-class/observation-stay", similarity: 0.87, state: "open" },
      { id: "COL-2", kind: "prefLabel equals altLabel", a: "encounter-class/ed", b: "encounter-class/emergency", similarity: 1.0, state: "resolved", resolution: "merged 2026-08-22" }
    ];
    return SEEDED.filter(function (x) { return x.a === c.id || x.b === c.id; });
  }
  function tabCollisions(panel, c) {
    collisionsFor(c).forEach(function (col) {
      var box = el("div", { class: "hx-collisions__item" });
      box.appendChild(icon("warn"));
      var body = el("div", {});
      body.appendChild(el("div", {}, [el("strong", { text: col.id + " · " + col.kind }), " ", HX.chip(col.state === "open" ? "warn" : "ok", col.state)]));
      body.appendChild(el("div", { class: "hx-caption" }, [conceptLink(col.a), " ↔ ", conceptLink(col.b), " · similarity " + col.similarity + (col.resolution ? " · " + col.resolution : "")]));
      box.appendChild(body);
      var b = el("button", { class: "hx-btn hx-btn--sm", style: "margin-left:auto" }, ["Open merge view"]);
      b.addEventListener("click", function () { HX.nav("/scheme/" + c.scheme); });
      box.appendChild(b);
      panel.appendChild(box);
    });
  }

  /* ---------------------------------------------- H. provenance footer */
  function renderProvFooter(c) {
    var v = (c.versions || []).filter(function (x) { return x.supersededAt == null; })[0] || (c.versions || [])[ (c.versions||[]).length - 1 ];
    var f = el("footer", { class: "hx-prov-footer cp-prov-footer" });
    f.appendChild(el("span", {}, ["generated by "]));
    f.appendChild(el("span", { class: "cp-mono", text: "prov:cr-apply" }));
    f.appendChild(el("span", {}, [" · run "]));
    f.appendChild(el("span", { class: "cp-mono", text: "run_01JA0R1" }));
    f.appendChild(el("span", {}, [" · " ]));
    var oa = el("a", { href: "#/agent/" + c.ownerAgent, class: "cp-mono" }, [c.ownerAgent]); oa.addEventListener("click", function (e) { e.preventDefault(); HX.nav("/agent/" + c.ownerAgent); }); f.appendChild(oa);
    f.appendChild(el("span", {}, [" · "]));
    f.appendChild(crLink(v && v.cr));
    f.appendChild(el("span", {}, [" · "]));
    f.appendChild(el("span", { class: "hx-version-chip", text: c.release }));
    f.appendChild(el("span", {}, [" · "]));
    var ex = el("button", { class: "hx-btn hx-btn--sm hx-btn--ghost" }, ["Explain this"]);
    ex.addEventListener("click", function () { HX.inspector.open(el("div", { class: "hx-card" }, [el("h3", { text: "How this page was produced" }), el("p", { class: "hx-caption", text: "The current version of " + prefLabel(c) + " was generated when change request " + (v && v.cr || "—") + " was applied by " + c.ownerAgent + " and released in " + c.release + ". Valid time, known time and the decision time are all recorded; see the History and Provenance tabs." })]), "Explain this"); });
    f.appendChild(ex);
    return f;
  }

  /* --------------------------------------------- inspector: Evidence pane */
  function openEvidenceInspector(c) {
    var host = el("div", {});
    HX.evidence(host, buildEvidence(c));
    HX.inspector.open(host, "Evidence — " + prefLabel(c));
  }

  /* ------------------------------------------------------------- helpers */
  function copy(t) { try { navigator.clipboard.writeText(t); HX.toast("Copied " + t, { kind: "ok", timeout: 2000 }); } catch (e) { HX.toast("Copy unavailable in this view", { kind: "warn", timeout: 2500 }); } }
  function shortTime(iso) { if (!iso) return "—"; return String(iso).replace("T", " ").replace(":00.000Z", "Z").replace(/:\d\dZ$/, "Z").replace("Z", "Z"); }

  var compactWired = false;
  function wireScrollCompact() {
    if (compactWired) return; compactWired = true;
    window.addEventListener("scroll", function () { var h = document.getElementById("cp-header"); if (h) h.classList.toggle("is-compact", window.scrollY > 120); }, { passive: true });
  }

  /* ------------------------------------------------------------- keys (§8) */
  function bindKeys() {
    HX.keys.bind({
      "e": function () { selectTab("evidence"); return true; },
      "h": function () { selectTab("history"); return true; },
      "p": function () { selectTab("provenance"); return true; },
      "i": function () { selectTab("impact"); return true; },
      "c": function () { STATE.tab = "history"; STATE.compareOpen = true; render(); return true; },
      "y": function () { if (STATE.concept) copy(STATE.concept.iri); return true; },
      "1": tabKey(0), "2": tabKey(1), "3": tabKey(2), "4": tabKey(3), "5": tabKey(4), "6": tabKey(5), "7": tabKey(6), "8": tabKey(7)
    });
  }
  function tabKey(i) { return function () { if (CANON[i]) selectTab(CANON[i].id); return true; }; }

  /* --------------------------------------------------------------- boot */
  Promise.all([HX.data.load("concepts"), HX.data.load("change-requests"), HX.data.load("lineage")]).then(function (res) {
    STATE.all = (res[0] && res[0].concepts) || [];
    STATE.crs = (res[1] && res[1].changeRequests) || [];
    STATE.traces = (res[2] && res[2].traces) || [];
    render();
    bindKeys();
    HX.asof.on(function () { renderAsOf(); });
    HX.role.on(function () { render(); });   // proves verbs do NOT change with View-as
    window.addEventListener("hashchange", function () {
      var id = routeId();
      if (!STATE.concept || id !== STATE.concept.id) { STATE.tab = "overview"; STATE.stageFilter = null; STATE.compareOpen = false; render(); }
    });
  });
})();
</script>
</body>
