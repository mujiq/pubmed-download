<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HEALIX Executive</title>
  <meta name="description" content="Executive sponsor home for the HEALIX knowledge platform: programme health in under a minute with drill-down to KPIs, scorecard attribution and read-only change requests. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only. All colour comes from app.css tokens.
       The home is a one-screen grid (six goal tiles · group band map ·
       phase gates · decisions waiting · risk register · attribution).
       It reflows from multi-column to one column at phone width with no
       horizontal scroll at 390px. */
    .exec { display: grid; gap: var(--sp-3); }
    .exec__intro { display: flex; align-items: baseline; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; }
    .exec__intro h1 { font-size: var(--fs-h2); line-height: var(--lh-h2); }
    .exec__intro p { color: var(--fg-muted); font-size: var(--fs-dense); margin: 0; }
    .exec__intro-actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }

    .exec__goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: var(--sp-2); }
    .exec__mid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-3); align-items: start; }

    /* goal tile as an actionable button */
    .exec-goal { text-align: left; cursor: pointer; }
    .exec-goal:hover { border-color: var(--border-strong); }
    .exec-goal__top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
    .exec-goal__id { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-faint); }
    .exec-goal__label { font-size: var(--fs-caption); color: var(--fg-muted); min-height: 2.4em; }
    .exec-goal__value { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 600; font-variant-numeric: tabular-nums; }
    .exec-goal__value small { font-size: var(--fs-caption); font-weight: 400; color: var(--fg-muted); }
    .exec-goal__target { font-size: var(--fs-micro); color: var(--fg-muted); font-family: var(--font-mono); }
    .exec-goal__spark { height: 24px; margin: 2px 0; }
    .exec-goal__companion { font-size: var(--fs-micro); color: var(--fg-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .exec-goal__companion.is-ok b { color: var(--ok-fg); }
    .exec-goal__companion.is-bad b { color: var(--danger-fg); }

    .exec-panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-raised); padding: var(--sp-3) var(--sp-4); min-width: 0; }
    .exec-panel > h2 { font-size: var(--fs-dense); font-weight: 600; display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
    .exec-panel__sub { font-size: var(--fs-caption); color: var(--fg-muted); margin-bottom: var(--sp-2); }

    .exec-kv { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: 5px 0; border-bottom: 1px solid var(--border); font-size: var(--fs-dense); }
    .exec-kv:last-child { border-bottom: 0; }
    .exec-kv__k { color: var(--fg-muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .exec-kv__v { font-family: var(--font-mono); font-size: var(--fs-caption); white-space: nowrap; }

    .exec-risk { display: flex; align-items: center; gap: var(--sp-2); padding: 5px 0; border-bottom: 1px solid var(--border); font-size: var(--fs-caption); }
    .exec-risk:last-child { border-bottom: 0; }
    .exec-risk__score { font-family: var(--font-mono); font-weight: 600; min-width: 2.4em; text-align: center; padding: 1px 4px; border-radius: var(--r-ctl); }
    .exec-risk__score--hi { background: var(--danger-bg); color: var(--danger-fg); }
    .exec-risk__score--md { background: var(--warn-bg); color: var(--warn-fg); }
    .exec-risk__main { flex: 1; min-width: 0; }
    .exec-risk__main b { font-weight: 600; }
    .exec-risk__main span { color: var(--fg-muted); display: block; }
    .exec-trend { font-size: 10px; }
    .exec-trend--worsening { color: var(--danger-fg); }
    .exec-trend--improving { color: var(--ok-fg); }
    .exec-trend--stable { color: var(--fg-muted); }

    /* attribution heat (DQI by group × month) */
    .exec-heat { width: 100%; border-collapse: collapse; font-size: var(--fs-caption); }
    .exec-heat th, .exec-heat td { border: 1px solid var(--border); padding: 3px 6px; text-align: center; font-family: var(--font-mono); }
    .exec-heat th { background: var(--bg-sunken); color: var(--fg-muted); font-weight: 500; }
    .exec-heat th[scope="row"] { text-align: left; }
    .exec-heat td.is-green { background: var(--ok-bg); color: var(--ok-fg); }
    .exec-heat td.is-amber { background: var(--warn-bg); color: var(--warn-fg); }
    .exec-heat td.is-red { background: var(--danger-bg); color: var(--danger-fg); }
    .exec-heat td.is-black { background: var(--black-band-bg); color: var(--black-band-fg); }

    .exec-narr { font-size: var(--fs-dense); line-height: var(--lh-dense); border-left: 3px solid var(--accent); padding-left: var(--sp-3); }

    .exec-nudge-note { font-size: var(--fs-micro); color: var(--fg-muted); }

    /* KPI / CR drill views (not one-screen constrained) */
    .exec-back { margin-bottom: var(--sp-3); }
    .exec-kpi__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-3); align-items: start; }
    .exec-bygroup__row { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: var(--sp-2); width: 100%; text-align: left; padding: 4px var(--sp-2); border: 1px solid transparent; border-radius: var(--r-ctl); font-size: var(--fs-dense); background: transparent; cursor: pointer; }
    .exec-bygroup__row:hover { background: var(--bg-sunken); }
    .exec-bygroup__row[aria-expanded="true"] { border-color: var(--border); background: var(--bg-sunken); }
    .exec-bygroup__bar { height: 10px; border-radius: var(--r-pill); background: var(--border); overflow: hidden; }
    .exec-bygroup__bar i { display: block; height: 100%; background: var(--accent); }
    .exec-bygroup__v { font-family: var(--font-mono); font-size: var(--fs-caption); min-width: 3.2em; text-align: right; }
    .exec-slider { width: 100%; }
    .exec-month { font-family: var(--font-mono); font-weight: 600; }
    .exec-readonly { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-micro); color: var(--fg-muted); border: 1px dashed var(--border-strong); border-radius: var(--r-pill); padding: 1px 8px; }

    /* the exec home is a single screen: trim the tall default bottom padding */
    body[data-exec-view="home"] .hx-main { padding-top: var(--sp-3); padding-bottom: var(--sp-6); }

    @media print {
      .hx-rail, .hx-inspector, .hx-topbar, .hx-banner--synthetic, .exec__intro-actions, .exec-nudge-note { display: none !important; }
      .exec-panel { break-inside: avoid; }
    }

    .sr-skip { position: absolute; left: -999px; top: 0; }
    .sr-skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 6px 10px; border-radius: var(--r-ctl); }
  </style>
</head>

  <script>
  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, GROUP = HX.util.groupName, titleCase = HX.util.titleCase;
    var TODAY = Date.now();

    HX.mount({ page: "executive", title: "HEALIX Executive", area: "gov" });

    var root = document.getElementById("exec-root");
    var DATA = {};             // kpis bundle
    var SCORES = [];           // dq scorecards (for band map)
    var nudgeCooldown = {};    // gate -> ISO nextAllowed (in-memory, this session)

    /* ---------- helpers ---------- */
    function bandOf(dqi) { return dqi >= 99.0 ? "Green" : dqi >= 97.0 ? "Amber" : dqi >= 95.0 ? "Red" : "Black"; }
    function bandKind(b) { return "band-" + String(b).toLowerCase(); }
    function bandGlyph(b) { return ({ Green: "✓", Amber: "△", Red: "⬣", Black: "■" })[b] || "–"; }
    function bandChip(b, text) { return HX.chip(bandKind(b), text, { glyph: bandGlyph(b) }); }
    function kpiBySlug(slug) { return (DATA.kpis || []).filter(function (k) { return k.slug === slug; })[0]; }
    function fmtMonth(m) {
      if (!m) return "";
      var parts = String(m).split("-");
      var names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return (names[(+parts[1]) - 1] || parts[1]) + " " + parts[0];
    }
    function relDays(iso) {
      var d = (Date.parse(iso) - TODAY) / 86400000;
      var a = Math.abs(Math.round(d));
      return a + " day" + (a === 1 ? "" : "s") + (d < 0 ? " ago" : "");
    }

    /* intra-page navigation preserving as-of */
    function go(route) {
      var a = HX.asof.get(); var q = [];
      if (a.asOf) q.push("asOf=" + encodeURIComponent(a.asOf));
      if (a.asKnownAt) q.push("asKnownAt=" + encodeURIComponent(a.asKnownAt));
      location.hash = route + (q.length ? "?" + q.join("&") : "");
    }
    function shareView() {
      var url = location.origin && location.origin !== "null"
        ? location.href
        : (location.pathname.split("/").pop() + location.hash);
      try { navigator.clipboard.writeText(url); HX.toast("Link copied — opens this view at the same as-of.", { kind: "ok", timeout: 3000 }); }

    function nudgeInfo(gate) {
      var rec = (DATA.nudges || []).filter(function (n) { return n.gate === gate; })[0];
      var next = nudgeCooldown[gate] || (rec && rec.nextAllowedAt) || null;
      var last = nudgeCooldown[gate] ? null : (rec && rec.lastAt) || null;
      var cooling = next && Date.parse(next) > TODAY;
      return { next: next, last: last, cooling: cooling };
    }
    function nudgeButton(gate, role) {
      var info = nudgeInfo(gate);
      var wrap = E("div", { class: "hx-row hx-nudge", style: "margin-top:var(--sp-2)" });
      var btn = E("button", {
        class: "hx-btn hx-btn--sm" + (info.cooling ? "" : " hx-btn--primary"),
        title: info.cooling ? "Rate-limited: next nudge allowed " + HX.format.time(info.next, "known") : "Send one nudge to the " + titleCase(gate) + " gate owner"
      }, [I("bell"), "Nudge gate owner"]);
      if (info.cooling) btn.setAttribute("aria-disabled", "true");
      btn.addEventListener("click", function () { doNudge(gate, role, wrap); });
      wrap.appendChild(btn);
      var note = E("span", { class: "exec-nudge-note" });
      if (info.cooling) note.textContent = (info.last ? "Nudged " + relDays(info.last) + " — " : "") + "next allowed in " + relDays(info.next).replace(" ago", "") + " · rate-limited (1 / gate / 7 days) · audited";
      else note.textContent = "1 nudge per gate per 7 days · audited";

      return wrap;
    }
    function doNudge(gate, role, wrap) {
      var info = nudgeInfo(gate);
      HX.confirm({
        title: "Send nudge to " + titleCase(gate),
        body: "This sends one rate-limited (1 / gate / 7 days), audited nudge to the owner of the " + titleCase(gate) + " gate (" + (role || "gate owner") + "). Capacity is the real fix — a nudge only flags the backlog.",
        consequence: info.cooling ? "Rate-limited: a nudge was already sent. Next nudge is allowed " + HX.format.time(info.next, "known") + ". This attempt will be logged but not delivered." : null,
        confirmLabel: info.cooling ? "Log attempt" : "Send nudge"
      }).then(function (ok) {
        if (!ok) return;
        HX.audit.write({ type: "EXEC_NUDGE", gate: gate, role: role || null, principal: HX.role.principal(), blocked: !!info.cooling, nextAllowedAt: info.next, at: new Date().toISOString() });
        if (info.cooling) {
          HX.toast("Rate-limited — next nudge allowed " + HX.format.time(info.next, "known") + ". Attempt logged to audit.", { kind: "warn" });
        } else {
          var next = new Date(TODAY + 7 * 86400000).toISOString();
          nudgeCooldown[gate] = next;
          HX.toast("Nudge sent to " + titleCase(gate) + " owner — logged to audit. Next allowed " + HX.format.time(next, "known") + ".", { kind: "ok" });
          if (wrap && wrap.parentNode) wrap.parentNode.replaceChild(nudgeButton(gate, role), wrap);

        HX.live("Nudge recorded for " + titleCase(gate) + " gate.", "polite");
      });
    }

      root.appendChild(grid);
      root.appendChild(provFooter("kpi/" + k.slug, k.lineage && k.lineage[0]));
      HX.live("KPI " + k.label + " loaded. " + k.value + " " + (k.unit || "") + " against target " + k.target + ".", "polite");
    }

    /* gate backlog read-only panel (reached from a below-target group) */
    function toggleGateBacklog(k, rowBtn) {
      var host = document.getElementById("kpi-gate-backlog"); if (!host) return;
      var open = host.getAttribute("data-open") === "1";
      if (open) { HX.util.clear(host); host.removeAttribute("data-open"); if (rowBtn) rowBtn.setAttribute("aria-expanded", "false"); return; }
      HX.util.clear(host); host.setAttribute("data-open", "1"); if (rowBtn) rowBtn.setAttribute("aria-expanded", "true");
      var d = k.drill, dw = DATA.decisionsWaiting || {};
      var panel = E("section", { class: "exec-panel", style: "background:var(--bg-sunken)", "aria-label": "Gate backlog for " + GROUP(d.group) });
      panel.appendChild(E("h2", {}, [I("inbox"), GROUP(d.group) + " gate backlog ", E("span", { class: "exec-readonly" }, [I("lock"), "read-only"])]));
      panel.appendChild(E("div", { class: "exec-panel__sub", text: d.unbound + " unbound attributes in " + GROUP(d.group) + "; " + (dw.byGate[d.gate] || "?") + " at the " + titleCase(d.gate) + " gate (" + (d.gateRole || "") + "), median wait " + dw.queueAgeP50Days + " days." }));
      var kv = E("div", {});
      kv.appendChild(kvRow("Gate", titleCase(d.gate), "neutral"));
      kv.appendChild(kvRow("Owner role", d.gateRole || "—", "neutral"));
      kv.appendChild(kvRow("CRs waiting", String(dw.byGate[d.gate] || "?"), "warn"));
      kv.appendChild(kvRow("Oldest CR age", (dw.oldest && dw.oldest.ageDays) + " days", dw.oldest && dw.oldest.ageDays > 7 ? "danger" : "neutral"));
      panel.appendChild(kv);
      if (dw.oldest) {
        var a = E("a", { href: "#/exec-cr/" + dw.oldest.cr, class: "hx-mono hx-caption", style: "display:inline-block;margin-top:var(--sp-2)" }, ["Open oldest: " + dw.oldest.cr + " (read-only)"]);
        a.addEventListener("click", function (e) { e.preventDefault(); go("/exec-cr/" + dw.oldest.cr); });
        panel.appendChild(a);
      }
      panel.appendChild(E("p", { class: "exec-panel__sub", style: "margin-top:var(--sp-2)", text: dw.note || "Capacity is the fix, not UI." }));
      panel.appendChild(nudgeButton(d.gate, d.gateRole));
      host.appendChild(panel);
      panel.scrollIntoView({ block: "nearest" });
    }

    /* =================================================================== READ-ONLY CR */
    function renderCr(id) {
      HX.util.clear(root);
      root.classList.remove("exec-home");
      document.body.setAttribute("data-exec-view", "cr");
      root.appendChild(backBar());
      HX.data.load("execcr").then(function (d) {
        var cr = (d.changeRequests || []).filter(function (c) { return c.id === id; })[0];
        if (!cr) {
          var full = E("div", { class: "hx-empty" }, [I("warn"), " " + id + " is not summarised at executive depth. "]);
          var open = E("button", { class: "hx-btn hx-btn--sm", style: "margin-left:var(--sp-2)" }, ["Open full CR in Review"]);
          open.addEventListener("click", function () { HX.nav("/cr/" + id); });
          full.appendChild(open);
          root.appendChild(full); return;
        }
        var crumb = E("nav", { class: "hx-breadcrumb", "aria-label": "Breadcrumb" }, [
          (function () { var a = E("a", { href: "#/w/exec", text: "Executive" }); a.addEventListener("click", function (e) { e.preventDefault(); go("/w/exec"); }); return a; })(),
          E("span", { class: "hx-breadcrumb__sep", text: "›" }), E("span", { text: "Decisions waiting" }),
          E("span", { class: "hx-breadcrumb__sep", text: "›" }), E("span", { text: cr.id })
        ]);
        root.appendChild(crumb);

        var header = E("header", { class: "hx-object-header" });
        var titles = E("div", { class: "hx-object-header__titles" });
        titles.appendChild(E("div", { class: "hx-object-header__label", text: cr.title }));
        titles.appendChild(E("div", { class: "hx-object-header__id", text: cr.id + " · " + (cr.subtype || cr.type) }));
        var chips = E("div", { class: "hx-object-header__chips" });
        chips.appendChild(HX.chip(cr.riskClass === "phi_affecting" ? "vetoed" : cr.riskClass === "high" ? "warn" : "info", "risk: " + cr.riskClass));
        chips.appendChild(HX.groupChip(cr.group));
        chips.appendChild(HX.chip("pending", titleCase(cr.state)));
        chips.appendChild(E("span", { class: "exec-readonly" }, [I("lock"), "read-only · executive depth"]));
        titles.appendChild(chips);
        header.appendChild(E("div", { class: "hx-object-header__top" }, [titles]));
        root.appendChild(header);

        var grid = E("div", { class: "exec-kpi__grid" });
        var left = E("section", { class: "exec-panel", "aria-label": "Summary and decision trail" });
        left.appendChild(E("h2", {}, [I("review"), "Summary"]));
        left.appendChild(E("p", { text: cr.summary || "—" }));
        left.appendChild(E("h2", { style: "margin-top:var(--sp-3)" }, [I("governance"), "Who approved"]));
        var tr = E("div", {});
        (cr.approvals || []).forEach(function (ap) { tr.appendChild(kvRow(titleCase(ap.gate), titleCase(ap.decision) + " · " + ap.by, ap.decision === "approve" ? "ok" : "warn")); });
        tr.appendChild(kvRow("Awaiting", titleCase(cr.gate) + " (" + (cr.role || "") + ")", "pending"));
        tr.appendChild(kvRow("Evaluator score", (cr.evaluation ? cr.evaluation.aggregateScore + " · κ " + cr.evaluation.kappaForType : "—"), "neutral"));
        tr.appendChild(kvRow("Age", cr.ageDays + " days in queue", cr.ageDays > 7 ? "danger" : "neutral"));
        left.appendChild(tr);
        grid.appendChild(left);

        var right = E("section", { class: "exec-panel", "aria-label": "Impact" });
        right.appendChild(E("h2", {}, [I("lineage"), "Impact"]));
        right.appendChild(kvRow("Breaking change", cr.impact && cr.impact.breaking ? "yes" : "no", cr.impact && cr.impact.breaking ? "danger" : "ok"));
        (cr.impact && cr.impact.edwColumns || []).forEach(function (c) { right.appendChild(E("div", { class: "exec-kv" }, [E("span", { class: "exec-kv__k", text: "EDW column" }), E("span", { class: "exec-kv__v hx-mono", text: c })])); });
        (cr.impact && cr.impact.dqRules || []).forEach(function (c) { right.appendChild(E("div", { class: "exec-kv" }, [E("span", { class: "exec-kv__k", text: "DQ rule" }), E("span", { class: "exec-kv__v hx-mono", text: c })])); });
        if (cr.impact && cr.impact.kpi) {
          var a = E("a", { href: "#/kpi/" + cr.impact.kpi, class: "hx-caption" }, ["Contributes to KPI: " + cr.impact.kpi]);
          a.addEventListener("click", function (e) { e.preventDefault(); go("/kpi/" + cr.impact.kpi); });
          right.appendChild(E("div", { style: "margin-top:var(--sp-2)" }, [a]));
        }
        right.appendChild(E("div", { class: "exec-panel__sub", style: "margin-top:var(--sp-3)" }, [
          "Executives read decisions; they do not dispose them. ",
          (function () { var b = E("button", { class: "hx-btn hx-btn--sm" }, ["Open full CR in Review"]); b.addEventListener("click", function () { HX.nav("/cr/" + cr.id); }); return b; })()
        ]));
        grid.appendChild(right);
        root.appendChild(grid);
        root.appendChild(provFooter("cr/" + cr.id, "edw_g9_governance.fact_change_request"));
        HX.live("Change request " + cr.id + " shown read-only at executive depth.", "polite");
      });
    }

    /* ---------- shared bits ---------- */
    function backBar() {
      var bar = E("div", { class: "exec-back" });
      var b = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost" }, [I("home"), "Executive home"]);
      b.addEventListener("click", function () { go("/w/exec"); });
      bar.appendChild(b);
      return bar;
    }
    function provFooter(obj, table) {
      return E("div", { class: "hx-prov-footer" }, [
        "generated by prov:Activity report-render · run run_exec_" + (DATA.reportMonth || "") + " · agent.release_manager · release reporting v2026.10 · source " + (table || "edw_g9_governance") + " · masked API only · Explain this"
      ]);
    }

    /* ---------- router ---------- */
    function currentRoute() {
      var h = location.hash.slice(1);
      var qi = h.indexOf("?");
      var route = qi < 0 ? h : h.slice(0, qi);
      var params = {};
      if (qi >= 0) h.slice(qi + 1).split("&").forEach(function (p) { var kv = p.split("="); if (kv[0]) params[kv[0]] = decodeURIComponent(kv[1] || ""); });
      return { route: route || "/", params: params };
    }
    function route() {
      var r = currentRoute().route;
      var m;
      if ((m = r.match(/^\/kpi\/([^/?]+)/))) { renderKpi(m[1], currentRoute().params); return; }
      if ((m = r.match(/^\/exec-cr\/([^/?]+)/))) { renderCr(m[1]); return; }
      renderHome();
    }

    /* palette provider: KPIs & goals (find mode) */
    HX.palette.register(function (q) {
      if (!DATA.kpis) return null;
      var needle = String(q || "").toLowerCase();
      var items = (DATA.kpis || []).filter(function (k) { return !needle || k.label.toLowerCase().indexOf(needle) >= 0 || k.slug.indexOf(needle) >= 0; })
        .slice(0, 6).map(function (k) { return { label: k.label, id: k.slug, route: "/kpi/" + k.slug, chips: [k.band, k.value + (k.unit === "%" ? "%" : "")] }; });
      if (!items.length) return null;
      return { group: "KPIs", items: items };
    });

    /* re-render time-sensitive views when the as-of control changes */
    HX.asof.on(function () {
      var r = currentRoute().route;
      if (r.indexOf("/kpi/") === 0) { /* history slider + banner already reflect; no full re-render needed */ }
    });

    /* boot */
    Promise.all([HX.data.load("kpis"), HX.data.load("dq")]).then(function (res) {
      DATA = res[0] || {};
      SCORES = (res[1] && res[1].scorecards) || [];
      route();
      window.addEventListener("hashchange", route);
    });
  })();
  </script>
</body>
</html>
