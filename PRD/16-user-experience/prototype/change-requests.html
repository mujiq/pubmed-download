<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HEALIX Console — Review</title>
  <meta name="description" content="Decision-first change-request review: queue, diff, evidence, evaluator and privacy verdicts, gates and releases — synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* Page-local layout only. All colour comes from app.css tokens.
       Review concept: a two-pane review surface — a 340px queue list pane
       and a wide CR detail pane (ObjectHeader · verdict strip · gates ·
       diff · evidence inspector · sticky DecisionBar). At <1024px the panes
       stack to one column and a back control returns to the queue. */

    .cr-page { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }

    /* top segmented control + batch affordance */
    .cr-viewbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .cr-seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; }
    .cr-seg button { border: 0; background: var(--bg-surface); color: var(--fg-muted); padding: 6px 14px; font: inherit; font-size: var(--fs-dense); min-height: 32px; cursor: pointer; }
    .cr-seg button + button { border-left: 1px solid var(--border); }
    .cr-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .cr-viewbar__spacer { flex: 1; }

    /* split */
    .cr-split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
    .cr-list { min-width: 0; position: sticky; top: calc(var(--topbar-h) + 4px); }
    .cr-detail { min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - var(--topbar-h) - 8px); }

    /* queue toolbar */
    .cr-queue-head { display: flex; flex-direction: column; gap: var(--sp-2); }
    .cr-savedviews { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cr-savedviews select { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-surface); color: var(--fg); font: inherit; font-size: var(--fs-caption); padding: 0 6px; }
    .cr-queue-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-micro); color: var(--fg-muted); padding: 0 var(--sp-1); }
    .cr-queue { max-height: calc(100vh - var(--topbar-h) - 190px); overflow: auto; border-top: 1px solid var(--border); }

    /* queue row */
    .cr-row { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-2); width: 100%; text-align: left; padding: var(--sp-3); border: 0; border-bottom: 1px solid var(--border); background: var(--bg-surface); cursor: pointer; color: inherit; font: inherit; }
    .cr-row:hover { background: var(--bg-sunken); }
    .cr-row[aria-current="true"] { background: var(--info-bg); box-shadow: inset 3px 0 0 var(--accent); }
    .cr-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .cr-row__check { width: 18px; height: 18px; margin-top: 2px; }
    .cr-row__body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .cr-row__chips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .cr-row__title { font-size: var(--fs-dense); line-height: 1.3; font-weight: 500; }
    .cr-row__id { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-faint); }
    .cr-row__meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-micro); color: var(--fg-muted); }
    .cr-row__proposer { font-family: var(--font-mono); }

    /* mini gate dots */
    .cr-minigates { display: inline-flex; align-items: center; gap: 3px; }
    .cr-minigates b { font-weight: 500; color: var(--fg-muted); }
    .cr-gatedot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
    .cr-gatedot--pass { background: var(--ok-fg); }
    .cr-gatedot--current { background: var(--accent); box-shadow: 0 0 0 2px var(--info-bg); }
    .cr-gatedot--vetoed { background: var(--vetoed-fg); }

    /* detail */
    .cr-detail__scroll { flex: 1; min-height: 0; overflow: auto; padding-bottom: 2px; }
    .cr-back { display: none; }
    .cr-summary { font-size: var(--fs-dense); color: var(--fg); line-height: 1.5; margin: var(--sp-3) 0; max-width: 72ch; }
    .cr-summary q { color: var(--fg-muted); font-style: italic; }
    .cr-quote { border-left: 3px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); padding: 2px 8px; border-radius: 0 var(--r-ctl) var(--r-ctl) 0; font-style: italic; }

    .cr-banner { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-ctl); font-size: var(--fs-dense); margin-bottom: var(--sp-2); }
    .cr-banner .hx-icon { flex: none; width: 18px; height: 18px; margin-top: 1px; }
    .cr-banner--blocked { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); }
    .cr-banner--privacy { background: var(--vetoed-bg); color: var(--vetoed-fg); border: 1px solid var(--vetoed-border); }
    .cr-banner--kill { background: var(--danger-bg); color: var(--danger-fg); border: 1px solid var(--danger-border); }
    .cr-banner--info { background: var(--info-bg); color: var(--info-fg); border: 1px solid var(--info-border); }
    .cr-banner a { color: inherit; font-weight: 600; }

    /* tabs */
    .hx-tab { border: 0; background: transparent; color: var(--fg-muted); padding: 8px 12px; font: inherit; font-size: var(--fs-dense); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; min-height: 36px; }
    .hx-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    .hx-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .hx-tab .cr-tab-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger-fg); margin-left: 5px; vertical-align: middle; }
    .cr-tabpanel { min-height: 120px; }

    /* evaluation */
    .cr-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: var(--sp-2) 0; }
    .cr-check { display: flex; align-items: center; gap: 6px; font-size: var(--fs-caption); padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-surface); }
    .cr-check .hx-icon { width: 15px; height: 15px; flex: none; }
    .cr-check--pass { color: var(--ok-fg); } .cr-check--pass .hx-icon { color: var(--ok-fg); }
    .cr-check--fail { color: var(--danger-fg); border-color: var(--danger-border); background: var(--danger-bg); }
    .cr-rubric { display: flex; flex-direction: column; gap: var(--sp-2); }
    .cr-rubric__row { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2) var(--sp-3); background: var(--bg-surface); }
    .cr-rubric__top { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .cr-rubric__label { font-weight: 600; font-size: var(--fs-dense); }
    .cr-rubric__just { font-size: var(--fs-caption); color: var(--fg-muted); margin-top: 4px; }
    .cr-anchors { display: flex; gap: var(--sp-3); font-size: var(--fs-micro); color: var(--fg-faint); margin-top: 6px; flex-wrap: wrap; }
    .cr-anchors b { color: var(--fg-muted); font-weight: 500; }
    .cr-eval-score { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }

    /* gates tab */
    .cr-gaterow { display: grid; grid-template-columns: 24px 1fr auto; gap: var(--sp-2); align-items: center; padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-dense); }
    .cr-gaterow__k { display: flex; flex-direction: column; min-width: 0; }
    .cr-gaterow__sub { font-size: var(--fs-micro); color: var(--fg-muted); font-family: var(--font-mono); }

    /* dependencies */
    .cr-dep { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-surface); margin-bottom: 6px; font-size: var(--fs-dense); }
    .cr-dep .hx-icon { width: 16px; height: 16px; flex: none; color: var(--fg-muted); }
    .cr-dep--blocked { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); }

    /* ddl side-by-side */
    .cr-ddl { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
    .cr-ddl__col h4 { font-size: var(--fs-caption); color: var(--fg-muted); margin-bottom: 4px; }
    .cr-ddl pre { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: 1.5; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2); overflow-x: auto; white-space: pre; }
    .cr-ddl pre ins { background: var(--ok-bg); color: var(--ok-fg); text-decoration: none; display: inline-block; width: 100%; }
    .cr-dialect { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; margin-left: auto; }
    .cr-dialect button { border: 0; background: var(--bg-surface); color: var(--fg-muted); padding: 2px 8px; font-size: var(--fs-micro); min-height: 24px; cursor: pointer; }
    .cr-dialect button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

    /* mapping table */
    .cr-maptable { width: 100%; border-collapse: collapse; font-size: var(--fs-caption); }
    .cr-maptable th, .cr-maptable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .cr-maptable th { color: var(--fg-muted); font-weight: 600; font-size: var(--fs-micro); }
    .cr-maptable code { font-family: var(--font-mono); }

    /* valueset delta + schema */
    .cr-delta { display: flex; flex-direction: column; gap: 4px; }
    .cr-delta__row { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption); padding: 4px 8px; border-radius: var(--r-ctl); }
    .cr-delta__row--add { background: var(--ok-bg); color: var(--ok-fg); }
    .cr-delta__row--rem { background: var(--danger-bg); color: var(--danger-fg); }
    .cr-delta__row code { font-family: var(--font-mono); }
    .cr-fieldset { display: flex; flex-wrap: wrap; gap: 5px; }
    .cr-fieldset .hx-chip { font-family: var(--font-mono); }

    /* discussion */
    .cr-comment { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); background: var(--bg-surface); font-size: var(--fs-dense); }
    .cr-comment__meta { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-micro); color: var(--fg-muted); margin-bottom: 4px; font-family: var(--font-mono); }
    .cr-comment--agent { border-style: dotted; border-color: var(--warn-border); }
    .cr-addcomment textarea { width: 100%; min-height: 64px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-surface); color: var(--fg); font: inherit; font-size: var(--fs-dense); padding: var(--sp-2); resize: vertical; }

    /* releases */
    .cr-relcards { display: flex; flex-direction: column; gap: var(--sp-2); max-height: calc(100vh - var(--topbar-h) - 150px); overflow: auto; }
    .cr-relrow { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--bg-surface); padding: var(--sp-3); cursor: pointer; color: inherit; font: inherit; }
    .cr-relrow[aria-current="true"] { background: var(--info-bg); box-shadow: inset 3px 0 0 var(--accent); }
    .cr-relrow:hover { background: var(--bg-sunken); }
    .cr-metrictiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--sp-2); margin: var(--sp-2) 0; }
    .cr-metric { border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2); background: var(--bg-surface); }
    .cr-metric__k { font-size: var(--fs-micro); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em; }
    .cr-metric__v { font-family: var(--font-mono); font-size: var(--fs-lead); font-weight: 600; margin-top: 2px; }
    .cr-metric--warn .cr-metric__v { color: var(--warn-fg); }
    .cr-metric--ok .cr-metric__v { color: var(--ok-fg); }
    .cr-redirect { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--fs-caption); }

    /* section headings inside tabs */
    .cr-h { font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .05em; color: var(--fg-muted); font-weight: 600; margin: var(--sp-3) 0 var(--sp-2); }
    .cr-h:first-child { margin-top: 0; }
    .cr-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); }
    .cr-kv dt { color: var(--fg-muted); }
    .cr-kv dd { font-family: var(--font-mono); font-size: var(--fs-caption); }

    .cr-diff-end { height: 1px; }

    /* keep long mono content from forcing horizontal page scroll at 375px */
    .cr-maptable code, .cr-kv dd, .cr-redirect code, .cr-delta__row code, .cr-comment, .cr-row__id { overflow-wrap: anywhere; word-break: break-word; }
    .cr-tabpanel { overflow-x: auto; }
    .cr-redirect { flex-wrap: wrap; }

    @keyframes cr-pulse { 0% { box-shadow: 0 0 0 0 var(--accent); } 60% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .cr-statechip-pulse { animation: cr-pulse var(--dur-slow, 320ms) var(--ease, ease) 1; border-radius: var(--r-pill); }
    @media (prefers-reduced-motion: reduce) { .cr-statechip-pulse { animation: none; } }

    /* decision bar tooltip for disabled approve */
    .hx-decision-bar .hx-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
    .cr-decision-note { font-size: var(--fs-caption); color: var(--fg-muted); }

    @media (max-width: 1024px) {
      .cr-split { grid-template-columns: 1fr; }
      .cr-list { position: static; }
      .cr-queue { max-height: none; }
      .cr-detail { display: block; max-height: none; }
      .cr-detail__scroll { flex: none; min-height: 0; overflow: visible; }
      /* one-pane-at-a-time on narrow: shell drives which pane is shown */
      .cr-split[data-pane="detail"] .cr-list { display: none; }
      .cr-split[data-pane="list"] .cr-detail { display: none; }
      .cr-back { display: inline-flex; }
      .cr-ddl { grid-template-columns: 1fr; }
    }

    .sr-skip { position: absolute; left: -999px; top: 0; }
    .sr-skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--accent); color: var(--accent-fg); padding: 6px 10px; border-radius: var(--r-ctl); }
  </style>
</head>

  <script src="assets/app.js"></script>
  <script>
/* =========================================================================
   HEALIX Console — Review (change-requests.html, page-local).
   The decision-first surface: queue (typed filter · saved views · batch),
   the single most-polished CR page (diff · verdict · gates · evidence ·
   DecisionBar with risk-proportional friction), and releases/rollbacks.
   Built entirely on the shared HX runtime; no app.js edits.
   ========================================================================= */
(function () {
  "use strict";
  var E = HX.util.el, I = HX.util.icon, CLEAR = HX.util.clear, GROUP = HX.util.groupName, TC = HX.util.titleCase;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  HX.mount({ page: "cr", area: "cr", title: "Review" });

  var pageEl = document.getElementById("cr-page");

  // ---------------------------------------------------------------- state
  var DATA = { crs: [], releases: [], savedViews: [] };
  var VIEW = "queue";           // queue | releases
  var selectedId = null;        // current CR id
  var selectedRel = null;       // current release index
  var filterStr = "";
  var queueRows = [];           // current filtered+sorted CR list
  var selection = {};           // batch selection: id -> true
  var listIndex = 0;            // keyboard cursor in queue
  var activeTab = "diff";
  var gateState = { diffSeen: false, evidenceOpened: false };
  var evCycle = -1;
  var pulseId = null;   // CR whose header state chip should pulse on next render

  var ACTIONABLE = { evaluated: 1, proposed: 1, in_revision: 1 };
  var RISK_GATED = { medium: 1, high: 1, phi_affecting: 1 };

  // ---------------------------------------------------------------- helpers
  function arr(x) { return Array.isArray(x) ? x : []; }
  function byId(id) { for (var i = 0; i < DATA.crs.length; i++) if (DATA.crs[i].id === id) return DATA.crs[i]; return null; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  function riskChip(r, lg) {
    var map = { low: ["risk-low", "Low risk", "•"], medium: ["risk-medium", "Medium risk", "◆"], high: ["risk-high", "High risk", "△"], phi_affecting: ["risk-phi", "PHI-affecting", "⛊"] };
    var m = map[r] || ["neutral", r, "–"];
    return HX.chip(m[0], m[1], { lg: lg, glyph: m[2] });
  }
  function stateMeta(s) {
    return ({
      proposed: ["pending", "Proposed"], evaluated: ["info", "Evaluated"], approved: ["ok", "Approved"],
      applied: ["ok", "Applied"], rejected: ["danger", "Rejected"], vetoed: ["vetoed", "Vetoed"],
      rolled_back: ["warn", "Rolled back"], blocked: ["warn", "Blocked"], in_revision: ["pending", "In revision"],
      deferred: ["neutral", "Deferred"]
    })[s] || ["neutral", TC(s)];
  }
  function stateChip(s, lg) { var m = stateMeta(s); return HX.chip(m[0], m[1], { lg: lg }); }
  function stageMap(stage) { // CR.stage (number) -> stepper state map
    var m = {}; for (var i = 0; i <= 5; i++) m[i] = i < stage ? "released" : (i === stage ? "review" : "draft"); return m;
  }
  function slaPct(cr) {
    if (!cr.sla || !cr.sla.dueAt || !cr.createdAt) return null;
    var c = Date.parse(cr.createdAt), d = Date.parse(cr.sla.dueAt), now = Date.now();
    if (isNaN(c) || isNaN(d) || d <= c) return null;
    return Math.max(0, Math.round(((now - c) / (d - c)) * 100));
  }
  function proposerLabel(cr) { return (cr.proposer && cr.proposer.agent || "agent") + " · " + (cr.proposer && cr.proposer.level || ""); }
  function isBlocked(cr) {
    if (cr.state !== "blocked") return false;
    return true;
  }
  function depBlockers(cr) {
    return arr(cr.dependsOn).map(function (d) { return typeof d === "string" ? { cr: d } : d; })
      .filter(function (d) { return d.state && d.state !== "applied"; });
  }

  // --------------------------------------------------------------- filtering
  // HX.data.query's matchFilter does not special-case the grammar token
  // "type:cr" (every row here IS a CR), and it parseFloat()s ISO dates for
  // "age:>Nd" (so that clause matches everything). We strip both tokens here
  // and re-apply the age predicate page-locally after the query.
  function cleanFilter(str) {
    return String(str || "").split(/\s+/).filter(function (t) {
      return t && t.toLowerCase() !== "type:cr" && !/^age:/i.test(t);
    }).join(" ");
  }
  function agePredicate(str) {
    var m = String(str || "").match(/age:>(\d+)d/i);
    if (!m) return null;
    var days = parseInt(m[1], 10);
    return function (cr) { return cr.createdAt && (Date.now() - Date.parse(cr.createdAt)) / 86400000 > days; };
  }
  function sortQueue(rows) {
    var rank = { evaluated: 0, proposed: 1, in_revision: 1, blocked: 2, approved: 3, applied: 5, rejected: 6, vetoed: 6, rolled_back: 6, deferred: 4 };
    return rows.slice().sort(function (a, b) {
      var ra = rank[a.state] == null ? 9 : rank[a.state], rb = rank[b.state] == null ? 9 : rank[b.state];
      if (ra !== rb) return ra - rb;
      var pa = slaPct(a), pb = slaPct(b);
      if (pa == null) pa = -1; if (pb == null) pb = -1;
      if (pa !== pb) return pb - pa; // most SLA-consumed first
      return Date.parse(a.createdAt || 0) - Date.parse(b.createdAt || 0);
    });
  }
  function applyFilter() {
    var agePred = agePredicate(filterStr);
    return HX.data.query("change-requests", cleanFilter(filterStr)).then(function (rows) {
      if (agePred) rows = rows.filter(agePred);
      queueRows = sortQueue(rows);
      return queueRows;
    });
  }

  // =============================================================== RENDER: shell
  function renderShell() {
    CLEAR(pageEl);
    pageEl.appendChild(renderViewbar());
    var split = E("div", { class: "cr-split", id: "cr-split", dataset: { pane: selectedId || selectedRel != null ? "detail" : "list" } });
    if (VIEW === "queue") {
      split.appendChild(renderListPane());
      split.appendChild(renderDetailPane());
    } else {
      split.appendChild(renderReleaseListPane());
      split.appendChild(renderReleaseDetailPane());
    }
    pageEl.appendChild(split);
    renderBatchTray();
  }

  function renderViewbar() {
    var bar = E("div", { class: "cr-viewbar" });
    var seg = E("div", { class: "cr-seg", role: "tablist", "aria-label": "Review view" });
    [["queue", "Queue"], ["releases", "Releases & rollbacks"]].forEach(function (v) {
      var b = E("button", { role: "tab", "aria-pressed": VIEW === v[0] ? "true" : "false", text: v[1] });
      b.addEventListener("click", function () { VIEW = v[0]; selectedRel = (v[0] === "releases" ? 0 : null); renderShell(); });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    bar.appendChild(E("span", { class: "cr-viewbar__spacer" }));
    if (VIEW === "queue") {
      // "Review as batch" affordance when >=3 share requiredRole + artefactFamily and are actionable
      var fam = batchableFamily();
      if (fam) {
        var bb = E("button", { class: "hx-btn hx-btn--sm" }, [I("review"), "Review as batch (" + fam.ids.length + ")"]);
        bb.addEventListener("click", function () { selection = {}; fam.ids.forEach(function (id) { selection[id] = true; }); renderShell(); HX.live("Selected " + fam.ids.length + " related change requests for batch review", "polite"); });
        bar.appendChild(bb);
      }
    }
    return bar;
  }
  function batchableFamily() {
    var groups = {};
    queueRows.forEach(function (cr) {
      if (!ACTIONABLE[cr.state]) return;
      var k = (cr.requiredRole || "?") + "|" + (cr.artefactFamily || "?");
      (groups[k] = groups[k] || []).push(cr.id);
    });
    var best = null;
    Object.keys(groups).forEach(function (k) { if (groups[k].length >= 3 && (!best || groups[k].length > best.ids.length)) best = { key: k, ids: groups[k] }; });
    return best;
  }

  // =============================================================== RENDER: queue list
  function renderListPane() {
    var pane = E("aside", { class: "cr-list", "aria-label": "Change-request queue" });
    var table = E("div", { class: "hx-datatable" });
    var head = E("div", { class: "cr-queue-head hx-datatable__toolbar" });

    // saved views
    var sv = E("div", { class: "cr-savedviews" });
    var sel = E("select", { "aria-label": "Saved view" });
    sel.appendChild(E("option", { value: "", text: "All change requests" }));
    DATA.savedViews.forEach(function (v) { sel.appendChild(E("option", { value: v.filter, text: v.label })); });
    sel.value = filterStr;
    sel.addEventListener("change", function () { filterStr = sel.value; var f = $("#cr-filter"); if (f) f.value = filterStr; refreshQueue(); });
    sv.appendChild(sel);
    head.appendChild(sv);

    // typed filter
    var fwrap = E("div", { class: "hx-datatable__filter" });
    fwrap.appendChild(I("search"));
    var input = E("input", { id: "cr-filter", type: "text", value: filterStr, placeholder: "type:cr state:evaluated risk:high group:G2 …", "aria-label": "Typed filter" });
    var deb;
    input.addEventListener("input", function () { clearTimeout(deb); deb = setTimeout(function () { filterStr = input.value; refreshQueue(true); }, 180); });
    fwrap.appendChild(input);
    head.appendChild(fwrap);
    table.appendChild(head);

    var meta = E("div", { class: "cr-queue-meta" });
    meta.appendChild(E("span", { id: "cr-count", text: plural(queueRows.length, "result") }));
    meta.appendChild(E("span", { text: "j / k move · Enter open · Space select" }));
    table.appendChild(meta);

    var list = E("div", { class: "cr-queue", id: "cr-queue", role: "listbox", "aria-label": "Change requests", tabindex: "0" });
    renderQueueRows(list);
    table.appendChild(list);
    pane.appendChild(table);
    return pane;
  }

  function renderQueueRows(list) {
    CLEAR(list);
    if (!queueRows.length) {
      list.appendChild(E("div", { class: "hx-empty", style: "padding:var(--sp-4)" }, [
        I("info"),
        E("div", {}, ["No change requests match this filter. Clear the filter, or ask an agent to draft one (a request_change CR, AGT-ORCH-023)."])
      ]));
      return;
    }
    queueRows.forEach(function (cr, idx) {
      var row = E("button", { class: "cr-row", role: "option", "aria-current": cr.id === selectedId ? "true" : "false", "aria-selected": cr.id === selectedId ? "true" : "false", dataset: { id: cr.id, idx: idx } });
      var check = E("input", { type: "checkbox", class: "cr-row__check", "aria-label": "Select " + cr.id + " for batch", checked: !!selection[cr.id] });
      check.addEventListener("click", function (e) { e.stopPropagation(); });
      check.addEventListener("change", function () { if (check.checked) selection[cr.id] = true; else delete selection[cr.id]; renderBatchTray(); });
      row.appendChild(check);

      var body = E("div", { class: "cr-row__body" });
      var chips = E("div", { class: "cr-row__chips" });
      chips.appendChild(riskChip(cr.riskClass));
      chips.appendChild(HX.chip("neutral", TC(cr.type)));
      if (cr.group) { var gc = HX.groupChip(cr.group); gc.querySelector(".hx-chip__text").remove(); chips.appendChild(gc); }
      chips.appendChild(stateChip(cr.state));
      body.appendChild(chips);

      body.appendChild(E("div", { class: "cr-row__title", text: cr.title }));
      body.appendChild(E("div", { class: "cr-row__id", text: cr.id }));

      var m = E("div", { class: "cr-row__meta" });
      m.appendChild(E("span", { class: "cr-row__proposer", text: proposerLabel(cr) }));
      if (cr.evaluation && cr.evaluation.aggregateScore != null && cr.riskClass !== "high") {
        m.appendChild(HX.score(cr.evaluation.aggregateScore, cr.evaluation.threshold || 0.95, cr.evaluation.kappaForType));
      } else if (cr.evaluation && cr.evaluation.aggregateScore != null) {
        m.appendChild(E("span", { class: "hx-chip hx-chip--neutral", title: "Evaluator score hidden for high-risk CRs — see the Evaluation tab", text: "score hidden" }));
      }
      m.appendChild(miniGates(cr));
      var p = slaPct(cr);
      if (p != null) m.appendChild(HX.sla(p, { title: "SLA " + p + "% consumed · due " + HX.format.time(cr.sla.dueAt, "known") }));
      if (cr.createdAt) m.appendChild(E("span", { title: HX.format.time(cr.createdAt, "event"), text: "age " + HX.format.rel(cr.createdAt).replace(" ago", "") }));
      body.appendChild(m);
      row.appendChild(body);

      row.addEventListener("click", function () { listIndex = idx; selectCR(cr.id); });
      row.addEventListener("keydown", function (e) { if (e.key === "Enter") { listIndex = idx; selectCR(cr.id); } });
      list.appendChild(row);
    });
  }

  function miniGates(cr) {
    var wrap = E("span", { class: "cr-minigates", title: "Approval gates" });
    var req = arr(cr.gatesRequired), appr = arr(cr.approvals);
    var done = 0;
    req.forEach(function (g) {
      var a = appr.filter(function (x) { return x.gate === g; })[0];
      var mod = "";
      if (a) { mod = a.decision === "veto" ? "vetoed" : "pass"; done++; }
      else if (g === cr.nextGate) mod = "current";
      wrap.appendChild(E("span", { class: "cr-gatedot" + (mod ? " cr-gatedot--" + mod : ""), title: TC(g) + (a ? " · " + a.decision : " · pending") }));
    });
    wrap.appendChild(E("b", { text: done + "/" + req.length }));
    return wrap;
  }

  function refreshQueue(keepSel) {
    applyFilter().then(function () {
      var list = $("#cr-queue");
      if (list) renderQueueRows(list);
      var c = $("#cr-count"); if (c) c.textContent = plural(queueRows.length, "result");
      HX.live(plural(queueRows.length, "result") + " in the queue", "polite");
      renderBatchTray();
    });
  }

  // =============================================================== RENDER: CR detail
  function selectCR(id) {
    selectedId = id;
    activeTab = "diff";
    gateState = { diffSeen: false, evidenceOpened: false };
    evCycle = -1;
    try { history.replaceState(null, "", "#/cr/" + id); } catch (e) {}
    var split = $("#cr-split"); if (split) split.setAttribute("data-pane", "detail");
    // mark current in list
    $$(".cr-row").forEach(function (r) { var on = r.dataset.id === id; r.setAttribute("aria-current", on ? "true" : "false"); r.setAttribute("aria-selected", on ? "true" : "false"); });
    var detail = $("#cr-detail"); if (detail) { var p = detail.parentNode; renderDetailInto(detail); }
    var cr = byId(id);
    if (cr) HX.live("Opened " + cr.id + " — " + cr.title, "polite");
  }

  function renderDetailPane() {
    var pane = E("section", { class: "cr-detail", id: "cr-detail", "aria-label": "Change request detail", tabindex: "-1" });
    renderDetailInto(pane);
    return pane;
  }

  function renderDetailInto(pane) {
    CLEAR(pane);
    var cr = byId(selectedId) || queueRows[0];
    if (!cr) {
      pane.appendChild(E("div", { class: "hx-empty", style: "padding:var(--sp-6)" }, [I("review"), E("div", {}, ["Select a change request from the queue to review it."])]));
      return;
    }
    selectedId = cr.id;
    var scroll = E("div", { class: "cr-detail__scroll" });

    // back (narrow only)
    var back = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost cr-back" }, [I("chevron"), "Back to queue"]);
    back.addEventListener("click", function () { var s = $("#cr-split"); if (s) s.setAttribute("data-pane", "list"); });
    scroll.appendChild(back);

    scroll.appendChild(renderBreadcrumb(cr));
    scroll.appendChild(renderHeader(cr));

    // banners (order: kill · blocked · privacy pinned · info)
    var kill = HX.killswitch.get();
    if (kill && kill.active) {
      var scope = typeof kill.scope === "object" ? Object.values(kill.scope).join(" / ") : kill.scope;
      scroll.appendChild(E("div", { class: "cr-banner cr-banner--kill", role: "status" }, [I("danger"), E("span", {}, ["Kill switch active (" + scope + "): a decision here records who/when but produces no applied transitions for this scope until the switch is released."])]));
    }
    var deps = depBlockers(cr);
    if (cr.state === "blocked" || deps.length) {
      var dep = deps[0] || { cr: (arr(cr.dependsOn)[0] || {}).cr || arr(cr.dependsOn)[0] };
      var depId = dep && (dep.cr || dep);
      scroll.appendChild(E("div", { class: "cr-banner cr-banner--blocked", role: "status" }, [I("lock"),
        E("span", {}, ["Blocked by dependency ", depLink(depId), " — it must be applied before this change can be approved."])]));
    }
    if (cr.riskClass === "phi_affecting" || (cr.privacyReview && (cr.privacyReview.decision === "veto" || cr.privacyReview.decision === "vetoed"))) {
      var pv = cr.privacyReview || {};
      scroll.appendChild(E("div", { class: "cr-banner cr-banner--privacy", role: "alert" }, [I("lock"),
        E("span", {}, [E("b", { text: "Privacy verdict pinned — " + (pv.decision === "veto" || pv.decision === "vetoed" ? "VETOED" : "PHI-affecting") + ". " }),
          pv.verdict || "This change touches protected data; the guardian verdict governs. Veto is a Privacy Officer verb and is not available to your principal."])]));
    }

    // summary (untrusted source text quoted)
    if (cr.summary) scroll.appendChild(renderSummary(cr));

    // verdict strip + gate tracker
    scroll.appendChild(renderVerdictStrip(cr));
    var gatesWrap = E("div", {}); scroll.appendChild(gatesWrap); HX.gates(gatesWrap, cr.gatesRequired, cr.approvals);

    // tabs
    scroll.appendChild(renderTabs(cr));
    var panel = E("div", { class: "cr-tabpanel", id: "cr-tabpanel", role: "tabpanel" });
    scroll.appendChild(panel);

    scroll.appendChild(renderProvFooter(cr));
    pane.appendChild(scroll);

    // sticky decision bar (outside scroll so it pins to pane bottom)
    pane.appendChild(renderDecisionBar(cr));

    renderTabPanel(cr, panel);
    openEvidenceInspector(cr);
    wireDiffObserver(scroll);
  }

  // ------------------------------------------------------------- DIFF renderers
  function diffSwitch() {
    var sw = E("div", { class: "hx-diff__switch", role: "group", "aria-label": "Renderer" });
    ["Native", "Text", "Turtle"].forEach(function (r, i) { sw.appendChild(E("button", { type: "button", "aria-pressed": i === 0 ? "true" : "false", text: r })); });
    return sw;
  }
  function renderDiff(cr, panel) {
    var p = cr.payload || {};
    var fmt = p.format;
    if (fmt === "ddl") renderDdlDiff(cr, panel);
    else if (fmt === "mapping-table") renderMappingDiff(cr, panel);
    else if (fmt === "valueset-delta") renderValuesetDiff(cr, panel);
    else if (fmt === "schema-compat") renderSchemaDiff(cr, panel);
    else if (fmt === "skos-tree") HX.diff(panel, { format: "skos-tree", before: p.before, after: p.after, a: "before", b: "after" });
    else if (fmt === "owl") HX.diff(panel, { format: "owl", before: (p.before && p.before.asserted || []).join("\n"), after: (p.after && p.after.asserted || []).join("\n"), inferred: owlInferredText(p), explanation: p.reasoner ? (p.reasoner.engine + " — select an inferred axiom for its justification set.") : null });
    else if (fmt === "yaml") renderYamlDiff(cr, panel);
    else HX.diff(panel, { format: fmt || "raw", before: p.before, after: p.after }); // unknown → visible fallback state
    panel.appendChild(E("div", { class: "cr-diff-end", "aria-hidden": "true" }));
  }
  function owlInferredText(p) {
    if (!p.inferred) return null;
    var added = arr(p.inferred.added).map(function (x) { return "+ " + x; });
    var removed = arr(p.inferred.removed).map(function (x) { return "- " + x; });
    return added.concat(removed).join("\n") || "(no new inferences)";
  }
  function renderDdlDiff(cr, panel) {
    var p = cr.payload;
    var header = E("div", { class: "hx-diff__header" });
    header.appendChild(HX.chip("info", "DDL diff"));
    header.appendChild(E("span", { class: "hx-diff__a", text: "A current" }));
    header.appendChild(E("span", { class: "hx-diff__b", text: "B proposed" }));
    var dialect = E("div", { class: "cr-dialect", role: "group", "aria-label": "SQL dialect" });
    var cur = "portable";
    var cols = E("div", { class: "cr-ddl" });
    function paint() {
      CLEAR(cols);
      var before = p.before, after = p.after;
      if (cur === "teradata" && p.teradata) {
        if (typeof p.teradata === "object") { before = p.teradata.before != null ? p.teradata.before : p.before; after = p.teradata.after != null ? p.teradata.after : p.after; }
        else { after = p.teradata; }
      }
      cols.appendChild(ddlCol("Current (A)", before, after, false));
      cols.appendChild(ddlCol("Proposed (B)", before, after, true));
    }
    ["portable", "teradata"].forEach(function (d) {
      var b = E("button", { type: "button", "aria-pressed": d === cur ? "true" : "false", text: d === "portable" ? "Portable" : "Teradata" });
      b.addEventListener("click", function () { cur = d; $$(".cr-dialect button", dialect).forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); paint(); });
      dialect.appendChild(b);
    });
    header.appendChild(dialect);
    panel.appendChild(E("div", { class: "hx-diff hx-diff--ddl" }, [header]));
    panel.appendChild(cols);
    paint();
    // dry-run panel
    if (p.dryRun) {
      panel.appendChild(E("div", { class: "cr-h", text: "Dry-run (" + (cr.env || "uat").toUpperCase() + ")" }));
      var dry = E("div", { class: "hx-dryrun" });
      Object.keys(p.dryRun).forEach(function (k) {
        var val = p.dryRun[k], pass = /pass|ok|true|^0$/i.test(String(val));
        dry.appendChild(E("span", { class: "hx-dryrun__check" }, [I(pass ? "check" : "warn"), TC(k) + ": " + val]));
      });
      panel.appendChild(dry);
    }
    if (p.migration) panel.appendChild(E("div", { class: "cr-kv" }, [E("dt", { text: "Migration" }), E("dd", { text: p.migration })]));
  }
  function ddlCol(title, before, after, isAfter) {
    var col = E("div", { class: "cr-ddl__col" });
    col.appendChild(E("h4", { text: title }));
    var pre = E("pre");
    var txt = isAfter ? after : before;
    var bset = {}; String(before || "").split("\n").forEach(function (l) { bset[l.trim()] = 1; });
    String(txt || "").split("\n").forEach(function (line, i) {
      if (i) pre.appendChild(document.createTextNode("\n"));
      if (isAfter && !bset[line.trim()] && line.trim()) pre.appendChild(E("ins", { text: line }));
      else pre.appendChild(document.createTextNode(line));
    });
    col.appendChild(pre);
    return col;
  }
  function renderMappingDiff(cr, panel) {

    var tb = E("tbody", {});
    arr(p.after).forEach(function (r) {
      tb.appendChild(E("tr", {}, [
        E("td", {}, [E("code", { text: r.source })]),

      var gb = E("tbody", {});

  function renderValuesetDiff(cr, panel) {
    var p = cr.payload;
    panel.appendChild(E("div", { class: "hx-diff hx-diff--valueset" }, [E("div", { class: "hx-diff__header" }, [HX.chip("info", "Value-set delta"),
      E("span", { class: "hx-version-chip", text: (p.version && p.version.before) + " → " + (p.version && p.version.after) }), diffSwitch()])]));

  function renderSchemaDiff(cr, panel) {

  // ------------------------------------------------------------- EVALUATION

  function renderGates(cr, panel) {

  function wireEvidenceToggles(host) {

    $$("details.hx-evidence__section > summary", host).forEach(function (s) {

    });

  function cycleEvidence() {

    evCycle = (evCycle + 1) % sections.length;

    gateState.evidenceOpened = true; refreshDecisionGate();
    sections[evCycle].scrollIntoView({ block: "nearest" });

  // ------------------------------------------------------------- DECISION BAR
  function renderDecisionBar(cr) {
    var bar = E("div", { class: "hx-decision-bar", role: "toolbar", "aria-label": "Decision bar", id: "cr-decision" });
    var terminal = { applied: 1, rejected: 1, vetoed: 1, rolled_back: 1 };
    var verbs = HX.role.verbs("cr", cr).filter(function (v) { return ["approve", "approve_with_comment", "request_revision", "reject", "defer", "escalate", "veto"].indexOf(v) >= 0; });
    var VM = {
      approve: ["Approve", "a", "hx-btn--primary"], approve_with_comment: ["Approve + comment", "A", ""],
      request_revision: ["Request revision", "v", ""], reject: ["Reject", "r", "hx-btn--danger"],
      defer: ["Defer", "x", ""], escalate: ["Escalate", "", ""], veto: ["Veto", "V", "hx-btn--danger"]
    };
    if (terminal[cr.state]) {
      bar.appendChild(E("span", { class: "cr-decision-note" }, [I("info"), " Disposed — " + stateMeta(cr.state)[1] + (cr.privacyReview && (cr.privacyReview.decision === "veto") ? " by " + cr.privacyReview.by : "") + ". No further decision."]));
      return bar;
    }
    if (cr.state === "approved") {
      bar.appendChild(E("span", { class: "cr-decision-note" }, [I("check"), " Approved — awaiting " + (cr.nextGate ? TC(cr.nextGate) : "release") + ". Decision gates satisfied."]));
      return bar;
    }

    verbs.forEach(function (v) {
      var m = VM[v]; if (!m) return;
      var btn = E("button", { class: "hx-btn " + m[2], dataset: { verb: v } }, [m[0]]);
      if (m[1]) btn.appendChild(E("kbd", { text: m[1] }));
      btn.addEventListener("click", function () { if (btn.getAttribute("aria-disabled") === "true") { HX.toast(approveTooltip(cr), { kind: "warn" }); return; } runDecision(cr, v); });
      bar.appendChild(btn);
    });
    bar.appendChild(E("span", { class: "hx-decision-bar__spacer" }));
    bar.appendChild(E("span", { class: "hx-decision-bar__hint", text: "Diff: scroll · Evidence: e · Next change: n/p" }));
    if (blocked) {
      bar.querySelectorAll("button").forEach ? null : null;
      $$("button", bar).forEach(function (b) { b.setAttribute("aria-disabled", "true"); b.title = "Blocked by an unapplied dependency"; });
    }
    setTimeout(function () { refreshDecisionGate(); }, 0);
    return bar;
  }
  function approveTooltip(cr) {
    var need = [];
    if (!gateState.diffSeen) need.push("scroll the diff into view");
    if (!gateState.evidenceOpened) need.push("open one evidence section (e)");
    return "Before approving a " + cr.riskClass.replace("_", "-") + " change: " + need.join(" and ") + ".";
  }
  function refreshDecisionGate() {
    var cr = byId(selectedId); if (!cr) return;
    var bar = $("#cr-decision"); if (!bar) return;
    if (isBlocked(cr) || depBlockers(cr).length) return; // stay disabled
    var gated = RISK_GATED[cr.riskClass] && !(gateState.diffSeen && gateState.evidenceOpened);
    ["approve", "approve_with_comment"].forEach(function (v) {
      var b = bar.querySelector('button[data-verb="' + v + '"]'); if (!b) return;
      if (gated) { b.setAttribute("aria-disabled", "true"); b.title = approveTooltip(cr); }
      else { b.removeAttribute("aria-disabled"); b.title = ""; }
    });
  }

  function runDecision(cr, verb) {
    var needsComment = /comment|revision|reject|escalate|veto/.test(verb);
    var chain = Promise.resolve("");
    if (needsComment) chain = promptCommentGuarded(verb);
    chain.then(function (comment) {
      if (comment === false) return;
      return HX.env.confirmWrite().then(function (envOk) {
        if (!envOk) return;
        var danger = /reject|veto/.test(verb);
        var kill = HX.killswitch.get();
        var consequence = danger ? "This cannot be silently undone; it becomes a labelled calibration example." : (kill && kill.active ? "Kill switch active — recorded, but no applied transition for this scope." : null);
        return HX.confirm({
          title: VERBLABEL(verb), danger: danger, confirmLabel: VERBLABEL(verb),
          body: "Gate: " + (cr.nextGate ? TC(cr.nextGate) : "review") + " · environment: " + (HX.env.get()).toUpperCase() + " · as " + HX.role.principal() + "."
          , consequence: consequence
        }).then(function (ok) { if (ok) applyDecision(cr, verb, comment); });
      });
    });
  }
  function VERBLABEL(v) { return ({ approve: "Approve", approve_with_comment: "Approve with comment", request_revision: "Request revision", reject: "Reject", defer: "Defer", escalate: "Escalate", veto: "Veto" })[v] || TC(v); }

  function promptCommentGuarded(verb) {
    return new Promise(function (resolve) {
      var overlay = E("div", { class: "hx-overlay", role: "dialog", "aria-modal": "true", "aria-label": VERBLABEL(verb) + " comment" });
      var sheet = E("div", { class: "hx-confirm-sheet" });
      sheet.appendChild(E("div", { class: "hx-sheet__head" }, [I("review"), E("h2", { text: VERBLABEL(verb) + " — comment" })]));
      var ta = E("textarea", { rows: 4, placeholder: "Reason (scanned for PHI before it is stored)…", "aria-label": "Comment" });
      var guard = E("div", { class: "hx-phi-guard" });
      var rec = E("button", { class: "hx-btn hx-btn--primary", "aria-disabled": "true" }, ["Record"]); rec.disabled = true;
      function check() {
        var s = HX.phiScan(ta.value); CLEAR(guard);
        if (!s.pass) { guard.appendChild(E("div", { class: "hx-phi-guard__finding" }, [I("danger"), "PHI-like text — remove before recording: " + s.findings.map(function (f) { return f.kind; }).join(", ")])); }
        var ok = s.pass && ta.value.trim().length > 0;
        rec.disabled = !ok; if (ok) rec.removeAttribute("aria-disabled"); else rec.setAttribute("aria-disabled", "true");
      }
      ta.addEventListener("input", check);
      sheet.appendChild(E("div", { class: "hx-field" }, [E("label", { text: "Comment" }), ta]));
      sheet.appendChild(guard);
      var cancel = E("button", { class: "hx-btn" }, ["Cancel"]); cancel.addEventListener("click", function () { overlay.remove(); resolve(false); });
      rec.addEventListener("click", function () { if (rec.disabled) return; overlay.remove(); resolve(ta.value.trim()); });
      sheet.appendChild(E("div", { class: "hx-sheet__row" }, [cancel, rec]));
      overlay.appendChild(sheet); document.body.appendChild(overlay); ta.focus();
    });
  }

  function applyDecision(cr, verb, comment) {
    var before = { state: cr.state, approvals: arr(cr.approvals).slice(), nextGate: cr.nextGate };
    var now = new Date().toISOString();
    var principal = HX.role.principal();
    var killActive = HX.killswitch.get() && HX.killswitch.get().active;
    if (verb === "approve" || verb === "approve_with_comment") {
      cr.approvals = arr(cr.approvals).concat([{ gate: cr.nextGate, by: cr.requiredRole || principal, decision: "approve", at: now, comment: comment || undefined }]);
      // advance to next unmet gate
      var remaining = arr(cr.gatesRequired).filter(function (g) { return !cr.approvals.some(function (a) { return a.gate === g; }); });
      if (remaining.length) { cr.nextGate = remaining[0]; cr.state = killActive ? cr.state : "approved"; }
      else { cr.nextGate = null; cr.state = killActive ? cr.state : "applied"; }
    } else if (verb === "request_revision") { cr.state = "in_revision"; cr.nextGate = "evaluation"; }
    else if (verb === "reject") { cr.state = "rejected"; cr.nextGate = null; }
    else if (verb === "veto") { cr.state = "vetoed"; cr.nextGate = null; }
    else if (verb === "defer") { cr.state = "deferred"; }
    else if (verb === "escalate") { /* keep state, note only */ }
    cr.stateHistory = arr(cr.stateHistory).concat([{ from: before.state, to: cr.state, at: now, by: principal }]);
    HX.audit.write({ type: "CR_DECISION", cr: cr.id, verb: verb, by: principal, env: HX.env.get() });
    // re-render (pulse the state chip on the next header render)
    pulseId = cr.id;
    sortAndRerender();
    selectCR(cr.id);
    var remainingQueue = queueRows.filter(function (x) { return ACTIONABLE[x.state]; }).length;
    HX.live(cr.id + " " + verb + "; " + remainingQueue + " still need you in the queue.", "polite");
    HX.toast(cr.id + " — " + VERBLABEL(verb).toLowerCase() + (killActive ? " recorded (no applied transition)" : ""), {
      kind: /reject|veto/.test(verb) ? "danger" : "ok",
      undo: function () { cr.state = before.state; cr.approvals = before.approvals; cr.nextGate = before.nextGate; cr.stateHistory = arr(cr.stateHistory).slice(0, -1); sortAndRerender(); selectCR(cr.id); HX.live("Reverted " + cr.id, "polite"); }
    });
  }
  function sortAndRerender() { applyFilter().then(function () { var l = $("#cr-queue"); if (l) renderQueueRows(l); var c = $("#cr-count"); if (c) c.textContent = plural(queueRows.length, "result"); }); }

  // ------------------------------------------------------------- diff "seen" observer
  function wireDiffObserver(scroll) {
    var end = scroll.querySelector(".cr-diff-end");
    if (!end) { gateState.diffSeen = true; refreshDecisionGate(); return; }
    try {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { gateState.diffSeen = true; refreshDecisionGate(); io.disconnect(); } });
      }, { root: scroll, threshold: 0.1 });
      io.observe(end);
    } catch (e) { gateState.diffSeen = true; refreshDecisionGate(); }
    // fallback: scrolling the pane marks seen
    scroll.addEventListener("scroll", function () { if (!gateState.diffSeen) { gateState.diffSeen = true; refreshDecisionGate(); } }, { once: true });
  }

  // =============================================================== BATCH TRAY
  function renderBatchTray() {
    var old = $("#cr-batch-tray"); if (old) old.remove();
    var ids = Object.keys(selection);
    if (ids.length < 2) return;
    var crs = ids.map(byId).filter(Boolean);
    var included = [], excluded = [];
    crs.forEach(function (cr) {
      var reason = null;
      if (cr.riskClass === "high" || cr.riskClass === "phi_affecting") reason = "risk " + cr.riskClass.replace("_", "-");
      else if (cr.evaluation && arr(cr.evaluation.checks).some(function (c) { return c.result !== "pass"; })) reason = "failing check";
      else if (!ACTIONABLE[cr.state]) reason = "not actionable (" + stateMeta(cr.state)[1] + ")";
      if (reason) excluded.push({ cr: cr, reason: reason }); else included.push(cr);
    });
    var tray = E("aside", { class: "hx-batch-tray", id: "cr-batch-tray", role: "region", "aria-label": "Batch approval tray" });
    var head = E("div", { class: "hx-batch-tray__head" }, [I("review"), "Batch review", E("span", { class: "hx-chip hx-chip--neutral", text: ids.length + " selected" })]);
    var closeB = E("button", { class: "hx-btn hx-btn--icon hx-btn--ghost hx-btn--sm", style: "margin-left:auto", "aria-label": "Clear batch selection" }, [I("close")]);
    closeB.addEventListener("click", function () { selection = {}; $$(".cr-row__check").forEach(function (c) { c.checked = false; }); renderBatchTray(); });
    head.appendChild(closeB);
    tray.appendChild(head);

    // merged evidence summary (grouped)
    var fams = {}; included.forEach(function (cr) { (fams[cr.artefactFamily] = fams[cr.artefactFamily] || []).push(cr); });
    tray.appendChild(E("div", { class: "hx-caption hx-muted", style: "margin-bottom:4px", text: "Merged evidence across " + Object.keys(fams).length + " artefact " + (Object.keys(fams).length === 1 ? "family" : "families") + "; outliers pinned." }));

    included.forEach(function (cr) {
      var sc = cr.evaluation && cr.evaluation.aggregateScore;
      var outlier = sc != null && sc < 0.95;
      var item = E("div", { class: "hx-batch-tray__item" });
      item.appendChild(riskChip(cr.riskClass));
      item.appendChild(E("span", { style: "flex:1;min-width:0", text: cr.title }));
      if (outlier) item.appendChild(HX.chip("warn", "outlier", { title: "Below auto-approve threshold — pinned for individual attention" }));
      item.appendChild(E("span", { class: "hx-mono hx-caption", text: cr.id.slice(-6) }));
      if (outlier) tray.insertBefore(item, tray.children[2]); else tray.appendChild(item);
    });
    excluded.forEach(function (x) {
      var item = E("div", { class: "hx-batch-tray__item hx-batch-tray__item--excluded" });
      item.appendChild(I("warn"));
      item.appendChild(E("span", { style: "flex:1;min-width:0", text: x.cr.title }));
      item.appendChild(E("span", { class: "hx-batch-tray__excluded-reason", text: "excluded · " + x.reason }));
      tray.appendChild(item);
    });

    var foot = E("div", { class: "hx-sheet__row", style: "margin-top:var(--sp-2)" });
    var go = E("button", { class: "hx-btn hx-btn--primary hx-btn--sm" }, ["Approve " + included.length + " as batch"]);
    go.disabled = included.length === 0;
    go.addEventListener("click", function () { approveBatch(included); });
    foot.appendChild(go);
    tray.appendChild(foot);
    document.body.appendChild(tray);
  }

  function approveBatch(included) {
    var proceed = Promise.resolve(true);
    if (included.length > 10) proceed = HX.confirm({ title: "Approve " + included.length + " change requests", body: "Large batch. Type the count to confirm you have reviewed the merged evidence.", typed: String(included.length), danger: false, confirmLabel: "Approve batch" });
    proceed.then(function (ok) {
      if (!ok) return;
      return HX.env.confirmWrite().then(function (envOk) {
        if (!envOk) return;
        var receipt = [];
        var now = new Date().toISOString();
        included.forEach(function (cr) {
          cr.approvals = arr(cr.approvals).concat([{ gate: cr.nextGate, by: cr.requiredRole || HX.role.principal(), decision: "approve", at: now }]);
          var remaining = arr(cr.gatesRequired).filter(function (g) { return !cr.approvals.some(function (a) { return a.gate === g; }); });
          cr.nextGate = remaining[0] || null; cr.state = remaining.length ? "approved" : "applied";
          cr.stateHistory = arr(cr.stateHistory).concat([{ from: "evaluated", to: cr.state, at: now, by: HX.role.principal() }]);
          receipt.push({ cr: cr.id, gate: cr.approvals[cr.approvals.length - 1].gate, state: cr.state });
          HX.audit.write({ type: "CR_BATCH_APPROVE", cr: cr.id, by: HX.role.principal() });
        });
        selection = {};
        showReceipt(receipt);
        sortAndRerender();
        if (selectedId) selectCR(selectedId);
        renderBatchTray();
        HX.live("Batch approved: " + receipt.length + " change requests.", "polite");
      });
    });
  }
  function showReceipt(receipt) {
    var overlay = E("div", { class: "hx-overlay", role: "dialog", "aria-modal": "true", "aria-label": "Batch approval receipt" });
    var sheet = E("div", { class: "hx-sheet" });
    sheet.appendChild(E("div", { class: "hx-sheet__head" }, [I("check"), E("h2", { text: "Batch receipt — " + receipt.length + " approvals" })]));
    var r = E("div", { class: "hx-receipt" });
    receipt.forEach(function (x) { r.appendChild(E("div", { class: "hx-receipt__row" }, [HX.chip("ok", "approved"), E("span", { class: "hx-mono", text: x.cr }), E("span", { class: "hx-caption", text: "gate " + TC(x.gate || "—") + " → " + stateMeta(x.state)[1] })])); });
    sheet.appendChild(r);
    sheet.appendChild(E("p", { class: "hx-caption hx-muted", text: "One approvals[] entry was recorded per change request — the batch is not a single decision." }));
    var close = E("button", { class: "hx-btn hx-btn--primary" }, ["Done"]); close.addEventListener("click", function () { overlay.remove(); });
    sheet.appendChild(E("div", { class: "hx-sheet__row" }, [close]));
    overlay.appendChild(sheet); document.body.appendChild(overlay); close.focus();
  }

  // =============================================================== RELEASES
  function renderReleaseListPane() {
    var pane = E("aside", { class: "cr-list", "aria-label": "Releases" });
    var table = E("div", { class: "hx-datatable" });
    table.appendChild(E("div", { class: "hx-datatable__toolbar" }, [E("span", { class: "hx-caption hx-muted", text: "Releases, candidates & rollbacks" })]));
    var list = E("div", { class: "cr-relcards" });
    DATA.releases.forEach(function (rel, idx) {
      var row = E("button", { class: "cr-relrow", "aria-current": idx === selectedRel ? "true" : "false" });
      var chips = E("div", { class: "cr-row__chips" });
      var sm = { released: ["ok", "Released"], candidate: ["pending", "Candidate"], rolled_back: ["warn", "Rolled back"] }[rel.state] || ["neutral", TC(rel.state)];
      chips.appendChild(HX.chip(sm[0], sm[1]));
      chips.appendChild(E("span", { class: "hx-version-chip", text: rel.version }));
      row.appendChild(chips);
      row.appendChild(E("div", { class: "cr-row__title", text: rel.artefact }));
      row.appendChild(E("div", { class: "cr-row__meta" }, [E("span", { text: plural(arr(rel.crs).length, "CR") }), E("span", { text: rel.releasedAt ? HX.format.rel(rel.releasedAt) : "not released" })]));
      row.addEventListener("click", function () { selectedRel = idx; var s = $("#cr-split"); if (s) s.setAttribute("data-pane", "detail"); renderShell(); });
      list.appendChild(row);
    });
    table.appendChild(list);
    pane.appendChild(table);
    return pane;
  }
  function renderReleaseDetailPane() {
    var pane = E("section", { class: "cr-detail", id: "cr-reldetail", "aria-label": "Release detail" });
    var rel = DATA.releases[selectedRel == null ? 0 : selectedRel];
    if (!rel) { pane.appendChild(E("div", { class: "hx-empty", style: "padding:var(--sp-6)" }, [I("review"), "Select a release."])); return pane; }
    var scroll = E("div", { class: "cr-detail__scroll" });
    var back = E("button", { class: "hx-btn hx-btn--sm hx-btn--ghost cr-back" }, [I("chevron"), "Back to releases"]);
    back.addEventListener("click", function () { var s = $("#cr-split"); if (s) s.setAttribute("data-pane", "list"); });
    scroll.appendChild(back);

    var h = E("header", { class: "hx-object-header" });
    var top = E("div", { class: "hx-object-header__top" });
    var titles = E("div", { class: "hx-object-header__titles" });
    titles.appendChild(E("div", { class: "hx-object-header__label", text: rel.artefact }));
    titles.appendChild(E("div", { class: "hx-object-header__id", text: rel.version + " · released by " + rel.by }));
    var chips = E("div", { class: "hx-object-header__chips" });
    var sm = { released: ["ok", "Released"], candidate: ["pending", "Candidate"], rolled_back: ["warn", "Rolled back"] }[rel.state] || ["neutral", TC(rel.state)];
    chips.appendChild(HX.chip(sm[0], sm[1], { lg: true }));
    if (rel.releasedAt) chips.appendChild(E("span", { class: "hx-trust-strip__v hx-mono", text: HX.format.time(rel.releasedAt, "known") }));
    titles.appendChild(chips); top.appendChild(titles);
    h.appendChild(top); scroll.appendChild(h);

    // gate metrics tiles
    scroll.appendChild(E("div", { class: "cr-h", text: "Gate metrics" + (rel.thresholds ? " (candidate — vs thresholds)" : "") }));
    var tiles = E("div", { class: "cr-metrictiles" });
    var gm = rel.gateMetrics || {};
    Object.keys(gm).forEach(function (k) {
      var v = gm[k], warn = false;
      if (rel.thresholds && rel.thresholds[k] != null) { warn = String(v) !== String(rel.thresholds[k]) && !(typeof v === "number" && typeof rel.thresholds[k] === "number" && v >= rel.thresholds[k]); }
      tiles.appendChild(E("div", { class: "cr-metric " + (warn ? "cr-metric--warn" : "cr-metric--ok") }, [
        E("div", { class: "cr-metric__k", text: TC(k) }),
        E("div", { class: "cr-metric__v", text: String(v) + (rel.thresholds && rel.thresholds[k] != null ? " / " + rel.thresholds[k] : "") })]));
    });
    scroll.appendChild(tiles);

    // quorum
    if (rel.quorum) scroll.appendChild(E("div", { style: "margin-bottom:var(--sp-2)" }, [HX.chip(rel.quorum.got >= rel.quorum.required ? "ok" : "pending", "Quorum " + rel.quorum.got + "/" + rel.quorum.required)]));

    // breaking flags
    scroll.appendChild(E("div", { class: "cr-h", text: "Breaking changes" }));
    if (arr(rel.breaking).length) rel.breaking.forEach(function (b) { scroll.appendChild(E("div", { class: "cr-dep cr-dep--blocked" }, [I("warn"), E("span", { text: b })])); });
    else scroll.appendChild(E("p", { class: "hx-muted hx-caption", text: "None." }));

    // migration notes + redirects
    scroll.appendChild(E("div", { class: "cr-h", text: "Migration notes" }));
    scroll.appendChild(E("p", { class: "cr-summary", text: rel.migrationNotes || "None." }));
    if (arr(rel.redirects).length) {
      scroll.appendChild(E("div", { class: "cr-h", text: "Redirect map (IRIs remain valid)" }));
      rel.redirects.forEach(function (r) { scroll.appendChild(E("div", { class: "cr-redirect" }, [E("code", { text: r.from }), I("chevron"), E("code", { text: r.to })])); });
    }

    // CRs in release
    scroll.appendChild(E("div", { class: "cr-h", text: "Change requests in this release" }));
    arr(rel.crs).forEach(function (id) {
      var row = E("div", { class: "cr-dep" }, [I("review"), depLink(id)]);
      scroll.appendChild(row);
    });

    // rollback flow
    if (rel.state === "rolled_back") {
      scroll.appendChild(E("div", { class: "hx-rollback-card", style: "margin-top:var(--sp-3)" }, [
        E("div", {}, [I("undo"), E("b", { text: "  Rolled back " + (rel.rolledBackAt ? HX.format.time(rel.rolledBackAt, "known") : "") })]),
        E("div", { class: "hx-caption", text: rel.migrationNotes || "Consumers re-pinned." })]));
    } else if (rel.state === "released") {
      var rb = E("button", { class: "hx-btn hx-btn--danger", style: "margin-top:var(--sp-3)" }, [I("undo"), "Roll back this release"]);
      rb.addEventListener("click", function () { rollbackRelease(rel); });
      scroll.appendChild(rb);
    } else if (rel.state === "candidate") {
      scroll.appendChild(E("p", { class: "cr-decision-note", style: "margin-top:var(--sp-3)" }, [I("info"), " Candidate — promotion is gated on the thresholds above (CQ 20/20, SHACL all, binding ≥ 95%). Promote from the Ontology stage rail once met."]));
    }

    pane.appendChild(scroll);
    return pane;
  }
  function rollbackRelease(rel) {
    HX.confirm({
      title: "Roll back " + rel.artefact + " " + rel.version, danger: true, confirmLabel: "Roll back",
      body: "What will happen: downstream consumers re-pin to the previous version; redirects are reversed; a compensating migration runs; a rollback CR is opened for the record.",
      consequence: "This is reversible within the operator cancel window, but affects live " + (rel.artefact) + " consumers."
    }).then(function (ok) {
      if (!ok) return;
      var prev = rel.state; rel.state = "rolled_back"; rel.rolledBackAt = new Date().toISOString();
      HX.audit.write({ type: "RELEASE_ROLLBACK", artefact: rel.artefact, version: rel.version, by: HX.role.principal() });
      renderShell();
      HX.toast(rel.artefact + " " + rel.version + " rolled back", {
        kind: "warn",
        undo: function () { rel.state = prev; rel.rolledBackAt = null; renderShell(); HX.live("Rollback cancelled", "polite"); }
      });
      HX.live("Release " + rel.version + " rolled back; consumers re-pinned.", "assertive");
    });
  }

  // =============================================================== KEYBOARD
  HX.keys.bind({
    "j": function () { if (VIEW !== "queue" || !queueRows.length) return; listIndex = Math.min(queueRows.length - 1, listIndex + 1); focusRow(); },
    "k": function () { if (VIEW !== "queue" || !queueRows.length) return; listIndex = Math.max(0, listIndex - 1); focusRow(); },
    "o": function () { if (VIEW === "queue" && queueRows[listIndex]) selectCR(queueRows[listIndex].id); },
    "x": function () { if (VIEW === "queue" && queueRows[listIndex]) { var id = queueRows[listIndex].id; if (byId(id) && byId(id).id === selectedId && isReviewing()) { actIfActionable("defer"); return; } toggleSelect(id); } },
    " ": function () { if (VIEW === "queue" && queueRows[listIndex]) { toggleSelect(queueRows[listIndex].id); return; } return false; },
    "a": function () { actIfActionable("approve"); },
    "A": function () { actIfActionable("approve_with_comment"); },
    "r": function () { actIfActionable("reject"); },
    "v": function () { actIfActionable("request_revision"); },
    "V": function () { actIfActionable("veto"); },
    "e": function () { if (isReviewing()) { setTab(byId(selectedId), "evidence"); cycleEvidence(); } },
    "h": function () { if (isReviewing()) setTab(byId(selectedId), "history"); },
    "p": function () { navChange(-1); },
    "n": function () { navChange(1); },
    "1": function () { jumpTab(0); }, "2": function () { jumpTab(1); }, "3": function () { jumpTab(2); }, "4": function () { jumpTab(3); },
    "5": function () { jumpTab(4); }, "6": function () { jumpTab(5); }, "7": function () { jumpTab(6); }, "8": function () { jumpTab(7); }
  });
  function isReviewing() { return VIEW === "queue" && !!byId(selectedId); }
  function focusRow() { var rows = $$(".cr-row"); if (rows[listIndex]) { rows[listIndex].focus(); rows[listIndex].scrollIntoView({ block: "nearest" }); } }
  function toggleSelect(id) { if (selection[id]) delete selection[id]; else selection[id] = true; var rows = $$(".cr-row"); rows.forEach(function (r) { if (r.dataset.id === id) { var c = r.querySelector(".cr-row__check"); if (c) c.checked = !!selection[id]; } }); renderBatchTray(); }
  function actIfActionable(verb) {
    var cr = byId(selectedId); if (!isReviewing() || !cr) return;
    if (!ACTIONABLE[cr.state] && cr.state !== "blocked") return;
    var bar = $("#cr-decision"); var btn = bar && bar.querySelector('button[data-verb="' + verb + '"]');
    if (!btn) { if (verb === "veto") HX.toast("Veto is a Privacy Officer verb — not available to your principal", { kind: "warn" }); return; }
    if (btn.getAttribute("aria-disabled") === "true") { HX.toast(approveTooltip(cr), { kind: "warn" }); return; }
    runDecision(cr, verb);
  }
  function jumpTab(i) { var cr = byId(selectedId); if (!isReviewing()) return; var tabs = tabList(cr); if (tabs[i]) setTab(cr, tabs[i].id); }
  function navChange(dir) {
    var panel = $("#cr-tabpanel"); if (!panel) return;
    var lines = $$(".hx-diff__line--add, .hx-diff__line--del", panel);
    if (!lines.length) return;
    navChange._i = (navChange._i == null ? -1 : navChange._i) + dir;
    if (navChange._i < 0) navChange._i = lines.length - 1; if (navChange._i >= lines.length) navChange._i = 0;
    lines.forEach(function (l) { l.style.outline = ""; });
    var t = lines[navChange._i]; t.style.outline = "2px solid var(--accent)"; t.scrollIntoView({ block: "center" });
  }

  // =============================================================== PALETTE act provider (page-scoped verbs)
  HX.palette.register(function (q) {
    if (!q || q[0] !== ">") return null;
    var cr = byId(selectedId); if (!cr) return null;
    var term = q.replace(/^>/, "").trim().toLowerCase();
    var acts = [
      { label: "Approve this CR", action: function () { actIfActionable("approve"); } },
      { label: "Request revision", action: function () { actIfActionable("request_revision"); } },
      { label: "Reject this CR", action: function () { actIfActionable("reject"); } },
      { label: "Open Evidence", action: function () { setTab(cr, "evidence"); cycleEvidence(); } },
      { label: "Copy canonical URL", action: function () { try { navigator.clipboard.writeText(location.origin + "/change-requests.html#/cr/" + cr.id); HX.toast("Copied", { kind: "ok", timeout: 1500 }); } catch (e) {} } }
    ].filter(function (a) { return !term || a.label.toLowerCase().indexOf(term) >= 0; });
    return { group: "Act on " + cr.id, items: acts };
  });

  // =============================================================== BOOT
  function parseHash() {
    var h = location.hash.slice(1);
    var qi = h.indexOf("?"); var route = qi < 0 ? h : h.slice(0, qi);
    var m = route.match(/^\/cr\/(CR-[A-Za-z0-9-]+)/);
    if (m) return { kind: "cr", id: m[1] };
    var r = route.match(/^\/release\//);
    if (r) return { kind: "releases" };
    return null;
  }

  Promise.all([HX.data.load("change-requests")]).then(function (res) {
    var d = res[0] || {};
    DATA.crs = arr(d.changeRequests);
    DATA.releases = arr(d.releases);
    DATA.savedViews = arr(d.savedViews);
    return applyFilter();
  }).then(function () {
    var hp = parseHash();
    if (hp && hp.kind === "cr" && byId(hp.id)) { selectedId = hp.id; }
    else if (hp && hp.kind === "releases") { VIEW = "releases"; selectedRel = 0; }
    else {
      // default: first actionable CR (needs you)
      var first = queueRows.filter(function (c) { return ACTIONABLE[c.state]; })[0] || queueRows[0];
      if (first) { selectedId = first.id; listIndex = queueRows.indexOf(first); }
    }
    renderShell();
  });

  // react to as-of changes (re-render footer/time-sensitive bits); keep it light
  HX.asof.on(function () { /* the review surface is current-time; as-of travels in the URL for object pages */ });

})();
  </script>
</body>
</html>
