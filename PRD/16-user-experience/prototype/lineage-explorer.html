<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HEALIX Console — Lineage Explorer</title>
  <meta name="description" content="Lineage explorer: trace a source element through mapping spec, Kafka topic, ConceptMap, KG property and EDW column — forwards and backwards — with a bitemporal lineage ribbon and a concept-neighbourhood graph canvas plus its synchronised list twin. Opens only from an object. Synthetic data only.">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    /* ================================================================
       lineage-explorer.html — page-local layout only.
       Every colour comes from the app.css design tokens; the temporal
       axes use the reserved --time-valid / --time-known tokens (via the
       shared as-of control and timeline only). This page is NOT a Home:
       without ?from it shows a resolver, never a canvas (brief §0, AC-09).
       Reflows to one column at 390px with a 16px gutter, no horizontal
       page scroll. All page JS is inline (app.js is never edited).
       ================================================================ */
    #le-root { max-width: var(--content-max); }
    .le-entry { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
      padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-card);
      background: var(--bg-sunken); margin-bottom: var(--sp-3); font-size: var(--fs-dense); }
    .le-entry__from { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--fg); }

    .le-modes { position: sticky; top: var(--topbar-h); z-index: 15; background: var(--bg-canvas);
      padding-top: var(--sp-1); margin-bottom: var(--sp-3); }

    /* resolver (landing refusal) */
    .le-resolver { max-width: 720px; margin: var(--sp-8) auto; }
    .le-resolver__box { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .le-resolver__box input { flex: 1 1 260px; min-width: 0; }
    .le-examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-4); }
    .le-example { text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
    .le-example:hover { border-color: var(--accent); }
    .le-example__id { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); word-break: break-all; }

    /* toolbar above ribbon / graph */
    .le-toolbar { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .le-toolbar__spacer { flex: 1 1 auto; }

    /* ribbon: clickable hops, flow arrows, placeholders */
    .le-ribbon .hx-lineage-ribbon__col h4 { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .le-ribbon .hx-lineage-ribbon__hop { gap: 4px; }
    .le-hop { width: 100%; text-align: left; cursor: pointer; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: var(--r-ctl); padding: var(--sp-2); display: flex;
      flex-direction: column; gap: 4px; font-size: var(--fs-caption); min-width: 0; }
    .le-hop:hover { border-color: var(--accent); }
    .le-hop[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .le-hop--dashed { border-style: dashed; }
    .le-hop--notasserted { opacity: .85; border-style: dotted; background: var(--bg-sunken); }
    .le-hop__label { font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
    .le-hop__obj { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-muted); overflow-wrap: anywhere; }
    .le-hop__meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .le-hop__changed { color: var(--time-known); font-weight: 600; }
    .le-colflow { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--fg-faint); }

    /* graph wrap + legend */
    .le-graph { display: grid; grid-template-columns: 2fr minmax(240px, 1fr); gap: var(--sp-3); align-items: start; }
    .le-graph--twin-hidden { grid-template-columns: 1fr; }
    .le-graph--twin-hidden .le-twin { display: none; }
    .le-twin { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
    .le-twin h3 { font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em; color: var(--fg-muted); }
    .le-legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--fs-micro); margin-top: var(--sp-2); color: var(--fg-muted); }
    .le-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .le-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--border-strong); }
    .le-legend i.inferred { border-top-style: dashed; }
    .le-legend i.faded { opacity: .3; }
    .le-legend b.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .le-legend b.phi { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--phi-direct); display: inline-block; }

    /* inspector detail */
    .le-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px var(--sp-3); font-size: var(--fs-dense); }
    .le-kv dt { color: var(--fg-muted); white-space: nowrap; }
    .le-kv dd { margin: 0; font-family: var(--font-mono); font-size: var(--fs-caption); overflow-wrap: anywhere; }
    .le-path-list { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .le-path-list li { font-family: var(--font-mono); font-size: var(--fs-caption); padding: 2px 0; }
    .le-path-list li::before { content: "↳ "; color: var(--fg-faint); }
    .le-path-list li:first-child::before { content: "● "; color: var(--accent); }

    @media (max-width: 1023px) {
      .le-graph, .le-graph--twin-hidden { grid-template-columns: 1fr; }
    }
    @media (max-width: 767px) {
      .le-modes { position: static; }
    }
  </style>

  <script>
  /* ====================================================================
     lineage-explorer.html — page-local controller (no app.js edits).

     Builds the Lineage Explorer on top of the shared HX runtime:
       · entry banner naming the object we were opened from;
       · a landing REFUSAL (no ?from ⇒ a resolver field, never a canvas);
       · a bitemporal Lineage ribbon (five columns Source · std · Canonical ·
         KG · EDW) with version chips AT TRACE TIME (as-of variants applied),
         dashed terminology hops with a ConceptMap chip, DQ badges per column,
         Upstream/Downstream toggle (same component), "not yet asserted"
         placeholders, and Copy trace as Markdown;
       · a concept-neighbourhood graph canvas (HX.graph: cap 150, clustering,
         group fill, PHI border, inferred ELK edges) with a synchronised list
         twin (v toggles), plus focus-depth, a shortest-path finder and a
         "Propose relation" CR draft.

     All state is in memory for the session (AC-17: no result payloads are
     persisted; only viewer prefs via the HX store).
     ==================================================================== */
  (function () {
    "use strict";
    var E = HX.util.el, I = HX.icon, CLEAR = HX.util.clear, TC = HX.util.titleCase;

    HX.mount({ page: "lineage-explorer", area: "gov", title: "Lineage Explorer" });

    var modesEl = document.getElementById("le-modes");
    var root = document.getElementById("le-root");

    var D = { traces: [], graphs: [], coverage: null };
    var IX = {
      traceById: {}, traceByFrom: {}, traceByConcept: {},
      graphById: {}, graphByFocus: {}, nodeToGraph: {}
    };
    var loaded = false;

    // session-only overlay: proposed relations create CR drafts in memory
    var MEM = { proposedRelations: [] };

    // view state (reset when ?from changes, unless user toggled)
    var VIEW = { from: null, mode: null, userMode: false, twinHidden: false, depth: 2,
                 ribbonDir: "downstream", focus: null, pathNodes: null, sel: [] };

    /* ---------------------------------------------------------------- icons */
    // family → short descriptor for the legend / list twin
    var FAMILY = {
      element: "Source element", hl7field: "HL7 field", mapspec: "Mapping spec",
      fhirpath: "FHIRPath", topic: "Kafka topic", conceptmap: "ConceptMap",
      valueset: "Value set", concept: "Concept", property: "KG property",
      class: "OWL class", shape: "SHACL shape", rule: "DQ rule",
      column: "EDW column", consumer: "Consumer", external: "External code"
    };

    /* ---------------------------------------------------------------- routing */
    function hashParts() {
      var h = location.hash.slice(1);
      var qi = h.indexOf("?");
      var route = (qi < 0 ? h : h.slice(0, qi)) || "/lineage";
      var params = {};
      if (qi >= 0) h.slice(qi + 1).split("&").forEach(function (p) {
        var eq = p.indexOf("="); if (eq < 0) return;
        params[p.slice(0, eq)] = decodeURIComponent(p.slice(eq + 1) || "");
      });
      return { route: route, params: params };
    }

    /* ------------------------------------------------------------ resolution */
    // Strip a family prefix ("element:", "column:", …) when matching a trace.from.
    function stripPrefix(id) { return String(id || "").replace(/^[a-z]+:/, ""); }

    function resolveFrom(from) {
      from = String(from || "").trim();
      var bare = stripPrefix(from);
      var trace = IX.traceById[from] || IX.traceByFrom[from] || IX.traceByFrom[bare] ||
                  IX.traceByConcept[from] || IX.traceByConcept[bare] || null;

      // find a graph + focus node for the Neighbourhood mode
      var graph = null, focus = null;
      if (IX.graphByFocus[from]) { graph = IX.graphByFocus[from]; focus = from; }
      else if (IX.graphByFocus[bare]) { graph = IX.graphByFocus[bare]; focus = bare; }
      else if (IX.nodeToGraph[from]) { graph = IX.graphById[IX.nodeToGraph[from]]; focus = from; }
      else if (IX.nodeToGraph[bare]) { graph = IX.graphById[IX.nodeToGraph[bare]]; focus = bare; }

      if (trace && !graph) {
        // prefer a neighbourhood graph focused on the trace's concept, else the
        // big lineage graph focused on the trace's source element node.
        if (IX.graphByFocus[trace.concept]) { graph = IX.graphByFocus[trace.concept]; focus = trace.concept; }
        else {
          var elNode = "element:" + trace.from;
          if (IX.nodeToGraph[elNode]) { graph = IX.graphById[IX.nodeToGraph[elNode]]; focus = elNode; }
          else if (IX.nodeToGraph[trace.concept]) { graph = IX.graphById[IX.nodeToGraph[trace.concept]]; focus = trace.concept; }
        }
      }
      return { from: from, trace: trace, graph: graph, focus: focus };
    }

    /* object-id → canonical route (for hop/node navigation, flow 2) */
    function routeForObject(objId) {
      var s = String(objId || "");
      var ci = s.indexOf(":");
      var fam = ci > 0 ? s.slice(0, ci) : null;
      var rest = ci > 0 ? s.slice(ci + 1) : s;
      switch (fam) {
        case "element": return "/element/" + rest;
        case "column": {
          var parts = rest.split("."); // edw_g2_clinical.dim_encounter_class.code
          if (parts.length >= 3) return "/column/" + parts[0] + "/" + parts[1] + "/" + parts.slice(2).join(".");
          return "/table/" + parts[0] + "/" + (parts[1] || "");
        }
        case "topic": return "/topic/" + rest;
        case "mapspec": return "/mapspec/" + rest;
        case "conceptmap": return "/conceptmap/" + rest;
        case "valueset": return "/valueset/" + rest;
        case "property": return "/property/" + rest;
        case "class": return "/class/" + rest;
        case "shape": return "/shape/" + rest;
        case "rule": return "/rule/" + rest;
        case "fhir": case "hl7": return null; // no canonical page in this prototype
        case "consumer": return null;
        case "sct": case "loinc": case "cpt": return null; // external codes
        default:
          // bare concept id "encounter-class/inpatient"
          if (/\//.test(s) && !/^https?:/.test(s)) return "/concept/" + s;
          return null;
      }
    }

    /* ---------------------------------------------------- as-of variant apply */
    // Apply trace.asOfVariants whose `before` boundary is still in the future
    // relative to the current valid-time (asOf). Sorted ascending so the state
    // nearest to asOf wins last. Returns a deep-ish copy of hops with overrides.
    function hopsAtAsOf(trace) {
      var asOf = HX.asof.get().asOf;
      var hops = (trace.hops || []).map(function (h) { return Object.assign({}, h); });
      var changed = {};
      if (asOf && Array.isArray(trace.asOfVariants)) {
        var tAsOf = Date.parse(asOf);
        trace.asOfVariants
          .filter(function (v) { return v.before && Date.parse(v.before) > tAsOf; })
          .sort(function (a, b) { return Date.parse(a.before) - Date.parse(b.before); })
          .forEach(function (v) {
            Object.keys(v.hopOverrides || {}).forEach(function (idx) {
              var i = +idx;
              if (hops[i]) { hops[i] = Object.assign({}, hops[i], v.hopOverrides[idx]); changed[i] = true; }
            });
          });
      }
      return { hops: hops, changed: changed };
    }

    // Is this hop "not yet asserted" at the current known-time?
    function notYetAsserted(hop) {
      if (!hop.recordedAt) return true; // pending / future migration
      var asKnownAt = HX.asof.get().asKnownAt;
      if (asKnownAt && Date.parse(hop.recordedAt) > Date.parse(asKnownAt)) return true;
      return false;
    }

    /* ================================================================ RENDER */
    function render() {
      if (!loaded) return;
      var hp = hashParts();
      var from = hp.params.from || null;
      if (from !== VIEW.from) { VIEW.from = from; VIEW.userMode = false; VIEW.focus = null; VIEW.pathNodes = null; VIEW.sel = []; }

      renderModes();

      if (!from) { renderResolver(); return; }

      var res = resolveFrom(from);
      if (!res.trace && !res.graph) { renderEmpty(res); return; }

      // decide default mode
      var primary = res.trace ? "ribbon" : "neighbourhood";
      if (!VIEW.userMode) VIEW.mode = primary;
      if (VIEW.mode === "ribbon" && !res.trace) VIEW.mode = "neighbourhood";
      if (VIEW.mode === "neighbourhood" && !res.graph) VIEW.mode = "ribbon";

      renderModes(res);
      CLEAR(root);
      root.appendChild(entryBanner(res));
      if (VIEW.mode === "ribbon") renderRibbon(res);
      else renderNeighbourhood(res);
    }

    /* ----------------------------------------------------- mode switch tabs */
    function renderModes(res) {
      CLEAR(modesEl);

    function routeToLineageFrom(route, q) {

    /* ============================================================= RIBBON */

        "Click a hop to inspect its transform, versions and provenance. Click a hop's object (or a DQ badge) to open its canonical page — the as-of you are viewing travels with you."
      ]));

    function hopEl(h, col, isChanged, trace) {

    function traceToMarkdown(trace, hops, dir) {

    /* ======================================================= NEIGHBOURHOOD */
    function renderNeighbourhood(res) {

      var notes = [];
      if (inferred) notes.push(inferred + " inferred (ELK) edge" + (inferred === 1 ? "" : "s"));

      // keyboard: v toggles the twin

    function toggleTwin() {

      if (w) w.classList.toggle("le-graph--twin-hidden", VIEW.twinHidden);

      HX.live(VIEW.twinHidden ? "List twin hidden" : "List twin shown", "polite");
    }

    function onNodeSelect(n, graph, vis, isFocusInit) {
      // selection model: keep last two distinct nodes for path / propose-relation
      if (!isFocusInit) {

      var body = E("div", { class: "hx-stack" });
      body.appendChild(E("div", { class: "hx-row" }, [

        (n.phi && n.phi !== "non-phi") ? HX.phiChip(n.phi) : null

      body.appendChild(E("strong", { text: n.label || n.id }));
      body.appendChild(E("div", { class: "le-hop__obj", text: n.id }));

      var edgeKinds = {};
      (graph.edges || []).forEach(function (e) { if (e.from === n.id || e.to === n.id) edgeKinds[e.kind] = (edgeKinds[e.kind] || 0) + 1; });
      var ek = E("div", { class: "hx-row" });
      Object.keys(edgeKinds).forEach(function (k) { ek.appendChild(HX.chip("neutral", k + " ×" + edgeKinds[k])); });
      if (ek.childNodes.length) body.appendChild(ek);

      var actions = E("div", { class: "hx-row", style: "margin-top:var(--sp-2)" });
      var focusBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I("lineage"), "Focus here"]);
      focusBtn.addEventListener("click", function () { VIEW.focus = n.id; VIEW.pathNodes = null; render(); });
      actions.appendChild(focusBtn);
      var r = routeForObject(n.id);
      if (r) {
        var openBtn = E("button", { class: "hx-btn hx-btn--sm hx-btn--primary" }, [I("chevron"), "Open page"]);
        openBtn.addEventListener("click", function () { HX.nav(r); });
        actions.appendChild(openBtn);
      }
      body.appendChild(actions);

      // two-node actions: shortest path + propose relation
      if (VIEW.sel.length === 2) {
        var a = VIEW.sel[0], b = VIEW.sel[1];
        body.appendChild(E("hr", { style: "border:0;border-top:1px solid var(--border)" }));
        body.appendChild(E("div", { class: "hx-caption", text: "Two nodes selected:" }));
        body.appendChild(E("div", { class: "le-hop__obj", text: a + "  ↔  " + b }));
        var pathBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I("lineage"), "Find shortest path"]);
        pathBtn.addEventListener("click", function () {
          var path = shortestPath(graph, a, b);
          if (!path) { HX.toast("No path between these nodes", { kind: "warn", timeout: 3000 }); return; }
          VIEW.pathNodes = path; render();
          HX.live("Path of " + path.length + " nodes highlighted", "polite");
        });
        var relBtn = E("button", { class: "hx-btn hx-btn--sm" }, [I("review"), "Propose relation (CR draft)"]);
        relBtn.addEventListener("click", function () {
          var draft = "CR-REL-DRAFT-" + Math.random().toString(36).slice(2, 7).toUpperCase();
          MEM.proposedRelations.push({ from: a, to: b, cr: draft });
          HX.audit.write({ type: "CR_DRAFT_CREATED", crType: "relation", from: a, to: b });
          HX.toast("Draft " + draft + " — propose relation " + shortId(a) + " → " + shortId(b), {
            kind: "ok",
            undo: function () { MEM.proposedRelations.pop(); HX.toast("Relation draft discarded", { kind: "neutral", timeout: 2500 }); }
          });
        });
        body.appendChild(E("div", { class: "hx-row" }, [pathBtn, relBtn]));
      } else {
        body.appendChild(E("div", { class: "hx-caption hx-muted", text: "Select a second node to find a path or propose a relation." }));
      }

      // if a path is active, list it
      if (VIEW.pathNodes) {
        body.appendChild(E("div", { class: "hx-caption", style: "margin-top:var(--sp-2)", text: "Shortest path" }));
        var ul = E("ul", { class: "le-path-list" });
        VIEW.pathNodes.forEach(function (id) { ul.appendChild(E("li", { text: shortLabel(graph, id) })); });
        body.appendChild(ul);
      }

      HX.inspector.open(body, "Node");
    }

    function shortLabel(graph, id) {
      var n = (graph.nodes || []).filter(function (x) { return x.id === id; })[0];
      return n ? (n.label || n.id) : shortId(id);
    }
    function shortId(id) { return String(id).split(":").pop().split("/").pop(); }

    /* ---- graph algorithms (adjacency, focus subgraph, BFS path) ----------- */
    function adjacency(graph) {
      if (graph._adj) return graph._adj;
      var adj = {};
      (graph.edges || []).forEach(function (e) {
        (adj[e.from] = adj[e.from] || []).push(e.to);
        (adj[e.to] = adj[e.to] || []).push(e.from);
      });
      graph._adj = adj; return adj;
    }
    function subgraphAround(graph, focus, depth) {
      if (depth === Infinity) return { nodes: graph.nodes.slice(), edges: graph.edges.slice() };
      var adj = adjacency(graph);
      var seen = {}; seen[focus] = 0;
      var frontier = [focus];
      for (var d = 0; d < depth; d++) {
        var next = [];
        frontier.forEach(function (id) {
          (adj[id] || []).forEach(function (nb) { if (!(nb in seen)) { seen[nb] = d + 1; next.push(nb); } });
        });
        frontier = next;
        if (!frontier.length) break;
      }
      return subgraphForNodes(graph, Object.keys(seen));
    }
    function subgraphForNodes(graph, nodeIds) {
      var set = {}; nodeIds.forEach(function (id) { set[id] = true; });
      var nodes = graph.nodes.filter(function (n) { return set[n.id]; });
      var edges = graph.edges.filter(function (e) { return set[e.from] && set[e.to]; });
      return { nodes: nodes, edges: edges };
    }
    function shortestPath(graph, a, b) {
      var adj = adjacency(graph);
      var prev = {}; prev[a] = null; var q = [a];
      while (q.length) {
        var cur = q.shift();
        if (cur === b) break;
        (adj[cur] || []).forEach(function (nb) { if (!(nb in prev)) { prev[nb] = cur; q.push(nb); } });
      }
      if (!(b in prev)) return null;
      var path = [], c = b;
      while (c != null) { path.unshift(c); c = prev[c]; }
      return path;
    }

    /* ---------------------------------------------------------- indexes */
    function buildIndexes() {
      D.traces.forEach(function (t) {
        IX.traceById[t.id] = t;
        if (t.from) IX.traceByFrom[t.from] = t;
        if (t.concept) IX.traceByConcept[t.concept] = t;
      });
      D.graphs.forEach(function (g) {
        IX.graphById[g.id] = g;
        if (g.focus) IX.graphByFocus[g.focus] = g;
        (g.nodes || []).forEach(function (n) { if (!(n.id in IX.nodeToGraph)) IX.nodeToGraph[n.id] = g.id; });
      });
    }

    /* ---------------------------------------------------------- palette */
    HX.palette.register(function (q) {
      if (!loaded || !q) return null;
      var n = q.toLowerCase(); var items = [];
      D.traces.filter(function (t) { return (t.id + " " + (t.label || "") + " " + t.from).toLowerCase().indexOf(n) >= 0; })
        .slice(0, 4).forEach(function (t) {
          items.push({ label: t.label || t.id, id: t.from, route: "/lineage", chips: ["lineage"], action: function () { HX.nav("/lineage", { from: t.from }); } });
        });
      D.graphs.forEach(function (g) {
        (g.nodes || []).filter(function (nd) { return (nd.id + " " + (nd.label || "")).toLowerCase().indexOf(n) >= 0; })
          .slice(0, 4).forEach(function (nd) {
            items.push({ label: nd.label || nd.id, id: FAMILY[nd.type] || nd.type, route: "/lineage", chips: [nd.group || "", nd.type || ""].filter(Boolean), action: function () { HX.nav("/lineage", { from: nd.id }); } });
          });
      });
      return items.length ? { group: "Lineage", items: items.slice(0, 8) } : null;
    });

    /* ---------------------------------------------------------- lifecycle */
    window.addEventListener("hashchange", render);
    HX.asof.on(function () { render(); }); // ribbon version overrides + edge fading react to as-of

    // boot: loading skeletons, then data (inline over file://, fetch over http)
    root.appendChild(E("div", { class: "hx-stack" }, [
      E("div", { class: "hx-skeleton", style: "height:56px" }),
      E("div", { class: "hx-skeleton", style: "height:240px" })
    ]));
    HX.data.load("lineage").then(function (d) {
      D.traces = d.traces || []; D.graphs = d.graphs || []; D.coverage = d.coverage || null;
      loaded = true; buildIndexes(); render();
    }).catch(function (e) {
      loaded = true; console.warn("Lineage data load issue:", e); render();
    });
  })();
  </script>
</body>
</html>
