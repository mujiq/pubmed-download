# HEALIX identifier system URI registry
# Source of truth for Identifier.system values permitted in hc.canonical.* records (IOP-01 §5, IOP-FHIR-004/015).
# Any mapping that emits a system not listed here is rejected by agent.evaluator (IOP-FHIR-016).
# phi_class values are the module 11 hc-phi-class tags (11-governance-security-compliance/01-hipaa-phi-and-privacy.md section 3):
#   phi:direct | phi:quasi | phi:clinical | phi:sensitive-category[/sud|/hiv|/mental-health|/reproductive|/genetic] |
#   pii:workforce | confidential:financial | confidential:operational | internal | public |
#   deidentified:safe-harbor | deidentified:expert | pseudonymised
# Identifiers that uniquely identify a patient record (HIPAA identifiers 1-2, 4-18; order/accession/claim/document numbers
# fall under identifier 18) are phi:direct unless certified as a non-derivable token (pseudonymised); unclassified -> phi:direct (GOV-PHI-003).
# permitted_in_canonical: false marks systems the validator must reject (IOP-E-PRIV-301); there is no 'prohibited' class in module 11.
# hl7_v2_type is the HL7 v2 table 0203 identifier type code used in Identifier.type and in CX-5.
# assigning_authority gives the HL7 v2 HD (namespace id, universal id, universal id type) when the identifier appears in v2.
version: 0.1.0
last_updated: 2026-10-17
base_uri: https://id.healix.example.org/
owners: [Integration Engineering, Privacy & Security Officer]

systems:
  # ---------- G1 Party & Identity: persons ----------
  - id: empi-enterprise-id
    uri: https://id.healix.example.org/empi/enterprise-id
    description: Enterprise person identifier assigned by HEALIX entity resolution (module 08)
    applies_to: [Patient, Person, RelatedPerson]
    hl7_v2_type: PI
    assigning_authority: {namespace_id: HEALIX, universal_id: 2.16.840.1.113883.3.9999.1.1, universal_id_type: ISO}
    assigner: HEALIX platform
    format: "^[0-9A-HJKMNP-TV-Z]{26}$"
    example: 01J9ZK8V2M3N4P5Q6R7S8T9UVW
    phi_class: phi:direct
  - id: empi-ssn-token
    uri: https://id.healix.example.org/empi/ssn-token
    description: Keyed SHA-256 token of SSN produced by module 11; raw SSN is never emitted
    applies_to: [Patient, Person]
    hl7_v2_type: SS
    assigner: HEALIX privacy service
    format: "^[a-f0-9]{64}$"
    phi_class: pseudonymised
    note: keyed one-way token per module 11 section 6.3; still PHI under HIPAA
  - id: cerner-mrn
    uri: https://id.healix.example.org/cerner/mrn
    description: Cerner Millennium Medical Record Number (PERSON_ALIAS, alias type MRN)
    applies_to: [Patient]
    hl7_v2_type: MR
    assigning_authority: {namespace_id: HOSP_A, universal_id: 2.16.840.1.113883.3.9999.2.1, universal_id_type: ISO}
    assigner: Cerner Millennium
    format: "^[0-9]{6,10}$"
    example: "123456"
    phi_class: phi:direct
  - id: cerner-person-id
    uri: https://id.healix.example.org/cerner/person-id
    description: Cerner PERSON.PERSON_ID surrogate key
    applies_to: [Patient, Practitioner, Person]
    hl7_v2_type: PI
    assigner: Cerner Millennium
    format: "^[0-9]{1,18}$"
    phi_class: phi:direct
  - id: us-ssn
    uri: http://hl7.org/fhir/sid/us-ssn
    description: US Social Security Number
    applies_to: []
    hl7_v2_type: SS
    assigner: Social Security Administration
    phi_class: phi:direct
    permitted_in_canonical: false
    note: Listed so the validator can emit IOP-E-PRIV-301 when encountered; never permitted in canonical.
  - id: us-mbi
    uri: http://hl7.org/fhir/sid/us-mbi
    description: Medicare Beneficiary Identifier
    applies_to: [Patient, Coverage]
    hl7_v2_type: MC
    assigner: CMS
    format: "^[1-9][AC-HJKMNP-RT-Yac-hjkmnp-rt-y][AC-HJKMNP-RT-Yac-hjkmnp-rt-y0-9][0-9][AC-HJKMNP-RT-Yac-hjkmnp-rt-y][AC-HJKMNP-RT-Yac-hjkmnp-rt-y0-9][0-9][AC-HJKMNP-RT-Yac-hjkmnp-rt-y]{2}[0-9]{2}$"
    phi_class: phi:direct
  - id: payer-member-id
    uri_template: https://id.healix.example.org/payer/{payer-id}/member-id
    description: Payer-assigned member/subscriber identifier; one system per payer id
    applies_to: [Coverage, Patient, RelatedPerson]
    hl7_v2_type: MB
    assigner: Payer
    phi_class: phi:direct

  # ---------- G1 Party & Identity: practitioners, organisations, locations ----------
  - id: us-npi
    uri: http://hl7.org/fhir/sid/us-npi
    description: National Provider Identifier
    applies_to: [Practitioner, Organization, PractitionerRole]
    hl7_v2_type: NPI
    assigning_authority: {namespace_id: NPI, universal_id: 2.16.840.1.113883.4.6, universal_id_type: ISO}
    assigner: CMS NPPES
    format: "^[0-9]{10}$"
    example: "1234567893"
    phi_class: public
  - id: dea
    uri: urn:oid:2.16.840.1.113883.4.814
    description: DEA registration number
    applies_to: [Practitioner]
    hl7_v2_type: DEA
    assigner: US Drug Enforcement Administration
    format: "^[A-Z]{2}[0-9]{7}$"
    phi_class: pii:workforce
  - id: state-licence
    uri_template: https://id.healix.example.org/licence/{state-iso2}
    description: State professional licence number; one system per state
    applies_to: [Practitioner]
    hl7_v2_type: MD
    assigner: State licensing board
    phi_class: public
  - id: ein
    uri: urn:oid:2.16.840.1.113883.4.4
    description: US Employer Identification Number
    applies_to: [Organization]
    hl7_v2_type: TAX
    assigner: IRS
    format: "^[0-9]{2}-?[0-9]{7}$"
    phi_class: confidential:financial
  - id: clia
    uri: urn:oid:2.16.840.1.113883.4.7
    description: CLIA laboratory certificate number
    applies_to: [Organization, Location]
    hl7_v2_type: XX
    assigner: CMS
    format: "^[0-9]{2}D[0-9]{7}$"
    phi_class: public
  - id: payer-id
    uri: https://id.healix.example.org/payer/payer-id
