    applies_to: [Observation, DocumentReference, DiagnosticReport]
    assigner: Cerner Millennium
    phi_class: phi:direct
  - id: document-unique-id
    uri: urn:ietf:rfc:3986
    description: Document unique identifier (C-CDA ClinicalDocument/id, XDS uniqueId / entryUUID) as urn:oid or urn:uuid
