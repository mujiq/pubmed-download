    assigner: Clearinghouse / CAQH
    phi_class: public
  - id: cerner-organization-id
    uri: https://id.healix.example.org/cerner/organization-id
    description: Cerner ORGANIZATION.ORGANIZATION_ID
    applies_to: [Organization]
    assigner: Cerner Millennium
    phi_class: internal
  - id: cerner-location-cd
    uri: https://id.healix.example.org/cerner/location-cd
    description: Cerner location code value (code set 220 facility / nurse unit / room / bed hierarchy)
    applies_to: [Location]
    assigner: Cerner Millennium
    phi_class: internal
  - id: oracle-legal-entity-id
    uri: https://id.healix.example.org/oracle/legal-entity-id
    description: Oracle Fusion XLE_ENTITY_PROFILES.LEGAL_ENTITY_ID
    applies_to: [Organization]
    assigner: Oracle Fusion ERP
    phi_class: internal
  - id: oracle-business-unit-id
    uri: https://id.healix.example.org/oracle/business-unit-id
    description: Oracle Fusion FUN_ALL_BUSINESS_UNITS_V.BU_ID
    applies_to: [Organization]
    assigner: Oracle Fusion ERP
    phi_class: internal
  - id: oracle-ledger-id
    uri: https://id.healix.example.org/oracle/ledger-id
    description: Oracle Fusion GL_LEDGERS.LEDGER_ID
    applies_to: [Organization]
    assigner: Oracle Fusion GL
    phi_class: internal
  - id: oracle-cost-center
