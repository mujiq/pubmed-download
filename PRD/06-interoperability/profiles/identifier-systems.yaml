    assigner: Cerner Millennium
    format: "^[A-Z0-9]{6,20}$"
    example: V2026001
    phi_class: phi:direct
  - id: cerner-encntr-id
    uri: https://id.healix.example.org/cerner/encntr-id
    description: Cerner ENCOUNTER.ENCNTR_ID surrogate key
    applies_to: [Encounter]
    hl7_v2_type: VN
    assigner: Cerner Millennium
    phi_class: phi:direct
  - id: cerner-placer-order
    uri: https://id.healix.example.org/cerner/placer-order
    description: Cerner ORDERS.ORDER_ID as placer order number (ORC-2 / OBR-2)
    applies_to: [ServiceRequest, MedicationRequest, DiagnosticReport, Observation]
    hl7_v2_type: PLAC
    assigner: Cerner Millennium
    phi_class: phi:direct
    note: HIPAA identifier 18 (unique identifying number); phi:direct per module 11 section 2 unless tokenised
  - id: cerner-filler-order
    uri: https://id.healix.example.org/cerner/filler-order
    description: Filler order number (ORC-3 / OBR-3) from Cerner or the performing LIS/RIS; OBX-4 sub-id appended for Observation
    applies_to: [ServiceRequest, DiagnosticReport, Observation, Specimen]
    hl7_v2_type: FILL
    assigner: Cerner Millennium / LIS / RIS
    phi_class: phi:direct
