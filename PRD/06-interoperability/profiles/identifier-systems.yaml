    description: Oracle Fusion POZ_SUPPLIER_SITES_ALL_M.VENDOR_SITE_ID
    applies_to: [Organization, Location]
    assigner: Oracle Fusion SCM
    phi_class: internal
  - id: oracle-inventory-org-id
    uri: https://id.healix.example.org/oracle/inventory-org-id
    description: Oracle Fusion INV_ORG_PARAMETERS.ORGANIZATION_ID
    applies_to: [Organization, Location]
    assigner: Oracle Fusion Inventory
    phi_class: internal
  - id: oracle-location-id
    uri: https://id.healix.example.org/oracle/location-id
    description: Oracle Fusion HR_LOCATIONS_ALL.LOCATION_ID (HCM/SCM physical locations)
    applies_to: [Location]
    assigner: Oracle Fusion
    phi_class: internal

  # ---------- G1/G5 Workforce ----------
