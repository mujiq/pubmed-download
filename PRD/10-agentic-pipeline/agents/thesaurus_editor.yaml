manifest_version: 0.1.0
id: agent.thesaurus_editor
role: Thesaurus Editor (Stage 3)
mission: >-
  Enrich the taxonomy into an ISO 25964-conformant thesaurus by proposing associative (skos:related),
  equivalence (exactMatch/closeMatch to external code systems) and hierarchical refinements, scope notes and
  usage notes, so that relations are stable before the ontologist promotes them to typed OWL properties.
pipeline_stage: [3]
owns_modules: ["02"]
autonomy_level: L2
autonomy_ceiling: L3
model:
  ref: "${MODEL_MAPPING}"
  recommended_default: claude-sonnet-5-5
  fallback_ref: "${MODEL_REASONING}"
  temperature: 0.2
  max_output_tokens: 8192
  structured_output: true
tools:
  - server: ontology-registry
    operations: [get_concept, search_concepts, get_hierarchy, get_relations, diff, propose_change]
    permission: propose
    phi_access: none
  - server: terminology-service
    operations: [lookup, translate, subsumes, expand]
    permission: read
    phi_access: none
  - server: graph-query
    operations: [sparql_select, sparql_ask, sparql_construct]
    permission: read
    phi_access: none
  - server: sql-sandbox
    operations: [run_query]
    permission: read
    phi_access: masked
  - server: cr-engine
    operations: [create_cr, get_cr, withdraw_cr]
    permission: propose
    phi_access: none
  - server: git
    operations: [read_file, create_branch, commit, open_pr]
    permission: propose
    phi_access: none
triggers:
  - kind: change_request
    cr_types: [taxonomy]
    description: A taxonomy CR was applied — look for associative/equivalence relations for the placed concept.
  - kind: schedule
    cron: "0 5 * * 2"
    description: Weekly co-occurrence mining over masked canonical samples to suggest skos:related candidates.
  - kind: manual
inputs:
  - Concepts with hierarchy but no associative or mapping relations
  - External mapping tables (SNOMED CT ↔ ICD-10-CM maps, LOINC ↔ SNOMED expression associations, RxNorm ↔ NDC)
  - Masked co-occurrence statistics (e.g. order code ↔ result code; item ↔ supplier category)
  - ISO 25964 relation typing rules
outputs:
  - artefact: skos:related, skos:exactMatch, skos:closeMatch, skos:broadMatch assertions with justification
    cr_type: thesaurus
    destination: cr-engine
  - artefact: Scope notes, history notes and editorial notes
    cr_type: thesaurus
    destination: cr-engine
  - artefact: Candidate-relation report with support/confidence statistics
    cr_type: null
    destination: hc.ops.agent.decision.v1
risk_classes: [low, medium]
evaluation:
  rubric_ids: [RUB-THS-01, RUB-EVD-01, RUB-PHI-01]
  auto_approve_threshold: 0.90
  human_agreement_target: 0.95
  golden_sets: [golden-thesaurus-relations-v1, golden-crosswalk-snomed-icd10cm-v1]
budgets:
  tokens_per_run: 120000
  runs_per_day: 100
  daily_token_cap: 6000000
  max_tool_calls_per_run: 250
  wall_clock_minutes_per_run: 60
  max_concurrent_runs: 4
  max_open_change_requests: 100
escalation:
  to: [Ontologist / Taxonomist, Terminology Steward]
  sla_hours: 72
  on_low_score: Downgrade exactMatch to closeMatch and resubmit once; else route to human.
  on_budget_exhausted: Flush completed proposals; mark remaining candidates for next run.
  on_veto: Withdraw CR.
  on_conflict: Merge relation proposals on the same concept pair into one CR.
memory:
  working: true
  episodic: true
  semantic_write: true
  procedural: true
  phi_retention: none
  episodic_retention_days: 2555
graduation:
  next_level: L3
  criteria:
    - ">= 300 evaluated thesaurus CRs over >= 90 days"
    - "exactMatch precision on golden crosswalks >= 0.98"
    - "Rollback rate <= 0.5 %"
  demotion_triggers:
    - An exactMatch later shown wrong in a DQ incident (demotion to L1 for 30 days).
