chaos_tests:                           # MEM-HEAL-013/041: ≥ 1 per trigger; run in `test` against the synthetic production-shape KG dataset (TKG-02 §8) with a store fault-injection proxy
  - id: CT1-drop-load-receipt
    trigger: kg.load_receipt_missing
    injection: "Fault proxy swallows the sink's load-receipt publish for sink instance kg-sink-02 while commits continue for 20 min; then a commit is held open (activity started, never ended)"
    expected_mttd_s: 900
    expected_mttr_s: 1800
    blast_radius_assert: "A1 retried exactly one batch ULID ≤ 5 attempts; 0 batch graphs dropped; receipt reappears; 0 duplicate assertionIds; actions touched 1 sink instance only"
  - id: CT2-corrupt-shacl-batch-version-skew
    trigger: kg.shacl_violation_rate
    injection: "Release shacl-shapes v2026.10.2 to the registry while proc.temporal-splitter for source cerner-fhir is pinned to mapping v2026.10.1 fixture, producing sh:Violation on clin:Condition.onsetDateTime range for 12 % of resources"
    expected_mttd_s: 300
    expected_mttr_s: 1800
    blast_radius_assert: "A4 pinned exactly one source to the previous *released* mapping/shape pair; isolated graph graph/dlq/<ulid> contains exactly the failing batch's assertion count; re-drive produced hashes identical to originals; exactly one `mapping` CR proposed; 0 SPARQL UPDATE executed outside the sink identity"
  - id: CT3-shape-content-mismatch-no-skew
    trigger: kg.shacl_violation_rate
    injection: "Versions aligned; shape fixture healix-shape:NoOverlapFunctional tightened so 8 % of Encounter resources violate; store healthy"
    expected_mttd_s: 300
    expected_mttr_s: 1800
    blast_radius_assert: "no pin applied (skew == false); one batch isolated; one `ontology`/`mapping` CR proposed with evidence pointers only (no sh:value literal in CR body — phi_scan clean); DLQ records count unchanged after run (none dropped)"
  - id: CT4-dlq-growth-temporal-skew
    trigger: kg.dlq_growth
    injection: "Simulator emits 800 canonical Observation resources with sourceTime 6 h ahead of eventTime (TKG-TIME-012 skew) in 10 min → DLQ reason TEMPORAL_SKEW"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "only A0 (severity S3) and A9 executed; 0 replays; 0 isolations; DQ issue opened non-blocking; ticket packet phi_scan clean; DLQ count unchanged"
  - id: CT5-store-5xx-burst
    trigger: kg.sink_error_rate
    injection: "Fault proxy returns HTTP 503 for 40 % of SPARQL UPDATE requests on partitions 3–4 of hc.kg.assertion.v1 (12-partition topic) for 15 min"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "A6 paused ≤ 1 partition (10 % of 12, floor) after dry-run; pause ≤ 1,800 s; resume used offsets from graph; backlog drained; 0 offset advanced past an uncommitted batch (no gap vs EDW on nightly reconciliation)"
  - id: CT6-transaction-too-large
    trigger: kg.sink_error_rate
    injection: "Backload fixture produces 5,000-event batches whose average triple count is 4× normal (Millennium CLINICAL_EVENT bulk) so the store rejects with STORE_REJECT"
    expected_mttd_s: 300
    expected_mttr_s: 1800
    blast_radius_assert: "A5 halved max_events on exactly one sink instance; bounds reverted after ttl; 0 single events dropped (any irreducible event appears in DLQ with reason STORE_REJECT, never discarded)"
  - id: CT7-latency-stall-compaction
    trigger: kg.load_latency_stalled
    injection: "Store compaction forced; commit p99 rises to 90 s and S9 p99 > 10 min for 15 min; disk_free_ratio 0.20"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "A1 backoff then A6 pause ≤ 10 % partitions; no restart of the store process; store_not_in_failover precondition respected; S10 availability ≥ 99.9 % throughout"
  - id: CT8-store-down-escalate-only
    trigger: kg.load_receipt_missing
    injection: "Store endpoint blackholed for all sink instances (store-wide outage fixture)"
    expected_mttd_s: 900
    expected_mttr_s: 900
    blast_radius_assert: "preconditions graph_store_reachable / single_sink_target_in_scope fail → escalated with ticket + page to store-engineering; 0 actions executed; module 12 DR runbook referenced in packet"
  - id: CT9-reconciliation-replay-asymmetry
    trigger: kg.reconciliation_mismatch
    injection: "Replay of hc.canonical.clinical.condition.fhir.v1 offsets 1,000,000–1,050,000 delivered to sink.edw only (KG sink filtered by fixture); nightly reconciliation reports recorded_count mismatch for (G2, Condition, D)"
    expected_mttd_s: 86400
    expected_mttr_s: 86400
    blast_radius_assert: "A3 re-drive ≤ 50,000 records (dry-run estimate honoured), hashes identical, 0 duplicates; A10 on-demand reconciliation matched ≥ 99.99 %; 0 rows copied between stores; DQR-CONSISTENCY-KG-EDW-001 issue opened and closed by the reconciler, not by the playbook"
  - id: CT10-reconciliation-hash-mismatch-no-autofix
    trigger: kg.reconciliation_mismatch
    injection: "EDW hist_encounter fixture altered for 20 business keys on recorded day D (content hash differs; counts equal)"
    expected_mttd_s: 86400
    expected_mttr_s: 86400
    blast_radius_assert: "no re-drive (replay_asymmetry false); only A0/A10/A9 ran; 0 writes to KG or EDW; differing business keys never fetched or stored by the playbook (phi:quasi); issue assigned to data-platform-steward"
  - id: CT11-current-view-drift
    trigger: kg.load_latency_stalled
    injection: "graph/current/G5 corrupted by fixture (120 stale base triples) while batch graphs are correct; S9 stall induced on the same sink"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "A7 rewrote only graph/current/G5; 0 batch graphs modified (content hashes unchanged); drift_rows == 0 after rebuild; S10 served from batch graphs during rebuild"
  - id: CT12-conflict-with-dq-storm
    trigger: kg.sink_error_rate
    injection: "CT5 fault plus a DQ rule storm (≥ 20 rules breaching) on the same topic partitions to trigger PBK-DQ-001 simultaneously"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "PBK-SINK-001 ran first; PBK-DQ-001 waited in playbook_selected until verifying (not suppressed; its detection continued); recursion ledger shows PBK-DQ-001 as child depth 1 with no re-trigger of PBK-SINK-001"

