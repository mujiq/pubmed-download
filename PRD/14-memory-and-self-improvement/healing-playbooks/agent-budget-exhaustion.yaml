    - hc.ops.healing.incident.event.v1
    - hc.ops.healing.playbookrun.event.v1
    - hc.ops.audit.v1
  connector_manifest: null                  # the target is an agent manifest (`agents/<role>.yaml`, AGT-01), read-only here; no Kafka Connect connector is involved

chaos_tests:                           # MEM-HEAL-013/041: ≥ 1 per trigger; run in `test` against the agent simulator (synthetic manifests `agent.chaos_mapper` with fallback_ref, mocked model gateway, disposable cache namespaces `pc.chaos_*`, synthetic trigger producer)
  - id: CT1-zero-token-budget
    trigger: agent.daily_token_cap_utilisation
    injection: "Set the simulator's effective daily_token_cap for agent.chaos_mapper to current usage + 1 % (the MEM-04 §10 'zero a token budget' fixture) while a steady 200-run/h mapping workload continues"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "exactly 1 agent targeted; A1 routes enum/classification routes to ${MODEL_CLASSIFICATION} (fallback_ref) at route boundary only; A2 pins effort standard and warms pc.chaos_* (0 bypass-listed namespaces enabled, 0 refused_phi); A3 defers schedule triggers only (0 event/CR triggers dropped, P0 CRs cycle p95 ≤ 1,800 s); A4 sets effective concurrency to ⌈n/2⌉ ≥ 1; manifest hash and all four budget fields unchanged; projected end-of-day ≤ cap within 3,600 s"
  - id: CT2-runs-per-day-exhausted
    trigger: agent.runs_per_day_exhausted
    injection: "Synthetic trigger producer fires 160 `profiling_complete` events in 20 min at agent.chaos_mapper whose runs_per_day is 150"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "budget_stop records with reason runs_per_day observed; A3 holds schedule triggers and the queue of event triggers is preserved in arrival order (0 dropped); runs_per_day unchanged; A6 ticket names the producer; held events resume at the simulated window reset"
  - id: CT3-budget-stop-burst-from-runaway-trigger
    trigger: agent.budget_stop_burst
    injection: "Replay a Fusion quarterly-update BICC manifest diff through the module-03 simulator emitting one `schema_change` trigger per changed column (1,800 events/h, ≈ 12× the 7-d baseline) at agent.chaos_mapper; tokens_per_run set so each run checkpoints at 80 %"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "trigger_baseline.max_ratio > 5 branch selected; A3/A4/A2 applied, A6 ticket cc's module-owner:03-source-systems with debounce_key_hash evidence; event triggers are not throttled (held only by concurrency); 0 budget raised; Incident -CAUSED_BY-> Topic(schema_change) edge recorded"
  - id: CT4-idempotency-reproposal-loop
    trigger: agent.idempotency_reproposal
    injection: "Mock `sql-sandbox.run_profile` to return a different transient error text on every call so agent.chaos_mapper re-proposes the same mapping CR (identical idempotency_key) 6 times in 40 min"
    expected_mttd_s: 300
    expected_mttr_s: 900
    blast_radius_assert: "A5 checkpoints and parks ≤ 3 runs with budget_stop reason loop_detected, blocks the key hash for 3,600 s; exactly 1 CR exists for the key (AGT-ORCH-009) and it is not withdrawn or edited; A4 halves concurrency; A6 ticket cc's tool-owner:sql-sandbox; parked runs are not auto-resumed by rollback"
  - id: CT5-identical-tool-call-streak
    trigger: agent.identical_tool_call_streak
    injection: "Mock `terminology-service.$translate` to return the same `404 ConceptMap not found` for one code system; agent.chaos_mapper calls it 9 times with identical params inside one run"
    expected_mttd_s: 300
    expected_mttr_s: 900
    blast_radius_assert: "streak ≥ 5 detected within 300 s; A5 parks the run (1 run, evidence preserved); identical_streak < 5 for 900 s thereafter; no action on any other agent; PBK-SEM-001 (unmapped-code surge on the same code system) runs `corr`, neither suppressed"
  - id: CT6-provider-429-wave
    trigger: provider.error_rate
    injection: "Mock model gateway returns HTTP 429 for 30 % of calls to ${MODEL_MAPPING} for 15 min while ${MODEL_CLASSIFICATION} stays healthy"
    expected_mttd_s: 120
    expected_mttr_s: 900
    blast_radius_assert: "A1 routes low-risk/enum routes of agent.chaos_mapper to fallback_ref (cr_payload_high/phi_affecting/canary routes excluded, 0 mid-route switches); A4 halves concurrency; A3 defers schedules; error rate on routes in use < 1 % within 900 s; structured-output failure rate ≤ baseline + 0.02; 0 overrides on agent.evaluator / agent.privacy_guardian"
  - id: CT7-provider-unreachable-through-proxy
    trigger: provider.error_rate
    injection: "Flip the GOV-ACC-018 egress proxy allow-list in `test` so every model_ref times out for 10 min (FLT-PLAT-006 fixture)"
    expected_mttd_s: 120
    expected_mttr_s: 0                 # expected outcome: contain and page — nothing to re-route to
    blast_radius_assert: "provider_unreachable branch: A1 not attempted (no healthy fallback), A3 + A4 applied, A6 pages platform-sre-primary within 60 s with SEV2; retry rate falls to ~0; at most 3 agents under override platform-wide, the rest escalate without action"
  - id: CT8-prompt-cache-collapse-after-release
    trigger: cache.c0_read_ratio_collapse
    injection: "Release prompt version chaos_mapper/1.5.0 via the simulator's policy.release topic with an ISO timestamp inserted into the system prefix above breakpoint 2 (MEM-03 §3.2 silent invalidator); 400 runs/h continue"
    expected_mttd_s: 3600
    expected_mttr_s: 3600
    blast_radius_assert: "c0_read_ratio < 0.50 for 1 h detected; A2 warms pc.chaos_* and pins effort (cache_write_tokens falls ≥ 50 %, 0 bypass-listed namespaces enabled); A3 defers schedules; A6 ticket names prompt_version 1.5.0 and cites MEM-CACHE-012; no prompt edited, no rollback of the release performed by the healer (that is an `agent_policy` CR / MEM-05 controller decision)"
  - id: CT9-cost-forecast-anomaly
    trigger: agent.cost_forecast_anomaly
    injection: "Inject a cost forecast of 100 USD/day for agent.chaos_mapper while the workload runs at 140 USD/day-equivalent tokens (+40 %) with no release, loop or provider fault present"
    expected_mttd_s: 3600
    expected_mttr_s: 3600
    blast_radius_assert: "default branch: A3 defers schedules and A6 tickets agent-operator; no routing/effort/concurrency change; `BudgetAnomaly` keeps evaluating (suppression notifications-only ≤ 3,600 s); cost projection back under forecast + 25 % within 3,600 s or ticket acknowledged within SLA"
  - id: CT10-oscillation-and-conflict
    trigger: agent.budget_stop_burst
    injection: "Run CT3 while PBK-ING-003 is executing on the same agent (agent.chaos_mapper drafting schema-drift CRs) and re-fire the trigger 3 times in one hour"
    expected_mttd_s: 300
    expected_mttr_s: 3600
    blast_radius_assert: "PBK-AGT-001 precedes PBK-ING-003 on the same agent (ING-003 waits in playbook_selected, not suppressed, wait visible on its incident — MEM-HEAL-020); third override within the hour is refused by `agent_not_oscillating` and the incident escalates; max_runs_per_hour 4 and cooldown 900 s enforced by the engine; recursion ledger depth ≤ 1, no re-trigger of the parent"

