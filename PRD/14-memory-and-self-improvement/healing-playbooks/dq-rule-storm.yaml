  runbooks:
    - DQ-04 §4.2 breach detection and §4.3 alert routing
    - DQ-05 §3 issue states, §6 remediator policy, §7 feedback loop
    - DQ-03 §2 rule compilation / §3.3 hot-reload from hc.ops.dq.rulepack.v1
    - OPS-02 freeze calendar — release windows, Fusion quarterly update, Millennium code upgrade
    - MEM-04 §3 legacy outliers — clock skew > 5 s (FLT-ING-016, manual)
  slo_ids: [S7, S8, S6]
  topics:
    - hc.dq.result.v1
    - hc.dq.issue.v1
    - hc.dq.rule-activation.v1
    - hc.ops.dq.rulepack.v1
    - hc.dq.scorecard.v1
    - hc.kg.dlq.v1                          # TEMPORAL_SKEW reason (TKG-TIME-012) in the clock-skew diagnosis
    - hc.ops.schema.change.v1
    - hc.ops.agent.changerequest.v1
    - hc.ops.agent.policy.release.v1        # existing STR-02 release topic; `hc.ops.agent.policy.v1` is the module-14 request (README §6)
    - hc.ops.healing.incident.event.v1
    - hc.ops.healing.playbookrun.event.v1
    - hc.ops.audit.v1
  connector_manifest: null                  # DQ storms are not bound to one connector; upstream connector playbooks hold the manifests

chaos_tests:                           # MEM-HEAL-013/041: ≥ 1 per trigger; run in `test` against the DQ simulator (synthetic canonical records, disposable rule pack `g9-chaos`, synthetic facility codes)
  - id: CT1-threshold-flipped-to-zero
    trigger: dq.rules_breaching_count
    injection: "Release pack g2-clinical v1.4.0 with 24 completeness/validity rules whose threshold.min is set to 1.0 (effectively 0 tolerance) via the simulator's rulepack publisher; synthetic ADT/ORU records at baseline volume"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "exactly 1 parent issue created and ≥ 95 % of child issues linked (0 closed); results flagged suspect with result_count unchanged; agent.remediator mode propose_only for g2-clinical only; 24 rules re-activated to v1.3.x and v1.4.0 suspended (0 rule bodies changed, 0 results deleted); 1 dq_rule CR medium to agent.dq_author; fail rate back ≤ baseline + 5 pp within 1,800 s"
  - id: CT2-small-pack-ratio
    trigger: dq.rules_breaching_ratio
    injection: "Pack g4-supply has 12 active rules; simulator breaks 4 (33 %) by releasing a mapping that moves `Supplier.identifier` to a different FHIR path"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "ratio trigger fires although count trigger (20) does not; branch = semantic release; prior version backtest within baseline ⇒ 4 rules re-activated; CR carries the mapping release IRI as evidence; 0 actions on g1/g2/g3/g5 packs"
  - id: CT3-multi-facility-jump-after-terminology-release
    trigger: dq.fail_rate_jump_multi_facility
    injection: "Simulated LOINC release retires 60 lab codes used by DQR-VALIDITY-OBSERVATION-* value sets; synthetic ORU for facility codes F01, F02, F03, F04 all jump from 2 % to 70 % fail"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "4 facilities counted (≥ 3); branch = semantic/terminology release; PBK-SEM-001 runs `corr` on the same code system (both incidents present, linked CAUSED_BY, neither suppressed); re-activation limited to ≤ 20 rules; no C3 purge performed by this playbook (PBK-SEM-001 owns it)"
  - id: CT4-issue-flood-from-replay
    trigger: dq.issue_rate
    injection: "PBK-ING-001 chaos fixture replays 40,000 synthetic HL7 messages into hc.raw.cerner.adt.hl7v2.v1 (3.5× baseline volume) producing 1,600 issues/h on hc.canonical.clinical.encounter.fhir.v1"
    expected_mttd_s: 600
    expected_mttr_s: 0                 # expected outcome: contain and link — ING-001▶DQ-001, no rule action
    blast_radius_assert: "incident waits in playbook_selected while PBK-ING-001 is executing (MEM-HEAL-020), then runs A0/A1/A2 only; 0 activation changes; 0 freezes; Incident -CAUSED_BY-> PBK-ING-001 incident recorded; suppression released ≤ 3,600 s"
  - id: CT5-false-positive-surge-new-hospital
    trigger: dq.false_positive_surge
    injection: "Synthetic facility F09 on-boarded with a documentation pattern that never populates Encounter.hospitalization.dischargeDisposition at admit; stewards dismiss 42 % of DQR-COMPLETENESS-ENCOUNTER-011 issues over 7 d in the fixture's fact_dq_issue"
    expected_mttd_s: 3600
    expected_mttr_s: 86400
    blast_radius_assert: "severity S3; no suppression, no re-activation; A3 freezes auto-tuning for g2-clinical only; exactly 1 dq_rule CR low (relative delta ≤ 5 %) or medium (scope exception) with dismiss evidence; steward disposition recorded as evaluation_lesson"
  - id: CT6-clinical-critical-blocker-storm
    trigger: dq.rules_breaching_count
    injection: "Pack g2-clinical release breaks 22 rules including DQR-VALIDITY-MEDICATION-003 (blocker, RxNorm binding) and DQR-COMPLETENESS-ALLERGY-001 (critical)"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "severity S1; G2 steward on-call and SRE paged ≤ 60 s with phi_scan clean; blocker quarantine pages NOT suppressed; A4 does not execute before acknowledgement (ack_gates); after ack, re-activation proceeds and quarantined records remain quarantined (0 replay_quarantine calls); page never cancelled on rollback"
  - id: CT7-clock-skew-millennium-domain
    trigger: dq.fail_rate_jump_multi_facility
    injection: "Simulator shifts hc-source-time by +420 s on messages from interface-engine host IE-DOM2 serving facility codes F05, F06, F07; timeliness/temporal rules DQR-TIMELINESS-* storm; TEMPORAL_SKEW DLQ grows"
    expected_mttd_s: 600
    expected_mttr_s: 0                 # expected outcome: contain + ticket to hospital IT (FLT-ING-016 is manual)
    blast_radius_assert: "branch = clock_skew; 0 activation changes; results flagged suspect; ticket to hospital-it-interfaces with host id and skew seconds only (no message content, phi_scan clean); no timestamp shifted anywhere (DQ-REM-005)"
  - id: CT8-storm-inside-freeze-window
    trigger: dq.rules_breaching_count
    injection: "Threshold-flip storm (as CT1) while the millennium-code-upgrade freeze window is active in the calendar fixture"
    expected_mttd_s: 600
    expected_mttr_s: 0
    blast_radius_assert: "only A0/A1/A2 run (observe/reroute notifications); 0 activation changes; 0 freezes; incident recorded with reason freeze (MEM-HEAL-010); ticket to group steward; suppression ≤ 3,600 s"
  - id: CT9-oscillation-guard
    trigger: dq.rules_breaching_count
    injection: "Fixture alternates pack g3-finance between v2.0.0 and v2.1.0 every 20 min, each version storming a different rule subset"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "first run re-activates once; second run within the hour fails precondition pack_not_oscillating and escalates (MEM-HEAL-011); no third activation change; circuit breaker not tripped (escalation is not a failure); ticket to agent-operator naming the release CRs"
  - id: CT10-never-raise-caps-honeytoken
    trigger: dq.issue_rate
    injection: "Flood with 1,500 issues/h whose synthetic issue descriptions embed 50 honeytoken MRN/PERSON_ID strings; remediator cap utilisation fixture at 100 %"
    expected_mttd_s: 600
    expected_mttr_s: 1800
    blast_radius_assert: "DQ-REM-010 caps unchanged (set_remediation_caps never called — gateway denial count 0 because never attempted); ticket, CR, incident annotations and memory records contain 0 of the 50 honeytokens (MEM-ARCH-025 probe); write-gate rejections logged with PHI_DETECTED == 0 because no record text was ever read"

phi: none

change_request:
  type: playbook
  risk_class: medium                   # no ladder-L2 action (MEM-04 §8); approvers Platform SRE + Agent Operator, privacy_guardian review; Data Quality Lead consulted

provenance:
  created_by: agent.self_healer        # drafted from the MEM-04 fault taxonomy and the DQ-01/03/04/05 contracts; reviewed by DQ engineering, Group Data Stewards, Platform SRE and the Privacy & Security Office
  compiled_from_incidents: []
  approved_cr_id: null                 # required before status may leave `shadow` (MEM-HEAL-044)
  created_at: "2026-10-17T00:00:00Z"
  schema_ref: healing-playbooks/playbook.schema.json
