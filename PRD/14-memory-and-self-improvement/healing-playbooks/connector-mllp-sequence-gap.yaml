chaos_tests:                           # MEM-HEAL-013/041: ≥ 1 per trigger; run in `test` with the HL7 v2 simulator sending sequence protocol
  - id: CT1-kill-listener
    trigger: hl7v2.channel_silence
    injection: "SIGKILL the connect.mllp-cerner task for facility channel HOSP_A while the simulator keeps sending 20 msg/s"
    expected_mttd_s: 120
    expected_mttr_s: 600
    blast_radius_assert: "exactly 1 connector task restarted; 0 writes outside hc.std.*; 0 messages to simulator (SRC-CER-024)"
  - id: CT2-inject-msh13-gap
    trigger: hl7v2.sequence_gap
    injection: "Simulator skips MSH-13 1001–1050 then continues; the skipped frames are later available via the engine resend stub"
    expected_mttd_s: 60
    expected_mttr_s: 900
    blast_radius_assert: "resend request covers exactly 50 sequence numbers; dedupe absorbs any duplicate; records replayed ≤ 50,000"
  - id: CT3-downstream-gap-in-raw
    trigger: hl7v2.sequence_gap
    injection: "Frames 2001–2200 produced to raw but std.hl7v2.parser consumer group offset advanced past them (simulated consumer skip)"
    expected_mttd_s: 120
    expected_mttr_s: 600
    blast_radius_assert: "replay limited to the 200-record offset range on one partition key prefix; V5 duplicate_processed delta == 0"
  - id: CT4-ack-storm
    trigger: hl7v2.ack_error_rate
    injection: "Broker min.insync.replicas violated for 90 s so produce times out and the listener returns AE on 100 % of frames"
    expected_mttd_s: 60
    expected_mttr_s: 600
    blast_radius_assert: "no AA returned for an unproduced frame (STR-CDC-007); listener restarted ≤ 1×; A4 replay only if gap_in_raw confirms"
  - id: CT5-engine-backlog-masked
    trigger: hl7v2.channel_silence
    injection: "Engine stub keeps ACKing the simulator but stops forwarding to HEALIX; queue depth grows to 5,000"
    expected_mttd_s: 120
    expected_mttr_s: 900
    blast_radius_assert: "A1 at most once; A2 not attempted while engine heartbeat age ≥ 300 s; ticket to Integration Engineer opened; no replay"
  - id: CT6-oscillation-and-freeze
    trigger: hl7v2.channel_silence
    injection: "Listener flaps 4× within 60 min while a facility freeze window is active"
    expected_mttd_s: 120
    expected_mttr_s: 0                 # expected outcome is suppressed/escalated, not healed
    blast_radius_assert: "0 restarts executed (freeze guard + oscillation guard); incident escalated with reason codes; suppression ≤ 3600 s notifications-only"

