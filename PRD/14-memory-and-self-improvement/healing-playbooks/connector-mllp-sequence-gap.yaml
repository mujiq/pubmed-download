      and typical Fortune-100 interface-engine behaviour (Cloverleaf/Rhapsody acknowledging to Millennium while the
      outbound route to HEALIX backs up). No production incidents yet; `compiled_from_incidents` fills as the curator
      mines Graphiti incident communities (MEM-04 §9).
    signatures_to_learn:
      - "gap size vs hour-of-day per facility (engine nightly restarts, Millennium batch windows)"
      - "AE storm preceded by produce-ack p99 > 200 ms (broker side) vs engine-side resend loops"
      - "silence that is a scheduled interface downtime (freeze calendar) vs a true backlog"
