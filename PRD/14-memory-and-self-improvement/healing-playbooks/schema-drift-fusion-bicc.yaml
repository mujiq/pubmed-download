      - "renames that are really remove+add with a type change (false `probable_rename` rate per PVO family)"
      - "null LAST_UPDATE_DATE bursts after data migrations / bulk loaders per offering (HCM vs FSCM)"
      - "compatibility failures caused by nullable→non-nullable flips vs genuine type changes"
