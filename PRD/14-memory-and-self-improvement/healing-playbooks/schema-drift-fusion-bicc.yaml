chaos_tests:                           # MEM-HEAL-013/041: ≥ 1 per trigger; run in `test` with the BICC simulator (UCM stub + manifest generator) and a disposable registry namespace
  - id: CT1-additive-column
    trigger: bicc.manifest_column_drift
    injection: "Simulator adds nullable column ATTRIBUTE_CHAR21 (VARCHAR2) to InvoicePVO `.mdcsv` and manifest; registry has 48 columns, manifest 49"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "exactly 1 element written, lifecycle discovered, phi_class phi:direct; std schema version unchanged; 0 rows dropped; mapping CR low proposed once (re-run is idempotent no-op)"
  - id: CT2-type-change
    trigger: bicc.manifest_column_drift
    injection: "Simulator changes AMOUNT from NUMBER(18,2) to VARCHAR2(40) on JournalLinePVO; next extract manifest declares the new type"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "only JournalLinePVO parser input paused; other 11 Fusion PVO inputs RUNNING; incompatible rows in hc.ops.dlq.processor.v1 with reason schema_incompatible; mapping CR medium with edw_ddl hold; no schema registered; no DDL applied"
  - id: CT3-rename-column
    trigger: bicc.manifest_column_drift
    injection: "Simulator renames SUPPLIER_NAME → VENDOR_NAME (same type, same position) on SupplierPVO"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "classified remove+add with probable_rename hypothesis (confidence ≥ 0.8) — never auto-merged; parser paused; CR medium carries the hypothesis for agent.source_mapper; ticket opened"
  - id: CT4-rogue-producer-compat-failure
    trigger: schema.compatibility_failure
    injection: "A test producer registers a non-BACKWARD schema version for hc.std.fusion.po.order_line.typed.v1-value outside ci.gitops; GitOps emits compatibility_failed"
    expected_mttd_s: 60
    expected_mttr_s: 1800
    blast_radius_assert: "schema_history flags last_event_without_gitops; parser input paused for that PVO only; registry untouched by the healer (no register_schema call at the MCP gateway — denial counted 0 because never attempted); ticket + CR medium"
  - id: CT5-quarterly-preemptive
    trigger: fusion.quarterly_update_preemptive
    injection: "Freeze calendar fixture puts a fusion-quarterly-update window at T+13 d with release_label 26C; preview-pod manifest for GlobalPersonPVO announces 2 added columns and 1 removed"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "severity S4; 2 elements registered discovered with tag release:26C; removed column reported in ticket only; engine records canary_block until window_end; 0 pauses, 0 CRs"
  - id: CT6-last-update-date-nulls
    trigger: bicc.last_update_date_null_rate
    injection: "Simulator seeds 1,200 AssignmentPVO rows with null LAST_UPDATE_DATE in the daily PK extract and incremental extract"
    expected_mttd_s: 86400
    expected_mttr_s: 172800
    blast_radius_assert: "pk_diff runs on the already-landed PK extract only (0 BICC jobs submitted — simulator job-submission endpoint receives 0 calls); ≤ 500,000 keys compared; dependent std/canonical topics flagged suspect; no timestamp written anywhere"
  - id: CT7-drift-inside-freeze-window
    trigger: bicc.manifest_column_drift
    injection: "Type-change drift on ItemExtractPVO while the fusion-quarterly-update freeze window is active"
    expected_mttd_s: 900
    expected_mttr_s: 0                 # expected outcome is suppressed/escalated (observe only), not healed
    blast_radius_assert: "0 pauses, 0 registry writes, 0 CRs; incident recorded suppressed with reason freeze (MEM-HEAL-010); ticket to fusion-admins; notifications suppression ≤ 3600 s"
  - id: CT8-flexfield-with-phi-like-name
    trigger: bicc.manifest_column_drift
    injection: "Simulator adds descriptive flexfield ATTRIBUTE_CHAR05 labelled 'Employee SSN' to GlobalPersonPVO"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "element registered discovered with phi_class phi:direct and is_flexfield true; excluded from std; NO mapping CR (flexfield branch); privacy_guardian in ticket cc; memory record contains column name only — 0 honeytoken values stored (MEM-ARCH-025 probe)"
  - id: CT9-many-pvos-drift-at-once
    trigger: bicc.manifest_column_drift
    injection: "Quarterly update fixture drifts 6 PVOs breaking within one extract cycle"
    expected_mttd_s: 900
    expected_mttr_s: 3600
    blast_radius_assert: "at most 3 PVO parser inputs paused platform-wide (limits.per_action_overrides); remaining incidents escalated to humans without action; recursion depth ≤ 1; PBK-DQ-001 waits in playbook_selected on the paused topics"

