# HEALIX topic catalog - machine-readable source of truth for module 07 (Streaming Platform).
# Schema: topics.schema.json (JSON Schema 2020-12). Validation command: see 02-topic-catalog.md section 8.
# Naming: hc.<layer>.<domain>[.<subdomain>].<entity>.<event-or-format>.v<N>  (CONVENTIONS.md section 3).
# Generated from the catalog definition; edit via a change request (hc.ops.agent.changerequest.v1), not by hand.
# phi_class values are the module 11 taxonomy (hc-phi-class header values); a topic carries the most restrictive class of its records.
catalog_version: 0.3.0
last_updated: "2026-10-17"
owner: Data Platform (module 07)
defaults:
  replication_factor: 3
  min_insync_replicas: 2
  unclean_leader_election: false
  message_timestamp_type: CreateTime
  compression_type: zstd
  compacted_topic_settings:
    min_compaction_lag_ms: 86400000
    delete_retention_ms: 604800000
    segment_ms: 86400000
  retention_ms_by_layer:
    raw: 2592000000
    std: 1209600000
    canonical: 7776000000
    dq: 7776000000
    kg: 2592000000
    edw: 1209600000
    ops: 604800000
  compatibility_by_layer:
    raw: BACKWARD
    std: BACKWARD
    canonical: BACKWARD_TRANSITIVE
    dq: BACKWARD_TRANSITIVE
    kg: FULL
    edw: FULL
    ops: BACKWARD
  # phi_classes = module 11 data-classification taxonomy (11-governance-security-compliance/01-hipaa-phi-and-privacy.md section 3)
  phi_classes: ["phi:direct", "phi:sensitive-category", "phi:sensitive-category/sud", "phi:sensitive-category/hiv", "phi:sensitive-category/mental-health", "phi:sensitive-category/reproductive", "phi:sensitive-category/genetic", "phi:clinical", "phi:quasi", "pseudonymised", "pii:workforce", "confidential:financial", "confidential:operational", "deidentified:expert", "deidentified:safe-harbor", "internal", "public"]
  key_formats: [string, avro]
  value_formats: [avro, avro-envelope, fhir-json, fhir-ext-json, json, protobuf]
